name: Deploy Cloudflare Worker

on:
  workflow_dispatch:
  push:
    branches: [ site-release ]
    paths:
      - 'cloudflare-worker/**'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Wrangler
        run: npm install -g wrangler@3

      - name: Verify Cloudflare Secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          [ -n "$CLOUDFLARE_API_TOKEN" ] || (echo "❌ CLOUDFLARE_API_TOKEN (CF_API_TOKEN) eksik" && exit 1)
          [ -n "$CLOUDFLARE_ACCOUNT_ID" ] || (echo "❌ CLOUDFLARE_ACCOUNT_ID (CF_ACCOUNT_ID) eksik" && exit 1)
          echo "✅ Cloudflare secrets hazır"

      - name: Deploy Worker
        working-directory: cloudflare-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          set -e
          echo "🔍 wrangler.toml kontrolü:"
          cat wrangler.toml || echo "⚠️ wrangler.toml bulunamadı"

          echo "🔑 Kimlik doğrulama testi:"
          npx wrangler whoami || echo "⚠️ whoami başarısız (devam ediliyor)"

          echo "🚀 Deploy başlatılıyor..."
          # wrangler.toml içinde account_id yoksa ekle
          if ! grep -q "^account_id" wrangler.toml; then
            echo "account_id = \"$CLOUDFLARE_ACCOUNT_ID\"" >> wrangler.toml
            echo "✓ account_id eklendi"
          fi

          npx wrangler deploy

          echo "✅ Deploy başarılı"

      - name: Set Worker Secrets (GitHub commit)
        working-directory: cloudflare-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          WORKER_GITHUB_TOKEN: ${{ secrets.WORKER_GITHUB_TOKEN }}
          WORKER_GITHUB_OWNER: ${{ secrets.WORKER_GITHUB_OWNER }}
          WORKER_GITHUB_REPO: ${{ secrets.WORKER_GITHUB_REPO }}
          WORKER_GITHUB_BRANCH: ${{ secrets.WORKER_GITHUB_BRANCH }}
        run: |
          set -e
          echo "⏳ Deploy global propagasyonu için 15 saniye bekleniyor..."
          sleep 15
          
          echo "🔑 Worker secrets ayarlanıyor (retry mekanizması ile)..."
          
          put_secret() {
            local name=$1
            local value=$2
            local attempt=1
            local max_attempts=3
            
            while [ $attempt -le $max_attempts ]; do
              echo "  Attempt $attempt/$max_attempts: $name"
              # Use printf to pipe value to wrangler, capture exit code
              if printf '%s' "$value" | wrangler secret put "$name" 2>&1 | tee /tmp/secret_output.log | grep -iE "success|✓|added|saved"; then
                echo "  ✓ $name ayarlandı"
                return 0
              elif [ $? -eq 0 ]; then
                # wrangler exited successfully even without success message, assume it worked
                echo "  ✓ $name ayarlandı (sessiz başarı)"
                return 0
              fi
              if [ $attempt -lt $max_attempts ]; then
                echo "  ⏳ 2 saniye sonra tekrar deniyor..."
                sleep 2
              fi
              ((attempt++))
            done
            
            echo "  ⚠️ $name ayarlanamadı (sonraki smoke test'te görebiliriz)"
            echo "  Son çıktı: $(cat /tmp/secret_output.log 2>/dev/null || echo 'N/A')"
            return 0
          }
          
          [ -n "$WORKER_GITHUB_TOKEN" ] && put_secret "GITHUB_TOKEN" "$WORKER_GITHUB_TOKEN"
          [ -n "$WORKER_GITHUB_OWNER" ] && put_secret "GITHUB_OWNER" "$WORKER_GITHUB_OWNER"
          [ -n "$WORKER_GITHUB_REPO" ] && put_secret "GITHUB_REPO" "$WORKER_GITHUB_REPO"
          [ -n "$WORKER_GITHUB_BRANCH" ] && put_secret "GITHUB_BRANCH" "$WORKER_GITHUB_BRANCH"
          
          echo "✅ Worker secrets işlemi tamamlandı"

      - name: Smoke Test
        env:
          WORKER_URL: ${{ secrets.WORKER_URL }}
        timeout-minutes: 5
        run: |
          if [ -z "$WORKER_URL" ]; then
            echo "⚠️ WORKER_URL tanımlı değil, smoke test atlanıyor"
            exit 0
          fi
          
          echo "🧪 Smoke test: $WORKER_URL"
          echo "📋 URL validation:"
          # Validate URL format
          if [[ ! "$WORKER_URL" =~ ^https?:// ]]; then
            echo "❌ WORKER_URL scheme missing! Must start with http:// or https://"
            echo "   Got: $WORKER_URL"
            exit 1
          fi
          
          # Test 1: OPTIONS request
          echo -e "\n📍 Test 1: /update-user OPTIONS"
          RESPONSE=$(curl -i -s -m 10 -X OPTIONS "$WORKER_URL/update-user" \
            -H "Origin: https://ern-cicek.com.tr" \
            -H "Access-Control-Request-Method: POST" \
            -H "Access-Control-Request-Headers: content-type" 2>&1)
          CURL_EXIT=$?
          echo "$RESPONSE" | head -20
          if [ $CURL_EXIT -ne 0 ]; then
            echo "⚠️ curl exit code $CURL_EXIT"
          fi
          if echo "$RESPONSE" | grep -q "HTTP.*200\|HTTP.*204"; then
            echo "✓ OPTIONS test başarılı"
          else
            echo "⚠️ OPTIONS test başarısız"
          fi
          
          # Test 2: Update user
          echo -e "\n📍 Test 2: /update-user POST"
          RESPONSE=$(curl -i -s -m 10 -X POST "$WORKER_URL/update-user" \
            -H "Origin: https://ern-cicek.com.tr" \
            -H "Content-Type: application/json" \
            --data '{"email":"ci@example.com","name":"CI User","phone":"+90 530 000 00 00","addresses":[{"id":"default","title":"Varsayılan","city":"İstanbul","district":"Kadıköy","addressDetail":"CI Sk No:1","postalCode":"34000","isDefault":true}]}' 2>&1)
          CURL_EXIT=$?
          echo "$RESPONSE" | head -25
          if [ $CURL_EXIT -ne 0 ]; then
            echo "⚠️ curl exit code $CURL_EXIT"
          fi
          if echo "$RESPONSE" | grep -q "HTTP.*200\|success"; then
            echo "✓ Update user test başarılı"
          else
            echo "⚠️ Update user test başarısız"
          fi
          
          # Test 3: Send order
          echo -e "\n📍 Test 3: /send-order POST"
          TIMESTAMP=$(date +%s)
          RESPONSE=$(curl -i -s -m 10 -X POST "$WORKER_URL/send-order" \
            -H "Origin: https://ern-cicek.com.tr" \
            -H "Content-Type: application/json" \
            --data "{\"order\":{\"id\":\"ORD-CI-$TIMESTAMP\",\"customerEmail\":\"ci@example.com\",\"customerName\":\"CI User\",\"address\":\"İstanbul\",\"items\":[{\"name\":\"Gül\",\"qty\":1,\"price\":199}],\"total\":199}}" 2>&1)
          CURL_EXIT=$?
          echo "$RESPONSE" | head -25
          if [ $CURL_EXIT -ne 0 ]; then
            echo "⚠️ curl exit code $CURL_EXIT"
          fi
          if echo "$RESPONSE" | grep -q "HTTP.*200\|success"; then
            echo "✓ Send order test başarılı"
          else
            echo "⚠️ Send order test başarısız"
          fi
          
          echo -e "\n✅ Smoke testler tamamlandı"
