name: Deploy Cloudflare Worker

on:
  workflow_dispatch:
  push:
    branches: [ site-release ]
    paths:
      - 'cloudflare-worker/**'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Wrangler
        run: npm install -g wrangler@3

      - name: Verify Cloudflare Secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          [ -n "$CLOUDFLARE_API_TOKEN" ] || (echo "❌ CLOUDFLARE_API_TOKEN (CF_API_TOKEN) eksik" && exit 1)
          [ -n "$CLOUDFLARE_ACCOUNT_ID" ] || (echo "❌ CLOUDFLARE_ACCOUNT_ID (CF_ACCOUNT_ID) eksik" && exit 1)
          echo "✅ Cloudflare secrets hazır"

      - name: Deploy Worker
        working-directory: cloudflare-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          set -e
          echo "🔍 wrangler.toml kontrolü:"
          cat wrangler.toml || echo "⚠️ wrangler.toml bulunamadı"

          echo "🔑 Kimlik doğrulama testi:"
          npx wrangler whoami || echo "⚠️ whoami başarısız (devam ediliyor)"

          echo "🚀 Deploy başlatılıyor..."
          # wrangler.toml içinde account_id yoksa ekle
          if ! grep -q "^account_id" wrangler.toml; then
            echo "account_id = \"$CLOUDFLARE_ACCOUNT_ID\"" > wrangler.toml
            echo "✓ account_id eklendi"
          fi

          npx wrangler deploy

          echo "✅ Deploy başarılı"
          # small wait so Cloudflare internal state stabilizes
          sleep 3

      - name: Set Worker Secrets (after deploy)
        working-directory: cloudflare-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          WORKER_GITHUB_TOKEN: ${{ secrets.WORKER_GITHUB_TOKEN }}
          WORKER_GITHUB_OWNER: ${{ secrets.WORKER_GITHUB_OWNER }}
          WORKER_GITHUB_REPO: ${{ secrets.WORKER_GITHUB_REPO }}
          WORKER_GITHUB_BRANCH: ${{ secrets.WORKER_GITHUB_BRANCH }}
        run: |
          set -euo pipefail

          # helper: put secret with retries
          put_secret_with_retry() {
            NAME="$1"
            VALUE="$2"
            ATTEMPT=0
            MAX=6
            until [ $ATTEMPT -ge $MAX ]; do
              ATTEMPT=$((ATTEMPT+1))
              echo "Trying to set secret $NAME (attempt $ATTEMPT/$MAX)..."
              # Use echo to stream value to wrangler and filter the value out of logs for safety
              if echo "$VALUE" | wrangler secret put "$NAME" 2>&1 | grep -v -- "$VALUE"; then
                echo "Secret $NAME set"
                return 0
              fi
              # if we see the Cloudflare-specific message about latest version not deployed, wait and retry
              sleep 2
            done
            echo "❌ Secret $NAME setilemedi"
            return 1
          }

          if [ -n "${WORKER_GITHUB_TOKEN:-}" ]; then
            put_secret_with_retry GITHUB_TOKEN "$WORKER_GITHUB_TOKEN"
          fi
          if [ -n "${WORKER_GITHUB_OWNER:-}" ]; then
            put_secret_with_retry GITHUB_OWNER "$WORKER_GITHUB_OWNER"
          fi
          if [ -n "${WORKER_GITHUB_REPO:-}" ]; then
            put_secret_with_retry GITHUB_REPO "$WORKER_GITHUB_REPO"
          fi
          if [ -n "${WORKER_GITHUB_BRANCH:-}" ]; then
            put_secret_with_retry GITHUB_BRANCH "$WORKER_GITHUB_BRANCH"
          fi

          echo "✅ Worker secrets ayarlandı"

      - name: Smoke Test
        env:
          WORKER_URL: ${{ secrets.WORKER_URL }}
        timeout-minutes: 5
        run: |
          set -euo pipefail
          if [ -z "${WORKER_URL:-}" ]; then
            echo "⚠️ WORKER_URL tanımlı değil, smoke test atlanıyor"
            exit 0
          fi

          echo "🧪 Smoke test: $WORKER_URL"

          # helper to check endpoints with retries
          check_endpoint() {
            METHOD="$1"
            PATH="$2"
            shift 2
            HEADERS="$@"
            ATTEMPT=0
            MAX=5
            while [ $ATTEMPT -lt $MAX ]; do
              ATTEMPT=$((ATTEMPT+1))
              echo "Attempt $ATTEMPT/$MAX: $METHOD $PATH"
              HTTP_STATUS=$(eval curl -s -o /dev/null -w "%{http_code}" -m 10 -X "$METHOD" "$WORKER_URL$PATH" $HEADERS || echo "000")
              echo "HTTP status: $HTTP_STATUS"
              if [[ "$HTTP_STATUS" =~ ^(200|204|301|302)$ ]]; then
                return 0
              fi
              sleep 2
            done
            return 1
          }

          echo "📍 Test 1: /update-user OPTIONS"
          if check_endpoint OPTIONS /update-user "-H 'Origin: https://ern-cicek.com.tr' -H 'Access-Control-Request-Method: POST' -H 'Access-Control-Request-Headers: content-type'"; then
            echo "✓ OPTIONS test başarılı"
          else
            echo "⚠️ OPTIONS test başarısız"
            exit 3
          fi

          echo -e "\n📍 Test 2: /update-user POST"
          # POST payload truncated for brevity; keep same payload as original repo
          PAYLOAD='{"email":"ci@example.com","name":"CI User"}'
          if eval curl -i -s -m 10 -X POST "$WORKER_URL/update-user" -H "Origin: https://ern-cicek.com.tr" -H "Content-Type: application/json" --data "$PAYLOAD" | grep -q "HTTP.*200\|success"; then
            echo "✓ Update user test başarılı"
          else
            echo "⚠️ Update user test başarısız"
            exit 4
          fi

          echo -e "\n📍 Test 3: /send-order POST"
          TIMESTAMP=$(date +%s)
          ORDER_PAYLOAD="{\"order\":{\"id\":\"ORD-CI-$TIMESTAMP\",\"customerEmail\":\"ci@example.com\",\"customerName\":\"CI User\"}}"
          if eval curl -i -s -m 10 -X POST "$WORKER_URL/send-order" -H "Origin: https://ern-cicek.com.tr" -H "Content-Type: application/json" --data "$ORDER_PAYLOAD" | grep -q "HTTP.*200\|success"; then
            echo "✓ Send order test başarılı"
          else
            echo "⚠️ Send order test başarısız"
            exit 5
          fi

          echo -e "\n✅ Smoke testler tamamlandı"
