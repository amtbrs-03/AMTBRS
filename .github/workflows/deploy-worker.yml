name: Deploy Cloudflare Worker

on:
  workflow_dispatch:
  push:
    branches: [ site-release ]
    paths:
      - 'cloudflare-worker/**'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Wrangler
        run: npm install -g wrangler@3

      - name: Verify Cloudflare Secrets
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          [ -n "$CF_API_TOKEN" ] || (echo "CF_API_TOKEN missing" && exit 1)
          [ -n "$CF_ACCOUNT_ID" ] || (echo "CF_ACCOUNT_ID missing" && exit 1)

      - name: Set Worker Secrets (GitHub commit)
        working-directory: cloudflare-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          WORKER_GITHUB_TOKEN: ${{ secrets.WORKER_GITHUB_TOKEN }}
          WORKER_GITHUB_OWNER: ${{ secrets.WORKER_GITHUB_OWNER }}
          WORKER_GITHUB_REPO: ${{ secrets.WORKER_GITHUB_REPO }}
          WORKER_GITHUB_BRANCH: ${{ secrets.WORKER_GITHUB_BRANCH }}
        run: |
          if [ -n "$WORKER_GITHUB_TOKEN" ]; then
            echo "$WORKER_GITHUB_TOKEN" | wrangler secret put GITHUB_TOKEN
          fi
          if [ -n "$WORKER_GITHUB_OWNER" ]; then
            echo "$WORKER_GITHUB_OWNER" | wrangler secret put GITHUB_OWNER
          fi
          if [ -n "$WORKER_GITHUB_REPO" ]; then
            echo "$WORKER_GITHUB_REPO" | wrangler secret put GITHUB_REPO
          fi
          if [ -n "$WORKER_GITHUB_BRANCH" ]; then
            echo "$WORKER_GITHUB_BRANCH" | wrangler secret put GITHUB_BRANCH
          fi
          echo "✅ Worker secrets ayarlandı"

      - name: Deploy Worker
        working-directory: cloudflare-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          echo "🔍 wrangler.toml kontrolü:"
          cat wrangler.toml || echo "⚠️ wrangler.toml bulunamadı"
          
          echo "🔑 Kimlik doğrulama testi:"
          wrangler whoami || echo "⚠️ whoami başarısız (devam ediliyor)"
          
          echo "🚀 Deploy başlatılıyor..."
          # Add account_id to wrangler.toml temporarily if not present
          if ! grep -q "^account_id" wrangler.toml; then
            echo "account_id = \"$CLOUDFLARE_ACCOUNT_ID\"" >> wrangler.toml
            echo "✓ account_id eklendi"
          fi
          
          wrangler deploy
          
          echo "✅ Deploy başarılı"

      - name: Smoke Test
        env:
          WORKER_URL: ${{ secrets.WORKER_URL }}
        run: |
          if [ -z "$WORKER_URL" ]; then
            echo "⚠️ WORKER_URL tanımlı değil, smoke test atlanıyor"
            exit 0
          fi
          
          echo "🧪 Smoke test: $WORKER_URL"
          
          echo "📍 Test 1: /update-user OPTIONS"
          curl -i -s -X OPTIONS "$WORKER_URL/update-user" \
            -H "Origin: https://ern-cicek.com.tr" \
            -H "Access-Control-Request-Method: POST" \
            -H "Access-Control-Request-Headers: content-type" | head -15
          
          echo -e "\n📍 Test 2: /update-user POST"
          curl -i -s -X POST "$WORKER_URL/update-user" \
            -H "Origin: https://ern-cicek.com.tr" \
            -H "Content-Type: application/json" \
            --data '{"email":"ci@example.com","name":"CI User","phone":"+90 530 000 00 00","addresses":[{"id":"default","title":"Varsayılan","city":"İstanbul","district":"Kadıköy","addressDetail":"CI Sk No:1","postalCode":"34000","isDefault":true}]}' | head -25
          
          echo -e "\n📍 Test 3: /send-order POST"
          TIMESTAMP=$(date +%s)
          curl -i -s -X POST "$WORKER_URL/send-order" \
            -H "Origin: https://ern-cicek.com.tr" \
            -H "Content-Type: application/json" \
            --data "{\"order\":{\"id\":\"ORD-CI-$TIMESTAMP\",\"customerEmail\":\"ci@example.com\",\"customerName\":\"CI User\",\"address\":\"İstanbul\",\"items\":[{\"name\":\"Gül\",\"qty\":1,\"price\":199}],\"total\":199}}" | head -25
          
          echo -e "\n✅ Smoke testler tamamlandı"
