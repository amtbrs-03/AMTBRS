name: Register User API

on:
  workflow_dispatch:
    inputs:
      email:
        description: 'User email'
        required: true
        type: string
      user_data:
        description: 'User data JSON'
        required: true
        type: string

permissions:
  contents: write

jobs:
  register-user:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: site-release
          
      - name: Create users directory
        run: mkdir -p users
        
      - name: Save user data
        run: |
          echo '${{ inputs.user_data }}' > users/${{ inputs.email }}_full.json
          
      - name: Commit and push
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"
          git add users/
          git commit -m "Register user: ${{ inputs.email }}" || echo "No changes to commit"
          git push origin site-release
