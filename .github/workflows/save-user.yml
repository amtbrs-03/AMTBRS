name: Save User Data

on:
  repository_dispatch:
    types: [save-user]

permissions:
  contents: write

jobs:
  save-user:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: site-release
          
      - name: Create users directory
        run: mkdir -p users
        
      - name: Save user data
        run: |
          echo '${{ github.event.client_payload.user_data }}' > users/${{ github.event.client_payload.email }}_full.json
          
      - name: Commit and push
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"
          git add users/
          git commit -m "Save user: ${{ github.event.client_payload.email }}" || echo "No changes to commit"
          git push origin site-release
