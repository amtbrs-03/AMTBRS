name: Update Products

on:
  repository_dispatch:
    types: [update-products]

permissions:
  contents: write

jobs:
  update-products:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: site-release
          
      - name: Save products data
        run: |
          echo '${{ github.event.client_payload.data }}' > products.json
          
      - name: Commit and push
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"
          git add products.json
          git commit -m "${{ github.event.client_payload.message }}" || echo "No changes to commit"
          git push origin site-release
