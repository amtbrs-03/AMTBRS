<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Bilgi Fişleri - ERN-ÇİÇEK Admin</title>
  <style>
    :root{
      --green-primary: #10b981;
      --green-dark: #059669;
      --green-light: #34d399;
      --orange: #f59e0b;
      --muted:#6b7280;
      --bg-1: rgba(34,197,94,0.10);
      --bg-2: rgba(16,185,129,0.08);
      --card-bg: rgba(255,255,255,0.98);
    }

    body{
      font-family: 'Segoe UI', 'Inter', 'Noto Sans', Tahoma, Arial, sans-serif;
      padding:0;
      margin:0;
      color:#0f172a;
      background: radial-gradient(1200px 600px at 10% 10%, var(--bg-1), transparent),
                  radial-gradient(800px 400px at 90% 90%, var(--bg-2), transparent),
                  linear-gradient(180deg, #ecfdf5 0%, #064e3b 100%);
      -webkit-font-smoothing:antialiased;
      -moz-osx-font-smoothing:grayscale;
      min-height:100vh;
    }

    .container{
      max-width:1400px;
      margin:0 auto;
      padding:2rem;
    }

    .page-header{
      background: linear-gradient(135deg, var(--orange) 0%, #d97706 100%);
      box-shadow: 0 10px 40px rgba(245, 158, 11, 0.3);
      padding:2rem;
      margin-bottom:2rem;
      border-radius:20px;
      display:flex;
      justify-content:space-between;
      align-items:center;
      flex-wrap:wrap;
      gap:1rem;
    }

    .page-header h1{
      margin:0;
      color:white;
      font-size:2rem;
      font-weight:800;
      text-shadow: 0 2px 10px rgba(0,0,0,0.2);
      display:flex;
      align-items:center;
      gap:0.75rem;
    }

    .header-actions{
      display:flex;
      gap:1rem;
      align-items:center;
    }

    .btn{
      cursor:pointer;
      padding:0.75rem 1.5rem;
      border-radius:12px;
      border:none;
      background: linear-gradient(135deg, var(--green-primary) 0%, var(--green-dark) 100%);
      color:white;
      font-weight:700;
      font-size:0.95rem;
      box-shadow: 0 4px 15px rgba(16, 185, 129, 0.4);
      transform: translateY(0);
      transition: all 0.2s ease;
      text-decoration:none;
      display:inline-block;
    }
    .btn:hover{
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(16, 185, 129, 0.5);
    }

    .btn-white{
      background: white;
      color: var(--orange);
      border: 2px solid var(--orange);
    }

    .stats{
      display:grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap:1.5rem;
      margin-bottom:2rem;
    }

    .stat-card{
      background: var(--card-bg);
      padding:1.5rem;
      border-radius:16px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.1);
      text-align:center;
    }

    .stat-card .number{
      font-size:2.5rem;
      font-weight:800;
      color: var(--orange);
      margin:0.5rem 0;
    }

    .stat-card .label{
      font-size:0.9rem;
      color: var(--muted);
      font-weight:600;
    }

    .invoices-container{
      background: var(--card-bg);
      padding:2rem;
      border-radius:20px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.1);
    }

    .invoices-header{
      display:flex;
      justify-content:space-between;
      align-items:center;
      margin-bottom:1.5rem;
      padding-bottom:1rem;
      border-bottom:2px solid #e5e7eb;
    }

    .invoices-header h2{
      margin:0;
      font-size:1.5rem;
      color:#064e3b;
      font-weight:700;
    }

    #invoicesTable{
      width:100%;
      border-collapse:collapse;
      background:white;
      box-shadow:0 2px 8px rgba(0,0,0,0.05);
      border-radius:12px;
      overflow:hidden;
    }

    #invoicesTable thead{
      background: linear-gradient(135deg, var(--orange), #d97706);
      color:white;
    }

    #invoicesTable th{
      padding:1rem;
      text-align:left;
      font-weight:600;
    }

    #invoicesTable td{
      padding:1rem;
      border-bottom:1px solid #e5e7eb;
    }

    #invoicesTable tbody tr{
      transition:all 0.2s ease;
      cursor:pointer;
    }

    #invoicesTable tbody tr:nth-child(even){
      background:#f9fafb;
    }

    #invoicesTable tbody tr:hover{
      background:#fff7ed;
      transform:scale(1.01);
    }

    .loading{
      text-align:center;
      padding:3rem;
      color:var(--muted);
      font-size:1.1rem;
    }

    .error{
      background:#fee;
      color:#c33;
      padding:1rem;
      border-radius:8px;
      border-left:4px solid #c33;
    }

    .empty{
      text-align:center;
      padding:3rem;
      color:var(--muted);
      font-size:1.1rem;
    }

    /* Responsive */
    @media(max-width:768px){
      .page-header{ padding:1.5rem; flex-direction:column; gap:0.75rem; }
      .page-header h1{ font-size:1.5rem; }
      .header-actions{ width:100%; justify-content:center; flex-wrap:wrap; }
      .stats{ grid-template-columns:1fr 1fr; gap:1rem; }
      .stat-card{ padding:1rem; }
      .stat-card .number{ font-size:2rem; }
      .invoices-container{ padding:1.5rem; }
      #invoicesTable{ font-size:0.85rem; overflow-x:auto; display:block; }
      #invoicesTable thead, #invoicesTable tbody, #invoicesTable tr, #invoicesTable th, #invoicesTable td{ display:block; }
      #invoicesTable thead tr{ position:absolute; top:-9999px; left:-9999px; }
      #invoicesTable tr{ margin-bottom:1rem; border:1px solid #e5e7eb; border-radius:8px; padding:0.75rem; background:white; }
      #invoicesTable td{ border:none; position:relative; padding-left:50%; text-align:right; }
      #invoicesTable td:before{ content:attr(data-label); position:absolute; left:0.75rem; font-weight:700; color:#064e3b; }
      .btn{ padding:0.6rem 1rem; font-size:0.9rem; }
    }
    @media(max-width:480px){
      .container{ padding:1rem; }
      .page-header{ padding:1rem; }
      .page-header h1{ font-size:1.25rem; }
      .stats{ grid-template-columns:1fr; }
      .stat-card .number{ font-size:1.75rem; }
      .invoices-container{ padding:1rem; border-radius:12px; }
      .btn{ padding:0.5rem 0.75rem; font-size:0.85rem; }
    }

    /* Invoice Modal */
    .invoice-modal-overlay{
      display:none;
      position:fixed;
      top:0;
      left:0;
      width:100%;
      height:100%;
      background:rgba(0,0,0,0.7);
      z-index:9999;
      justify-content:center;
      align-items:center;
      padding:1rem;
      box-sizing:border-box;
    }
    .invoice-modal-overlay.active{
      display:flex;
    }
    .invoice-modal-content{
      background:white;
      border-radius:16px;
      max-width:900px;
      width:100%;
      max-height:90vh;
      overflow:hidden;
      box-shadow:0 25px 50px rgba(0,0,0,0.3);
      display:flex;
      flex-direction:column;
    }
    .invoice-modal-header{
      display:flex;
      justify-content:space-between;
      align-items:center;
      padding:1rem 1.5rem;
      background:linear-gradient(135deg,#064e3b 0%,#0b2f1f 100%);
      color:white;
    }
    .invoice-modal-header h3{
      margin:0;
      font-size:1.2rem;
    }
    .invoice-modal-actions{
      display:flex;
      gap:0.5rem;
    }
    .invoice-modal-actions button{
      padding:0.5rem 1rem;
      border:none;
      border-radius:8px;
      cursor:pointer;
      font-weight:600;
      font-size:0.9rem;
      transition:all 0.2s;
    }
    .btn-print{
      background:#10b981;
      color:white;
    }
    .btn-print:hover{
      background:#059669;
    }
    .btn-close-modal{
      background:#ef4444;
      color:white;
    }
    .btn-close-modal:hover{
      background:#dc2626;
    }
    .invoice-modal-body{
      flex:1;
      overflow:auto;
      padding:0;
    }
    .invoice-modal-body iframe{
      width:100%;
      height:100%;
      min-height:70vh;
      border:none;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="page-header">
      <h1>🧾 Bilgi Fişleri</h1>
      <div class="header-actions">
        <button id="refreshBtn" class="btn">🔄 Bilgi Fişlerini Yenile</button>
        <a href="admin.html" class="btn btn-white">← Admin Panele Dön</a>
      </div>
    </div>

    <div class="stats">
      <div class="stat-card">
        <div class="label">📊 Toplam Bilgi Fişi</div>
        <div class="number" id="totalInvoices">0</div>
      </div>
      <div class="stat-card">
        <div class="label">📅 Bugün</div>
        <div class="number" id="todayInvoices">0</div>
      </div>
    </div>

    <div class="invoices-container">
      <div class="invoices-header">
        <h2>Bilgi Fişi Listesi</h2>
        <div id="lastUpdate" style="color:var(--muted);font-size:0.9rem;"></div>
      </div>
      <div id="invoicesContent">
        <div class="loading">⏳ Bilgi Fişleri yükleniyor...</div>
      </div>
    </div>
  </div>

  <!-- Invoice View Modal -->
  <div id="invoiceModal" class="invoice-modal-overlay">
    <div class="invoice-modal-content">
      <div class="invoice-modal-header">
        <h3>🧾 <span id="invoiceModalTitle">Bilgi Fişi</span></h3>
        <div class="invoice-modal-actions">
          <button class="btn-print" onclick="printInvoice()">🖨️ Yazdır / PDF</button>
          <button class="btn-close-modal" onclick="closeInvoiceModal()">✕ Kapat</button>
        </div>
      </div>
      <div class="invoice-modal-body">
        <iframe id="invoiceFrame" title="Bilgi Fişi"></iframe>
      </div>
    </div>
  </div>

  <script>
    function escapeHtml(s){ 
      if (s === undefined || s === null) return '';
      const str = String(s);
      return str.replace(/[&<>\"']/g, function(m){
        return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]
      }) 
    }

    let invoicesData = [];

    async function loadInvoices() {
      const contentEl = document.getElementById('invoicesContent');
      contentEl.innerHTML = '<div class="loading">⏳ Bilgi Fişleri GitHub\'dan çekiliyor...</div>';

      try {
        const owner = 'amtbrs-03';
        const repo = 'AMTBRS';
        const branch = 'site-release';
        const cacheBuster = Date.now();
        const apiUrl = `https://api.github.com/repos/${owner}/${repo}/contents/invoices?ref=${branch}&_cb=${cacheBuster}`;
        
        console.log('Bilgi Fişleri çekiliyor (URL):', apiUrl);
        
        const res = await fetch(apiUrl, {
          headers: { 'Accept': 'application/vnd.github.v3+json' }
        });
        
        console.log('GitHub API yanıtı:', res.status, res.statusText);
        
        if (!res.ok) {
          if (res.status === 404) {
            contentEl.innerHTML = '<div class="empty">📭 Henüz bilgi fişi oluşturulmamış.</div>';
            updateStats([]);
            return;
          }
          const errorText = await res.text().catch(() => '');
          console.error('GitHub API hata detayları:', errorText);
          throw new Error(`GitHub API şu yanıtı verdi: ${res.status} - ${res.statusText}`);
        }
        
        const files = await res.json();
        console.log('invoices/ klasöründeki dosya sayısı:', files.length);
        
        const invoiceFiles = files.filter(f => f.name.endsWith('.json') && f.name !== '.gitkeep');
        console.log('Bilgi Fişi dosyaları:', invoiceFiles.length);
        
        if (invoiceFiles.length === 0) {
          contentEl.innerHTML = '<div class="empty">📭 Henüz bilgi fişi oluşturulmamış.</div>';
          updateStats([]);
          return;
        }
        
        invoicesData = [];
        for (const file of invoiceFiles) {
          try {
            console.log('Bilgi Fişi çekiliyor (raw-first):', file.name);
            // Try raw first
            const rawUrl = `https://raw.githubusercontent.com/${owner}/${repo}/${branch}/invoices/${file.name}`;
            let invoiceRes = await fetch(rawUrl + `?t=${Date.now()}`);
            if (invoiceRes.ok) {
              const invoiceData = await invoiceRes.json();
              invoicesData.push(invoiceData);
              continue;
            }
            // Fallback to download_url
            invoiceRes = await fetch(file.download_url + `?t=${Date.now()}`);
            if (invoiceRes.ok) {
              const invoiceData = await invoiceRes.json();
              invoicesData.push(invoiceData);
            }
          } catch(e) {
            console.error('Bilgi Fişi yüklenemedi:', file.name, e);
          }
        }
        
        if (invoicesData.length === 0) {
          contentEl.innerHTML = '<div class="empty">❌ Bilgi Fişi verileri yüklenemedi.</div>';
          updateStats([]);
          return;
        }
        
        console.log('Toplam yüklenen bilgi fişi:', invoicesData.length);
        
        invoicesData.sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
        
        updateStats(invoicesData);
        renderInvoicesTable(invoicesData);
        
        const now = new Date().toLocaleString('tr-TR', {
          day:'2-digit', 
          month:'2-digit', 
          year:'numeric', 
          hour:'2-digit', 
          minute:'2-digit'
        });
        document.getElementById('lastUpdate').textContent = `Son güncelleme: ${now}`;
        
      } catch(err) {
        console.error('Bilgi Fişleri yüklenemedi:', err);
        let errorMsg = err.message;
        if (err.message.includes('Failed to fetch') || err.message.includes('NetworkError')) {
          errorMsg = 'Ağ hatası: GitHub API\'ye erişilemiyor.';
        }
        contentEl.innerHTML = `<div class="error">❌ Hata: ${escapeHtml(errorMsg)}</div>`;
        updateStats([]);
      }
    }

    function updateStats(invoices) {
      const total = invoices.length;
      const today = new Date().toDateString();
      const todayCount = invoices.filter(inv => {
        const invDate = new Date(inv.createdAt || 0);
        return invDate.toDateString() === today;
      }).length;
      
      document.getElementById('totalInvoices').textContent = total;
      document.getElementById('todayInvoices').textContent = todayCount;
    }

    function renderInvoicesTable(invoices) {
      let html = '<table id="invoicesTable">';
      html += '<thead><tr>';
      html += '<th>🧾 Bilgi Fişi No</th>';
      html += '<th>📦 Sipariş No</th>';
      html += '<th>📅 Oluşturma Tarihi</th>';
      html += '<th>🔗 İşlem</th>';
      html += '</tr></thead><tbody>';
      
      invoices.forEach(invoice => {
        const createdDate = invoice.createdAt 
          ? new Date(invoice.createdAt).toLocaleDateString('tr-TR', {
              day:'2-digit', 
              month:'2-digit', 
              year:'numeric', 
              hour:'2-digit', 
              minute:'2-digit'
            }) 
          : '-';
        
        const invoiceId = `INV-${invoice.orderId}`;
        
        html += `<tr onclick="viewInvoice('${escapeHtml(invoice.orderId)}')">`;
        html += `<td style="font-weight:600;color:var(--orange);">${escapeHtml(invoiceId)}</td>`;
        html += `<td style="font-weight:500;">${escapeHtml(invoice.orderId || '-')}</td>`;
        html += `<td style="color:var(--muted);">${createdDate}</td>`;
        html += `<td><button class="btn" style="padding:0.5rem 1rem;font-size:0.85rem;" onclick="event.stopPropagation();viewInvoice('${escapeHtml(invoice.orderId)}')">👁️ Görüntüle</button></td>`;
        html += '</tr>';
      });
      
      html += '</tbody></table>';
      
      document.getElementById('invoicesContent').innerHTML = html;
    }

    let currentInvoiceHtml = '';

    function viewInvoice(orderId) {
      const invoice = invoicesData.find(inv => inv.orderId === orderId);
      if (invoice && invoice.html) {
        let html = invoice.html;
        // Durum: hazır olarak değiştir
        html = html.replace(/(<span class=\"info-label\">Durum:<\/span>\s*)(Beklemede|Hazır|[A-Za-zÇçĞğİıÖöŞşÜü ]+)/, '$1Hazır');

        // Kullanıcı telefonunu ekle
        let userPhone = '';
        try {
          const userData = JSON.parse(localStorage.getItem('user'));
          userPhone = userData && userData.phone ? userData.phone : '';
        } catch(e) {}
        if (userPhone) {
          // Müşteri Bilgileri kutusuna telefon ekle
          html = html.replace(/(<h3>👤 Müşteri Bilgileri<\/h3>\s*<p><strong>[^<]+<\/strong><\/p>\s*<p>[^<]+<\/p>)/, '$1<p>' + userPhone + '</p>');
        }
        
        currentInvoiceHtml = html;
        
        // Modal'da göster
        const modal = document.getElementById('invoiceModal');
        const iframe = document.getElementById('invoiceFrame');
        const title = document.getElementById('invoiceModalTitle');
        
        title.textContent = `INV-${orderId}`;
        
        // iframe içine yaz
        iframe.srcdoc = html;
        
        // Modal'ı aç
        modal.classList.add('active');
        document.body.style.overflow = 'hidden';
      } else {
        alert('Bilgi Fişi içeriği bulunamadı!');
      }
    }

    function closeInvoiceModal() {
      const modal = document.getElementById('invoiceModal');
      modal.classList.remove('active');
      document.body.style.overflow = '';
    }

    function printInvoice() {
      const iframe = document.getElementById('invoiceFrame');
      if (iframe && iframe.contentWindow) {
        iframe.contentWindow.focus();
        iframe.contentWindow.print();
      }
    }

    // ESC tuşu ile modal'ı kapat
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        closeInvoiceModal();
      }
    });

    document.getElementById('refreshBtn').addEventListener('click', async () => {
      const btn = document.getElementById('refreshBtn');
      btn.disabled = true;
      btn.textContent = '⏳ Yenileniyor...';
      
      await loadInvoices();
      
      btn.disabled = false;
      btn.textContent = '🔄 Bilgi Fişlerini Yenile';
    });

    // Sayfa yüklenir yüklenmez otomatik başlat
    document.addEventListener('DOMContentLoaded', () => {
      loadInvoices();
    });
    
    // Eğer DOM zaten yüklendiyse hemen başlat
    if (document.readyState !== 'loading') {
      loadInvoices();
    }
  </script>
</body>
</html>
