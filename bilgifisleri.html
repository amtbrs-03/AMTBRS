<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Bilgi Fişleri - ERN-ÇİÇEK Admin</title>
  <style>
    :root{
      --green-primary: #10b981;
      --green-dark: #059669;
      --green-light: #34d399;
      --orange: #f59e0b;
      --muted:#6b7280;
      --bg-1: rgba(34,197,94,0.10);
      --bg-2: rgba(16,185,129,0.08);
      --card-bg: rgba(255,255,255,0.98);
    }

    body{
      font-family: 'Segoe UI', 'Inter', 'Noto Sans', Tahoma, Arial, sans-serif;
      padding:0;
      margin:0;
      color:#0f172a;
      background: radial-gradient(1200px 600px at 10% 10%, var(--bg-1), transparent),
                  radial-gradient(800px 400px at 90% 90%, var(--bg-2), transparent),
                  linear-gradient(180deg, #ecfdf5 0%, #064e3b 100%);
      -webkit-font-smoothing:antialiased;
      -moz-osx-font-smoothing:grayscale;
      min-height:100vh;
    }

    .container{
      max-width:1400px;
      margin:0 auto;
      padding:2rem;
    }

    .page-header{
      background: linear-gradient(135deg, var(--orange) 0%, #d97706 100%);
      box-shadow: 0 10px 40px rgba(245, 158, 11, 0.3);
      padding:2rem;
      margin-bottom:2rem;
      border-radius:20px;
      display:flex;
      justify-content:space-between;
      align-items:center;
      flex-wrap:wrap;
      gap:1rem;
    }

    .page-header h1{
      margin:0;
      color:white;
      font-size:2rem;
      font-weight:800;
      text-shadow: 0 2px 10px rgba(0,0,0,0.2);
      display:flex;
      align-items:center;
      gap:0.75rem;
    }

    .header-actions{
      display:flex;
      gap:1rem;
      align-items:center;
    }

    .btn{
      cursor:pointer;
      padding:0.75rem 1.5rem;
      border-radius:12px;
      border:none;
      background: linear-gradient(135deg, var(--green-primary) 0%, var(--green-dark) 100%);
      color:white;
      font-weight:700;
      font-size:0.95rem;
      box-shadow: 0 4px 15px rgba(16, 185, 129, 0.4);
      transform: translateY(0);
      transition: all 0.2s ease;
      text-decoration:none;
      display:inline-block;
    }
    .btn:hover{
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(16, 185, 129, 0.5);
    }

    .btn-white{
      background: white;
      color: var(--orange);
      border: 2px solid var(--orange);
    }

    .btn-danger{
      background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%);
      box-shadow: 0 4px 15px rgba(239, 68, 68, 0.35);
    }
    .btn-danger:hover{
      box-shadow: 0 6px 20px rgba(239, 68, 68, 0.45);
    }

    .btn-ghost{
      background: #fff;
      color: #0f172a;
      border: 1px solid #e5e7eb;
      box-shadow: none;
    }
    .btn-ghost:hover{
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(0,0,0,0.08);
    }

    .btn-inline{
      padding:0.5rem 0.9rem;
      font-size:0.85rem;
    }

    .stats{
      display:grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap:1.5rem;
      margin-bottom:2rem;
    }

    .stat-card{
      background: var(--card-bg);
      padding:1.5rem;
      border-radius:16px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.1);
      text-align:center;
    }

    .stat-card .number{
      font-size:2.5rem;
      font-weight:800;
      color: var(--orange);
      margin:0.5rem 0;
    }

    .stat-card .label{
      font-size:0.9rem;
      color: var(--muted);
      font-weight:600;
    }

    .invoices-container{
      background: var(--card-bg);
      padding:2rem;
      border-radius:20px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.1);
    }

    .invoices-header{
      display:flex;
      justify-content:space-between;
      align-items:center;
      margin-bottom:1.5rem;
      padding-bottom:1rem;
      border-bottom:2px solid #e5e7eb;
    }

    #lastUpdate{
      color:var(--muted);
      font-size:0.9rem;
    }

    .invoices-header h2{
      margin:0;
      font-size:1.5rem;
      color:#064e3b;
      font-weight:700;
    }

    #invoicesTable{
      width:100%;
      border-collapse:collapse;
      background:white;
      box-shadow:0 2px 8px rgba(0,0,0,0.05);
      border-radius:12px;
      overflow:hidden;
    }

    #invoicesTable thead{
      background: linear-gradient(135deg, var(--orange), #d97706);
      color:white;
    }

    #invoicesTable th{
      padding:1rem;
      text-align:left;
      font-weight:600;
    }

    #invoicesTable td{
      padding:1rem;
      border-bottom:1px solid #e5e7eb;
    }

    #invoicesTable tbody tr{
      transition:all 0.2s ease;
      cursor:pointer;
    }

    #invoicesTable tbody tr:nth-child(even){
      background:#f9fafb;
    }

    #invoicesTable tbody tr:hover{
      background:#fff7ed;
      transform:scale(1.01);
    }

    .loading{
      text-align:center;
      padding:3rem;
      color:var(--muted);
      font-size:1.1rem;
    }

    .error{
      background:#fee;
      color:#c33;
      padding:1rem;
      border-radius:8px;
      border-left:4px solid #c33;
    }

    .empty{
      text-align:center;
      padding:3rem;
      color:var(--muted);
      font-size:1.1rem;
    }

    /* Responsive */
    @media(max-width:768px){
      .page-header{ padding:1.5rem; flex-direction:column; gap:0.75rem; }
      .page-header h1{ font-size:1.5rem; }
      .header-actions{ width:100%; justify-content:center; flex-wrap:wrap; }
      .stats{ grid-template-columns:1fr 1fr; gap:1rem; }
      .stat-card{ padding:1rem; }
      .stat-card .number{ font-size:2rem; }
      .invoices-container{ padding:1.5rem; }
      #invoicesTable{ font-size:0.85rem; overflow-x:auto; display:block; }
      #invoicesTable thead, #invoicesTable tbody, #invoicesTable tr, #invoicesTable th, #invoicesTable td{ display:block; }
      #invoicesTable thead tr{ position:absolute; top:-9999px; left:-9999px; }
      #invoicesTable tr{ margin-bottom:1rem; border:1px solid #e5e7eb; border-radius:8px; padding:0.75rem; background:white; }
      #invoicesTable td{ border:none; position:relative; padding-left:50%; text-align:right; }
      #invoicesTable td:before{ content:attr(data-label); position:absolute; left:0.75rem; font-weight:700; color:#064e3b; }
      .btn{ padding:0.6rem 1rem; font-size:0.9rem; }
    }
    @media(max-width:480px){
      .container{ padding:1rem; }
      .page-header{ padding:1rem; }
      .page-header h1{ font-size:1.25rem; }
      .stats{ grid-template-columns:1fr; }
      .stat-card .number{ font-size:1.75rem; }
      .invoices-container{ padding:1rem; border-radius:12px; }
      .btn{ padding:0.5rem 0.75rem; font-size:0.85rem; }
    }

    /* Invoice Modal */
    .invoice-modal-overlay{
      display:none;
      position:fixed;
      top:0;
      left:0;
      width:100%;
      height:100%;
      background:rgba(0,0,0,0.9);
      z-index:9999;
      justify-content:center;
      align-items:center;
      padding:0;
      box-sizing:border-box;
    }
    .invoice-modal-overlay.active{
      display:flex;
    }
    .invoice-modal-content{
      background:white;
      border-radius:0;
      width:100%;
      height:100%;
      max-width:100%;
      max-height:100%;
      overflow:hidden;
      box-shadow:none;
      display:flex;
      flex-direction:column;
    }
    .invoice-modal-header{
      display:flex;
      justify-content:space-between;
      align-items:center;
      padding:1rem 1.5rem;
      background:linear-gradient(135deg,#064e3b 0%,#0b2f1f 100%);
      color:white;
    }
    .invoice-modal-header h3{
      margin:0;
      font-size:1.2rem;
    }
    .invoice-modal-actions{
      display:flex;
      gap:0.5rem;
    }
    .invoice-modal-actions button{
      padding:0.5rem 1rem;
      border:none;
      border-radius:8px;
      cursor:pointer;
      font-weight:600;
      font-size:0.9rem;
      transition:all 0.2s;
    }
    .btn-print{
      background:#10b981;
      color:white;
    }
    .btn-print:hover{
      background:#059669;
    }
    .btn-close-modal{
      background:#ef4444;
      color:white;
    }
    .btn-close-modal:hover{
      background:#dc2626;
    }
    .invoice-modal-body{
      flex:1;
      overflow:auto;
      padding:0;
    }
    .invoice-modal-body iframe{
      width:100%;
      height:100%;
      border:none;
    }

    /* Generic modal (delete confirm) */
    .modal{
      position:fixed;
      inset:0;
      z-index:10000;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:1rem;
      background:rgba(0,0,0,0.55);
      box-sizing:border-box;
    }
    .modal-content{
      background: var(--card-bg);
      box-shadow: 0 10px 40px rgba(0,0,0,0.2);
      border-radius:16px;
      overflow:hidden;
      width:92%;
      max-width:480px;
    }
    .modal-header{
      display:flex;
      align-items:center;
      padding:1rem 1.25rem;
    }
    .modal-body{
      padding:1.5rem;
    }

    /* Delete modal styling */
    #deleteModal{ display:none; }
    #deleteModal .modal-header{
      justify-content:center;
      background:linear-gradient(135deg,#fef2f2,#fee2e2);
      border-bottom:2px solid #fecaca;
    }
    #deleteModalTitle{ margin:0; color:#991b1b; }
    #deleteConfirmContent{ margin-bottom:0.5rem; }
    .delete-modal-center{ text-align:center; margin-bottom:1rem; }
    .delete-modal-iconWrap{
      width:64px;
      height:64px;
      background:linear-gradient(135deg,#fef2f2,#fee2e2);
      border-radius:50%;
      display:inline-flex;
      align-items:center;
      justify-content:center;
      margin-bottom:0.5rem;
      border:2px solid #fecaca;
    }
    #deleteModalIcon{ font-size:1.8rem; }
    .delete-modal-question{ font-weight:700; color:#0f172a; font-size:1.1rem; margin-bottom:0.25rem; }
    #deleteModalName{ color:#dc2626; font-weight:600; font-size:1rem; margin-bottom:0.5rem; }
    #deleteModalDesc{ color:var(--muted); line-height:1.6; }
    #deleteProgressContent{ display:none; padding:2rem; text-align:center; }
    .delete-progress-ring{ width:80px; height:80px; margin:0 auto 1rem; position:relative; }
    .delete-progress-ring svg{ width:100%; height:100%; transform:rotate(-90deg); }
    #deleteProgressCircle{ transition:stroke-dashoffset 0.3s; }
    #deleteProgressPercent{ position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); font-size:1.2rem; font-weight:800; color:#dc2626; }
    #deleteProgressTitle{ font-weight:700; color:#991b1b; font-size:1.1rem; margin-bottom:0.5rem; }
    #deleteProgressStatus{ color:var(--muted); font-size:0.9rem; }
    #deleteConfirmButtons{
      display:flex;
      gap:0.5rem;
      justify-content:center;
      padding:1rem;
      background:#f9fafb;
      border-top:1px solid #e5e7eb;
    }
    .delete-modal-btn{ padding:0.6rem 1.5rem; }
  </style>
</head>
<body>
  <div class="container">
    <div class="page-header">
      <h1>🧾 Bilgi Fişleri</h1>
      <div class="header-actions">
        <button id="refreshBtn" class="btn">🔄 Bilgi Fişlerini Yenile</button>
        <a href="admin.html" class="btn btn-white">← Admin Panele Dön</a>
      </div>
    </div>

    <div class="stats">
      <div class="stat-card">
        <div class="label">📊 Toplam Bilgi Fişi</div>
        <div class="number" id="totalInvoices">0</div>
      </div>
      <div class="stat-card">
        <div class="label">📅 Bugün</div>
        <div class="number" id="todayInvoices">0</div>
      </div>
    </div>

    <div class="invoices-container">
      <div class="invoices-header">
        <h2>Bilgi Fişi Listesi</h2>
        <div id="lastUpdate"></div>
      </div>
      <div id="invoicesContent">
        <div class="loading">⏳ Bilgi Fişleri yükleniyor...</div>
      </div>
    </div>
  </div>

  <!-- Invoice View Modal -->
  <div id="invoiceModal" class="invoice-modal-overlay">
    <div class="invoice-modal-content">
      <div class="invoice-modal-header">
        <h3>🧾 <span id="invoiceModalTitle">Bilgi Fişi</span></h3>
        <div class="invoice-modal-actions">
          <button class="btn-print" onclick="printInvoice()">🖨️ Yazdır / PDF</button>
          <button class="btn-close-modal" onclick="closeInvoiceModal()">✕ Kapat</button>
        </div>
      </div>
      <div class="invoice-modal-body">
        <iframe id="invoiceFrame" title="Bilgi Fişi"></iframe>
      </div>
    </div>
  </div>

  <!-- Delete Confirm Modal (Admin ile aynı UX) -->
  <section id="deleteModal" class="modal">
    <div class="modal-content">
      <div class="modal-header">
        <h2 id="deleteModalTitle">🗑️ Silme Onayı</h2>
      </div>
      <div id="deleteConfirmContent" class="modal-body">
        <div class="delete-modal-center">
          <div class="delete-modal-iconWrap">
            <span id="deleteModalIcon">⚠️</span>
          </div>
          <div class="delete-modal-question">Emin misiniz?</div>
          <div id="deleteModalName"></div>
          <div id="deleteModalDesc">
            Bu öğe kalıcı olarak silinecektir.<br>Bu işlem geri alınamaz!
          </div>
        </div>
      </div>
      <div id="deleteProgressContent">
        <div class="delete-progress-ring">
          <svg viewBox="0 0 100 100">
            <circle cx="50" cy="50" r="45" fill="none" stroke="#fee2e2" stroke-width="8"/>
            <circle id="deleteProgressCircle" cx="50" cy="50" r="45" fill="none" stroke="#dc2626" stroke-width="8" stroke-linecap="round" stroke-dasharray="283" stroke-dashoffset="283"/>
          </svg>
          <div id="deleteProgressPercent">0%</div>
        </div>
        <div id="deleteProgressTitle">🗑️ Siliniyor...</div>
        <div id="deleteProgressStatus">Sunucuya bağlanılıyor...</div>
      </div>
      <div id="deleteConfirmButtons">
        <button type="button" class="btn btn-danger delete-modal-btn" id="confirmDeleteBtn">🗑️ Evet, Sil</button>
        <button type="button" class="btn btn-ghost delete-modal-btn" onclick="closeDeleteModal()">Vazgeç</button>
      </div>
    </div>
  </section>

  <script>
    function escapeHtml(s){ 
      if (s === undefined || s === null) return '';
      const str = String(s);
      return str.replace(/[&<>\"']/g, function(m){
        return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]
      }) 
    }

    let invoicesData = [];

    const WORKER_BASE = 'https://ern-site.amtbrs-03.workers.dev';

    async function loadInvoices() {
      const contentEl = document.getElementById('invoicesContent');
      contentEl.innerHTML = '<div class="loading">⏳ Bilgi Fişleri GitHub\'dan çekiliyor...</div>';

      try {
        const owner = 'amtbrs-03';
        const repo = 'AMTBRS';
        const branch = 'site-release';
        const cacheBuster = Date.now();
        const workerUrl = `${WORKER_BASE}/list-invoices?_cb=${cacheBuster}`;
        const apiUrl = `https://api.github.com/repos/${owner}/${repo}/contents/invoices?ref=${branch}&_cb=${cacheBuster}`;
        
        console.log('Bilgi Fişleri çekiliyor (worker-first):', workerUrl);

        let files = null;
        // 1) Worker üzerinden listele (rate-limit yok)
        try {
          const wres = await fetch(workerUrl, { headers: { 'Accept': 'application/json' } });
          if (wres.ok) {
            const wj = await wres.json().catch(()=>null);
            if (wj && wj.ok && Array.isArray(wj.files)) {
              files = wj.files;
              console.log('Worker üzerinden bilgi fişi listesi alındı. Adet=', files.length);
            } else {
              console.warn('Worker invoice list beklenmeyen yanıt:', wj);
            }
          } else {
            console.warn('Worker invoice list HTTP hata:', wres.status);
          }
        } catch(e) {
          console.warn('Worker invoice list fetch hatası:', e);
        }

        // 2) Fallback: doğrudan GitHub Contents API (rate limit riski)
        if (!files) {
          console.log('Bilgi Fişleri çekiliyor (GitHub API fallback):', apiUrl);
          const res = await fetch(apiUrl, {
            headers: { 'Accept': 'application/vnd.github.v3+json' }
          });
        
          console.log('GitHub API yanıtı:', res.status, res.statusText);
          
          if (!res.ok) {
            if (res.status === 404) {
              contentEl.innerHTML = '<div class="empty">📭 Henüz bilgi fişi oluşturulmamış.</div>';
              updateStats([]);
              return;
            }
            const errorText = await res.text().catch(() => '');
            console.error('GitHub API hata detayları:', errorText);
            if (res.status === 403) {
              throw new Error('GitHub API 403: API limitine takıldı veya erişim kısıtı. Birkaç dakika sonra tekrar deneyin.');
            }
            throw new Error(`GitHub API şu yanıtı verdi: ${res.status} - ${res.statusText}`);
          }
          
          files = await res.json();
        }
        console.log('invoices/ klasöründeki dosya sayısı:', files.length);

        const invoiceFiles = files.filter(f => f && f.name && f.name.endsWith('.json') && f.name !== '.gitkeep');
        console.log('Bilgi Fişi dosyaları:', invoiceFiles.length);
        
        if (invoiceFiles.length === 0) {
          contentEl.innerHTML = '<div class="empty">📭 Henüz bilgi fişi oluşturulmamış.</div>';
          updateStats([]);
          return;
        }
        
        invoicesData = [];
        for (const file of invoiceFiles) {
          try {
            console.log('Bilgi Fişi çekiliyor (raw-first):', file.name);
            // Try raw first
            const rawUrl = `https://raw.githubusercontent.com/${owner}/${repo}/${branch}/invoices/${file.name}`;
            let invoiceRes = await fetch(rawUrl + `?t=${Date.now()}`);
            if (invoiceRes.ok) {
              const invoiceData = await invoiceRes.json();
              invoicesData.push(invoiceData);
              continue;
            }
            // Fallback to download_url
            invoiceRes = await fetch(file.download_url + `?t=${Date.now()}`);
            if (invoiceRes.ok) {
              const invoiceData = await invoiceRes.json();
              invoicesData.push(invoiceData);
            }
          } catch(e) {
            console.error('Bilgi Fişi yüklenemedi:', file.name, e);
          }
        }
        
        if (invoicesData.length === 0) {
          contentEl.innerHTML = '<div class="empty">❌ Bilgi Fişi verileri yüklenemedi.</div>';
          updateStats([]);
          return;
        }
        
        console.log('Toplam yüklenen bilgi fişi:', invoicesData.length);
        
        invoicesData.sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
        
        updateStats(invoicesData);
        renderInvoicesTable(invoicesData);
        
        const now = new Date().toLocaleString('tr-TR', {
          day:'2-digit', 
          month:'2-digit', 
          year:'numeric', 
          hour:'2-digit', 
          minute:'2-digit'
        });
        document.getElementById('lastUpdate').textContent = `Son güncelleme: ${now}`;
        
      } catch(err) {
        console.error('Bilgi Fişleri yüklenemedi:', err);
        let errorMsg = err.message;
        if (err.message.includes('Failed to fetch') || err.message.includes('NetworkError')) {
          errorMsg = 'Ağ hatası: GitHub API\'ye erişilemiyor.';
        }
        contentEl.innerHTML = `<div class="error">❌ Hata: ${escapeHtml(errorMsg)}</div>`;
        updateStats([]);
      }
    }

    function updateStats(invoices) {
      const total = invoices.length;
      const today = new Date().toDateString();
      const todayCount = invoices.filter(inv => {
        const invDate = new Date(inv.createdAt || 0);
        return invDate.toDateString() === today;
      }).length;
      
      document.getElementById('totalInvoices').textContent = total;
      document.getElementById('todayInvoices').textContent = todayCount;
    }

    function renderInvoicesTable(invoices) {
      let html = '<table id="invoicesTable">';
      html += '<thead><tr>';
      html += '<th>🧾 Bilgi Fişi No</th>';
      html += '<th>📦 Sipariş No</th>';
      html += '<th>📅 Oluşturma Tarihi</th>';
      html += '<th>🔗 İşlem</th>';
      html += '</tr></thead><tbody>';
      
      invoices.forEach(invoice => {
        const createdDate = invoice.createdAt 
          ? new Date(invoice.createdAt).toLocaleDateString('tr-TR', {
              day:'2-digit', 
              month:'2-digit', 
              year:'numeric', 
              hour:'2-digit', 
              minute:'2-digit'
            }) 
          : '-';
        
        const invoiceId = `INV-${invoice.orderId}`;
        
        html += `<tr onclick="viewInvoice('${escapeHtml(invoice.orderId)}')">`;
        html += `<td style="font-weight:600;color:var(--orange);">${escapeHtml(invoiceId)}</td>`;
        html += `<td style="font-weight:500;">${escapeHtml(invoice.orderId || '-')}</td>`;
        html += `<td style="color:var(--muted);">${createdDate}</td>`;
        html += `<td>`;
        html += `<button class="btn btn-inline" onclick="event.stopPropagation();viewInvoice('${escapeHtml(invoice.orderId)}')">👁️ Görüntüle</button>`;
        html += ` <button class="btn btn-danger btn-inline" onclick="event.stopPropagation();deleteInvoiceConfirm('${escapeHtml(invoice.orderId)}')">🗑️ Sil</button>`;
        html += `</td>`;
        html += '</tr>';
      });
      
      html += '</tbody></table>';
      
      document.getElementById('invoicesContent').innerHTML = html;
    }

    let currentInvoiceHtml = '';

    // Bildirim mesajı (admin'deki ile aynı mantık, bu sayfaya uyarlanmış)
    function showNotification(message, options = {}) {
      const type = options.type || 'info'; // success, warning, error, info
      const duration = options.duration || 3500;

      const configs = {
        success: { bg: 'linear-gradient(135deg, var(--green-primary), var(--green-dark))', icon: '✓', iconBg: 'rgba(255,255,255,0.2)' },
        warning: { bg: 'linear-gradient(135deg, var(--orange), #d97706)', icon: '⚠', iconBg: 'rgba(255,255,255,0.2)' },
        error: { bg: 'linear-gradient(135deg, #ef4444, #dc2626)', icon: '✕', iconBg: 'rgba(255,255,255,0.2)' },
        info: { bg: 'linear-gradient(135deg, var(--orange), #d97706)', icon: 'ℹ', iconBg: 'rgba(255,255,255,0.2)' }
      };
      const config = configs[type] || configs.info;

      const container = document.createElement('div');
      container.style.cssText = `
        position: fixed;
        top: 24px;
        right: 24px;
        z-index: 99999;
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 14px 20px;
        background: ${config.bg};
        border-radius: 12px;
        box-shadow: 0 8px 32px rgba(0,0,0,0.25), 0 4px 12px rgba(0,0,0,0.15);
        color: #fff;
        font-size: 0.95rem;
        font-weight: 600;
        max-width: 420px;
        animation: notifSlideIn 0.35s cubic-bezier(0.16,1,0.3,1);
        cursor: pointer;
      `;

      const iconEl = document.createElement('span');
      iconEl.style.cssText = `
        display: flex;
        align-items: center;
        justify-content: center;
        width: 28px;
        height: 28px;
        background: ${config.iconBg};
        border-radius: 50%;
        font-size: 1rem;
        flex-shrink: 0;
      `;
      iconEl.textContent = config.icon;

      const msgEl = document.createElement('span');
      msgEl.textContent = message;
      msgEl.style.lineHeight = '1.4';

      container.appendChild(iconEl);
      container.appendChild(msgEl);

      if (!document.getElementById('notifAnimStyle')) {
        const style = document.createElement('style');
        style.id = 'notifAnimStyle';
        style.textContent = `
          @keyframes notifSlideIn { from { opacity: 0; transform: translateX(100px); } to { opacity: 1; transform: translateX(0); } }
          @keyframes notifSlideOut { from { opacity: 1; transform: translateX(0); } to { opacity: 0; transform: translateX(100px); } }
        `;
        document.head.appendChild(style);
      }

      document.body.appendChild(container);

      const close = () => {
        container.style.animation = 'notifSlideOut 0.3s ease forwards';
        setTimeout(() => container.remove(), 300);
      };
      container.onclick = close;
      setTimeout(close, duration);
    }

    // Delete modal system (admin ile aynı özellikler)
    let _deleteInProgress = false;
    let _pendingDeleteCallback = null;
    let _pendingDeleteData = {};

    function openDeleteModal(options = {}) {
      if (_deleteInProgress) return;
      const title = options.title || '🗑️ Silme Onayı';
      const icon = options.icon || '⚠️';
      const name = options.name || '';
      const desc = options.desc || 'Bu öğe kalıcı olarak silinecektir.<br>Bu işlem geri alınamaz!';
      const progressTitle = options.progressTitle || '🗑️ Siliniyor...';
      const callback = options.onConfirm;
      const data = options.data || {};

      _pendingDeleteCallback = callback;
      _pendingDeleteData = data;

      document.getElementById('deleteModalTitle').innerHTML = title;
      document.getElementById('deleteModalIcon').textContent = icon;
      document.getElementById('deleteModalName').textContent = name;
      document.getElementById('deleteModalDesc').innerHTML = desc;
      document.getElementById('deleteProgressTitle').innerHTML = progressTitle;

      resetDeleteModal();
      const m = document.getElementById('deleteModal');
      if (m) m.style.display = 'flex';
    }

    function closeDeleteModal() {
      if (_deleteInProgress) return;
      _pendingDeleteCallback = null;
      _pendingDeleteData = {};
      const m = document.getElementById('deleteModal');
      if (m) m.style.display = 'none';
    }

    function showDeleteProgress() {
      _deleteInProgress = true;
      const confirm = document.getElementById('deleteConfirmContent');
      const progress = document.getElementById('deleteProgressContent');
      const buttons = document.getElementById('deleteConfirmButtons');
      if (confirm) confirm.style.display = 'none';
      if (progress) progress.style.display = 'block';
      if (buttons) buttons.style.display = 'none';
      const modal = document.getElementById('deleteModal');
      if (modal) modal.style.pointerEvents = 'none';
      const modalContent = modal?.querySelector('.modal-content');
      if (modalContent) modalContent.style.pointerEvents = 'auto';
    }

    function updateDeleteProgress(percent, status) {
      const circle = document.getElementById('deleteProgressCircle');
      const percentEl = document.getElementById('deleteProgressPercent');
      const statusEl = document.getElementById('deleteProgressStatus');
      if (circle) {
        const offset = 283 - (283 * percent / 100);
        circle.style.strokeDashoffset = offset;
      }
      if (percentEl) percentEl.textContent = Math.round(percent) + '%';
      if (statusEl) statusEl.textContent = status;
    }

    function resetDeleteModal() {
      _deleteInProgress = false;
      const confirm = document.getElementById('deleteConfirmContent');
      const progress = document.getElementById('deleteProgressContent');
      const buttons = document.getElementById('deleteConfirmButtons');
      if (confirm) confirm.style.display = 'block';
      if (progress) progress.style.display = 'none';
      if (buttons) buttons.style.display = 'flex';
      updateDeleteProgress(0, '');
      const modal = document.getElementById('deleteModal');
      if (modal) modal.style.pointerEvents = '';
    }

    function finishDeleteSuccess(message) {
      updateDeleteProgress(100, '✅ ' + (message || 'Başarıyla silindi!'));
      setTimeout(() => {
        resetDeleteModal();
        closeDeleteModal();
        showNotification(message || 'Başarıyla silindi', { type: 'success' });
      }, 800);
    }

    function finishDeleteError(message) {
      updateDeleteProgress(0, '❌ Hata: ' + message);
      setTimeout(() => {
        resetDeleteModal();
        closeDeleteModal();
        showNotification('Hata: ' + message, { type: 'error' });
      }, 2000);
    }

    document.getElementById('confirmDeleteBtn').onclick = function() {
      if (_deleteInProgress) return;
      if (typeof _pendingDeleteCallback === 'function') {
        _pendingDeleteCallback(_pendingDeleteData);
      }
    };

    function deleteInvoiceConfirm(orderId) {
      const invoiceId = `INV-${orderId}`;
      openDeleteModal({
        title: '🗑️ Bilgi Fişi Silme',
        icon: '⚠️',
        name: invoiceId,
        desc: 'Bu bilgi fişi kalıcı olarak silinecektir.<br>Bu işlem geri alınamaz!',
        progressTitle: '🗑️ Bilgi Fişi Siliniyor...',
        data: { orderId },
        onConfirm: () => performDeleteInvoice(orderId)
      });
    }

    async function performDeleteInvoice(orderId) {
      try {
        showDeleteProgress();
        updateDeleteProgress(10, 'Sunucuya bağlanılıyor...');

        const res = await fetch(`${WORKER_BASE}/delete-invoice`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ orderId })
        });

        updateDeleteProgress(60, 'Silme isteği işlendi...');

        const j = await res.json().catch(() => null);
        if (!res.ok || !j || !j.ok) {
          const msg = (j && (j.error || j.details)) ? (j.error || j.details) : `HTTP ${res.status}`;
          throw new Error('Silme başarısız: ' + msg);
        }

        updateDeleteProgress(85, 'Liste güncelleniyor...');
        await loadInvoices();
        finishDeleteSuccess('Bilgi fişi başarıyla silindi');
      } catch (e) {
        const msg = (e && e.message) ? e.message : String(e);
        finishDeleteError(msg);
      }
    }

    function viewInvoice(orderId) {
      const invoice = invoicesData.find(inv => inv.orderId === orderId);
      if (invoice && invoice.html) {
        let html = invoice.html;
        // Durum: hazır olarak değiştir
        html = html.replace(/(<span class=\"info-label\">Durum:<\/span>\s*)(Beklemede|Hazır|[A-Za-zÇçĞğİıÖöŞşÜü ]+)/, '$1Hazır');

        // Kullanıcı telefonunu ekle
        let userPhone = '';
        try {
          const userData = JSON.parse(localStorage.getItem('user'));
          userPhone = userData && userData.phone ? userData.phone : '';
        } catch(e) {}
        if (userPhone) {
          // Müşteri Bilgileri kutusuna telefon ekle
          html = html.replace(/(<h3>👤 Müşteri Bilgileri<\/h3>\s*<p><strong>[^<]+<\/strong><\/p>\s*<p>[^<]+<\/p>)/, '$1<p>' + userPhone + '</p>');
        }
        
        currentInvoiceHtml = html;
        
        // Modal'da göster
        const modal = document.getElementById('invoiceModal');
        const iframe = document.getElementById('invoiceFrame');
        const title = document.getElementById('invoiceModalTitle');
        
        title.textContent = `INV-${orderId}`;
        
        // iframe içine yaz
        iframe.srcdoc = html;
        
        // Modal'ı aç
        modal.classList.add('active');
        document.body.style.overflow = 'hidden';
      } else {
        alert('Bilgi Fişi içeriği bulunamadı!');
      }
    }

    function closeInvoiceModal() {
      const modal = document.getElementById('invoiceModal');
      modal.classList.remove('active');
      document.body.style.overflow = '';
    }

    function printInvoice() {
      const iframe = document.getElementById('invoiceFrame');
      if (iframe && iframe.contentWindow) {
        iframe.contentWindow.focus();
        iframe.contentWindow.print();
      }
    }

    // ESC tuşu ile modal'ı kapat
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        closeInvoiceModal();
      }
    });

    document.getElementById('refreshBtn').addEventListener('click', async () => {
      const btn = document.getElementById('refreshBtn');
      btn.disabled = true;
      btn.textContent = '⏳ Yenileniyor...';
      
      await loadInvoices();
      
      btn.disabled = false;
      btn.textContent = '🔄 Bilgi Fişlerini Yenile';
    });

    // Sayfa yüklenir yüklenmez otomatik başlat
    document.addEventListener('DOMContentLoaded', () => {
      loadInvoices();
    });
    
    // Eğer DOM zaten yüklendiyse hemen başlat
    if (document.readyState !== 'loading') {
      loadInvoices();
    }
  </script>
</body>
