[build]
  command = "npm run build:site"
  functions = "functions"
  publish = "public-site"

[dev]
  functions = "functions"

[[redirects]]
  # Keep the apex domain canonical and force HTTPS.
  from = "http://ern-cicek.com.tr/*"
  to = "https://ern-cicek.com.tr/:splat"
  status = 301
  force = true

[[redirects]]
  # Redirect the www host to the canonical apex host.
  from = "https://www.ern-cicek.com.tr/*"
  to = "https://ern-cicek.com.tr/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://www.ern-cicek.com.tr/*"
  to = "https://ern-cicek.com.tr/:splat"
  status = 301
  force = true
