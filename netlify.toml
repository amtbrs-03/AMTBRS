[build]
  functions = "functions"
  publish = "."

[dev]
  functions = "functions"

[[redirects]]
  # Redirect www to canonical non-www host
  from = "https://www.ern-cicek.com.tr/*"
  to = "https://ern-cicek.com.tr/:splat"
  status = 301
  force = true

[[redirects]]
  # Ensure http www also redirects to https non-www
  from = "http://www.ern-cicek.com.tr/*"
  to = "https://ern-cicek.com.tr/:splat"
  status = 301
  force = true

[[redirects]]
  # Ensure plain http apex also upgrades to https
  from = "http://ern-cicek.com.tr/*"
  to = "https://ern-cicek.com.tr/:splat"
  status = 301
  force = true
