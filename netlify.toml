[build]
  functions = "functions"
  publish = "."

[dev]
  functions = "functions"

[[redirects]]
  # Redirect apex to canonical www host
  from = "https://ern-cicek.com.tr/*"
  to = "https://www.ern-cicek.com.tr/:splat"
  status = 301
  force = true

[[redirects]]
  # Ensure http apex also redirects to https://www
  from = "http://ern-cicek.com.tr/*"
  to = "https://www.ern-cicek.com.tr/:splat"
  status = 301
  force = true

[[redirects]]
  # Ensure plain http www also upgrades to https
  from = "http://www.ern-cicek.com.tr/*"
  to = "https://www.ern-cicek.com.tr/:splat"
  status = 301
  force = true

[[redirects]]
  # Serve email-logs directory index without 404
  from = "/email-logs"
  to = "/email-logs/"
  status = 301
  force = true
