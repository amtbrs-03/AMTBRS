<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Ödeme - IBAN</title>
  <style>
    body{font-family:Arial,Helvetica,sans-serif;background:#f7f7fb;color:#0b1220;padding:2rem}
    .box{max-width:720px;margin:2rem auto;padding:1.5rem;border-radius:8px;background:#fff;border:1px solid #e6e6ee}
    .iban{font-family:monospace;font-size:1.25rem;margin-top:0.5rem;word-break:break-all}
    .muted{color:#666;margin-top:0.5rem}
    a.btn{display:inline-block;margin-top:1rem;padding:0.6rem 1rem;background:#2563eb;color:#fff;border-radius:8px;text-decoration:none}
    
    /* Notification Modal */
    #notificationModal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.5);
      z-index: 9999;
      align-items: center;
      justify-content: center;
    }
    #notificationModal.show {
      display: flex;
    }
    .notification-box {
      background: #fff;
      border-radius: 12px;
      padding: 2rem;
      max-width: 500px;
      width: 90%;
      box-shadow: 0 10px 40px rgba(0,0,0,0.2);
      text-align: center;
      animation: slideIn 0.3s ease-out;
    }
    @keyframes slideIn {
      from { transform: translateY(-30px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }
    .notification-box.success {
      border-left: 5px solid #10b981;
    }
    .notification-box.error {
      border-left: 5px solid #ef4444;
    }
    .notification-box.warn {
      border-left: 5px solid #f59e0b;
    }
    .notification-box h2 {
      margin: 0 0 1rem 0;
      font-size: 1.5rem;
    }
    .notification-box p {
      margin: 0.5rem 0;
      line-height: 1.6;
      color: #555;
    }
    .notification-box .code {
      display: inline-block;
      background: #f3f4f6;
      padding: 0.5rem 1rem;
      border-radius: 4px;
      font-family: monospace;
      margin: 0.5rem 0;
      word-break: break-all;
    }
    .notification-buttons {
      margin-top: 1.5rem;
      display: flex;
      gap: 1rem;
      justify-content: center;
    }
    .notification-buttons button {
      padding: 0.6rem 1.5rem;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 1rem;
      font-weight: 600;
    }
    .notification-buttons .btn-primary {
      background: #2563eb;
      color: #fff;
    }
    .notification-buttons .btn-primary:hover {
      background: #1d4ed8;
    }
    .notification-buttons .btn-secondary {
      background: #e5e7eb;
      color: #333;
    }
    .notification-buttons .btn-secondary:hover {
      background: #d1d5db;
    }
    
    /* Responsive */
    @media(max-width:768px){
      body{padding:1rem}
      .box{margin:1rem auto;padding:1rem}
      h1{font-size:1.5rem}
      .iban{font-size:1rem;word-break:break-all}
      a.btn{padding:0.5rem 0.85rem;font-size:0.9rem;margin:0.5rem 0.25rem 0 0;display:inline-block}
    }
    @media(max-width:480px){
      body{padding:0.5rem}
      .box{margin:0.5rem auto;padding:0.75rem;border-radius:12px}
      h1{font-size:1.25rem}
      .iban{font-size:0.9rem}
      a.btn{padding:0.45rem 0.75rem;font-size:0.85rem;margin:0.5rem 0.25rem 0 0;width:calc(50% - 0.25rem);text-align:center}
    }
  </style>
</head>
<body>
  <div class="box">
    <h1>Ödeme / Havale</h1>
    <p>Lütfen aşağıdaki banka hesabına ödeme yapınız. Ödeme sonrası "Siparişi Bildir" butonunu kullanınız.</p>
    
    <!-- Banka Bilgileri -->
    <div style="background:#f0fdf4;border:1px solid #bbf7d0;border-radius:10px;padding:1rem;margin:1rem 0;">
      <div style="margin-bottom:0.5rem;"><span style="color:#6b7280;font-size:0.9rem;">🏦 Banka:</span> <strong id="bankName" style="color:#0b1220;">-</strong></div>
      <div style="margin-bottom:0.5rem;"><span style="color:#6b7280;font-size:0.9rem;">👤 Alıcı:</span> <strong id="accountHolder" style="color:#0b1220;">-</strong></div>
      <div><span style="color:#6b7280;font-size:0.9rem;">💳 IBAN:</span></div>
      <div id="iban" class="iban" style="background:#fff;padding:0.5rem;border-radius:6px;margin-top:0.25rem;">(IBAN yok)</div>
    </div>
    
    <div id="total" class="muted">Toplam: ₺0.00</div>
    <div id="orderStatus" class="muted" aria-live="polite" style="margin-top:0.5rem;min-height:1.2em"></div>
    <div style="margin-top:1rem;">
      <a id="copyBtn" class="btn" href="#">IBAN'ı Kopyala</a>
      <a id="notifyBtn" class="btn" href="#" style="background:#10b981;margin-left:8px">Siparişi Bildir</a>
      <a id="askSellerBtn" class="btn" href="#" style="background:#25D366;margin-left:8px">💬 Satıcıya Sor</a>
      <a id="backBtn" class="btn" href="/anasayfa.html" style="background:#6b7280;margin-left:8px">Siteye Dön</a>
    </div>
  </div>

  <!-- Notification Modal -->
  <div id="notificationModal">
    <div class="notification-box" id="notificationContent">
      <h2 id="notificationTitle">Bildirim</h2>
      <div id="notificationMessage"></div>
      <div class="notification-buttons">
        <button class="btn-primary" onclick="closeNotification()">Tamam</button>
      </div>
    </div>
  </div>

  <script>
        // Notification Modal Functions
        function showNotification(title, message, type = 'info', onClose = null) {
          const modal = document.getElementById('notificationModal');
          const box = document.getElementById('notificationContent');
          const titleEl = document.getElementById('notificationTitle');
          const messageEl = document.getElementById('notificationMessage');
          
          titleEl.textContent = title;
          messageEl.innerHTML = message;
          
          // Remove previous type classes
          box.classList.remove('success', 'error', 'warn');
          if (type) box.classList.add(type);
          
          modal.classList.add('show');
          
          // Store callback
          window.__notificationCallback = onClose;
        }
        
        function closeNotification() {
          const modal = document.getElementById('notificationModal');
          modal.classList.remove('show');
          if (window.__notificationCallback) {
            window.__notificationCallback();
            window.__notificationCallback = null;
          }
        }
        
        // Lazy-load site settings (for optional orderEndpoint override)
        let __settings = null;
        async function loadSettings(){
          if (__settings) return __settings;
          try{
            const r = await fetch('/site-settings.json', { cache:'no-store' });
            if (r.ok) { __settings = await r.json(); return __settings; }
          }catch(_){/* ignore */}
          return null;
        }
    console.log('=== ÖDEME SAYFASI AÇILDI ===');
    // customerPhone hesaplamasını tıklama akışında yapacağız (payerEmail belirlendikten sonra)
    
    // Diagnostic logs and initial UI wiring
    console.log('localStorage anahtarları:', Object.keys(localStorage));
    
    // Check all cart_ keys
    const cartKeys = [];
    for (let i = 0; i < localStorage.length; i++) {
      const k = localStorage.key(i);
      if (k && k.indexOf('cart_') === 0) {
        cartKeys.push(k);
        console.log('Sepet anahtarı bulundu:', k, '-> değer:', localStorage.getItem(k));
      }
    }
    console.log('Tüm sepet anahtarları:', cartKeys);

    function qs(key){
      try{const u=new URL(location.href); return u.searchParams.get(key);}catch(e){return null}
    }
    const iban = qs('iban') || qs('IBAN') || '';
    const total = qs('total') || qs('amount') || '';
    console.log('URL\'den IBAN:', iban);
    console.log('URL\'den Toplam:', total);
    
    // Site ayarlarından banka bilgilerini yükle
    (async function loadBankInfo() {
      try {
        const settings = await loadSettings();
        if (settings) {
          // Banka adı
          if (settings.bankName) {
            document.getElementById('bankName').textContent = settings.bankName;
          }
          // Alıcı adı soyadı
          if (settings.accountHolder) {
            document.getElementById('accountHolder').textContent = settings.accountHolder;
          }
          // IBAN (URL'den gelmemişse ayarlardan al)
          if (!iban && settings.iban) {
            document.getElementById('iban').textContent = settings.iban;
          }
        }
      } catch(e) {
        console.log('Banka bilgileri yüklenemedi:', e);
      }
    })();
    
    if(iban){
      document.getElementById('iban').textContent = iban;
    }
    if(total){
      let t = total;
      if(!t.match(/[.,]/)) t = Number(t).toFixed(2);
      document.getElementById('total').textContent = 'Toplam: ₺' + t;
    }
    
    // Satıcıya Sor - WhatsApp butonu
    document.getElementById('askSellerBtn').addEventListener('click', async function(e){
      e.preventDefault();
      let phone = '+905384179081'; // Varsayılan numara
      try {
        const settings = await loadSettings();
        if (settings && settings.phone) {
          phone = settings.phone.replace(/\s+/g, '').replace(/-/g, '');
        }
      } catch(_) {}
      // Numarayı WhatsApp formatına çevir
      phone = phone.replace(/\+/g, '');
      
      // Kullanıcı ve sepet bilgilerini topla
      const total = document.getElementById('total').textContent || '';
      const user = JSON.parse(localStorage.getItem('currentUser') || 'null');
      const userName = user ? user.name : 'Misafir';
      const userEmail = user ? user.email : '-';
      
      // Sepet verilerini al
      let cartItems = [];
      let cartKey = user && user.email ? 'cart_' + user.email : 'cart_guest';
      try {
        cartItems = JSON.parse(localStorage.getItem(cartKey) || '[]');
      } catch(_) {}
      
      // Ürün listesi oluştur
      let productList = '';
      if (cartItems.length > 0) {
        productList = cartItems.map((item, i) => {
          const qty = item.qty || item.quantity || 1;
          const price = item.price || 0;
          return `${i+1}. ${item.name} (${qty} adet - ₺${price})`;
        }).join('\n');
      }
      
      // Sipariş ID oluştur (tarih bazlı)
      const orderId = 'SOR-' + Date.now().toString().slice(-8);
      
      // Sipariş notu
      const orderNote = localStorage.getItem('orderNote') || '';
      
      // Detaylı mesaj oluştur
      let message = `Merhaba, ERN-ÇİÇEK ödeme sayfasından yazıyorum.\n\n`;
      message += `📋 Sorgu ID: ${orderId}\n`;
      message += `👤 Müşteri: ${userName}\n`;
      message += `📧 Email: ${userEmail}\n`;
      message += `💰 ${total}\n\n`;
      
      if (productList) {
        message += `🛒 Sepetteki Ürünler:\n${productList}\n\n`;
      }
      
      if (orderNote) {
        message += `📝 Sipariş Notu: ${orderNote}\n\n`;
      }
      
      message += `Bu sipariş hakkında bilgi almak istiyorum.`;
      
      window.open('https://wa.me/' + phone + '?text=' + encodeURIComponent(message), '_blank');
    });
    
    document.getElementById('copyBtn').addEventListener('click', function(e){
      e.preventDefault();
      const txt = document.getElementById('iban').textContent.trim();
      if(!txt || txt==='(IBAN yok)') {
        showNotification('Hata', '<p>IBAN bulunamadı</p>', 'error');
        return;
      }
      navigator.clipboard?.writeText(txt)
        .then(() => {
          showNotification('✅ Başarılı', '<p>IBAN kopyalandı:</p><div class="code">' + txt + '</div>', 'success');
        })
        .catch(() => {
          showNotification('Kopyala', '<p>Lütfen kopyalayın:</p><div class="code">' + txt + '</div>', 'warn');
        });
    });

    // XOR token decoder (same as admin)
    function decodeToken(encoded, key){
      let result = '';
      for (let i = 0; i < encoded.length; i++) {
        result += String.fromCharCode(encoded.charCodeAt(i) ^ key.charCodeAt(i % key.length));
      }
      return result;
    }
    function getGitHubToken(){
      const encoded = '":>r3\x0e,\' bj@\x06\x07\t5\'K"\x0b4\x08\tYUJ[f\x11\x0b\rK0\x0cs\x0f\x1dupY';
      const key = 'ERN-CICEK-2025';
      return decodeToken(encoded, key);
    }

    // Siparişi Bildir - save to GitHub instead of email
    const statusEl = document.getElementById('orderStatus');
    function setStatus(msg, cls){
      if(!statusEl) return;
      statusEl.textContent = msg;
      statusEl.className = 'muted ' + (cls || '');
    }
    document.getElementById('notifyBtn').addEventListener('click', async function(e){
      e.preventDefault();
      const btn = this;
      btn.textContent = 'Kaydediliyor...';
      btn.disabled = true;
      setStatus('Sipariş gönderiliyor...', '');
      
      const current = (function(){ try{ const c = localStorage.getItem('currentUser'); return c?JSON.parse(c):null }catch(e){return null} })();
      let payerEmail = current && current.email ? current.email : null;
      let payerName = current && current.name ? current.name : 'Misafir';
      
      console.log('Geçerli kullanıcı:', current);
      console.log('Ödeyen e-posta:', payerEmail);
      console.log('Ödeyen isim:', payerName);
      
      // Get cart - try logged in user first, then any cart_* key
      let cart = [];
      let cartKey = null;
      try {
        if (payerEmail) {
          // Logged in user
          cartKey = 'cart_' + payerEmail;
          console.log('Sepet anahtarı aranıyor:', cartKey);
          cart = JSON.parse(localStorage.getItem(cartKey) || '[]');
          console.log('Kullanıcı için sepet yüklendi:', cart);
        } else {
          // Guest - find any cart_* key
          console.log('Kullanıcı bulunamadı, herhangi bir cart_* anahtarı aranıyor...');
          for (let i = 0; i < localStorage.length; i++) {
            const k = localStorage.key(i);
            console.log('Anahtar kontrol ediliyor:', k);
            if (k && k.indexOf('cart_') === 0) {
              cartKey = k;
              cart = JSON.parse(localStorage.getItem(k) || '[]');
              console.log('Sepet anahtarı bulundu:', k, 'öğeler:', cart);
              // Infer email from cart key for guest and try to resolve name from user_<email>
              if (!payerEmail) {
                try {
                  const inferredEmail = k.substring('cart_'.length);
                  if (inferredEmail) {
                    payerEmail = inferredEmail;
                    const userRaw = localStorage.getItem('user_' + inferredEmail);
                    if (userRaw) {
                      const u = JSON.parse(userRaw);
                      if (u && u.name) payerName = u.name;
                    }
                  }
                } catch(_) {}
              }
              break;
            }
          }
        }
      } catch(e) {
        console.error('Sepet yükleme hatası:', e);
      }
      
      console.log('Nihai sepet:', cart);
      console.log('Sepet uzunluğu:', cart ? cart.length : 0);
      
      if(!cart || cart.length === 0){
        showNotification('Sepet Boş', '<p>Lütfen önce ürün seçiniz.</p>', 'warn');
        btn.textContent = 'Siparişi Bildir';
        btn.disabled = false;
        return;
      }

      const ibanText = (document.getElementById('iban').textContent || '').trim();
      const totalText = (document.getElementById('total').textContent || '').replace(/[^0-9.,]/g, '');
      
      // Kullanıcı varsayılan adresini çöz (varsa)
      function buildDefaultAddressFor(email){
        if (!email) return '';
        try{
          const raw = localStorage.getItem('user_' + email);
          if (!raw) return '';
          const user = JSON.parse(raw);
          let addr = null;
          if (Array.isArray(user.addresses) && user.addresses.length){
            addr = user.addresses.find(a=>a && a.isDefault) || user.addresses[0];
          } else if (user.address) {
            addr = user.address;
          }
          if (!addr) return '';

          // Normalize values: decode URI-encoded fragments and HTML entities
          const normalize = (v) => {
            if (v == null) return '';
            let s = String(v);
            try { if (/%[0-9A-Fa-f]{2}/.test(s) || s.includes('+')) s = decodeURIComponent(s.replace(/\+/g,' ')); } catch(_) {}
            try { const ta = document.createElement('textarea'); ta.innerHTML = s; s = ta.value; } catch(_) {}
            return s.replace(/\s+/g,' ').trim();
          };

          // Support common alias fields
          const city = normalize(addr.city || addr.il || addr.sehir || addr.addressCity);
          const district = normalize(addr.district || addr.ilce || addr.county || addr.addressDistrict);
          const neighborhood = normalize(addr.neighborhood || addr.mahalle || addr.quarter || addr.addressNeighborhood);
          const addressDetail = normalize(addr.addressDetail || addr.detail || addr.street || addr.streetAddress || addr.fullAddress);
          const postalCode = normalize(addr.postalCode || addr.zip || addr.postCode || addr.pk);

          // Human-friendly Turkish format: Adres Detayı, Mahalle, İlçe, İl, Posta Kodu 34000
          const parts = [];
          if (addressDetail) parts.push(addressDetail);
          if (neighborhood) parts.push(neighborhood);
          if (district) parts.push(district);
          if (city) parts.push(city);
          if (postalCode) parts.push('Posta Kodu ' + postalCode);
          return parts.join(', ');
        }catch(e){ return ''; }
      }

      // Create order object
      // Determine best email to resolve address:
      // 1) payerEmail if present
      // 2) email extracted from cart key (cart_<email>)
      // 3) any existing user_<email> in localStorage (first match)
      let addressEmailCandidate = payerEmail || null;
      if (!addressEmailCandidate && cartKey && cartKey.indexOf('cart_') === 0) {
        addressEmailCandidate = cartKey.substring('cart_'.length);
      }
      if (!addressEmailCandidate) {
        try {
          for (let i = 0; i < localStorage.length; i++) {
            const k = localStorage.key(i);
            if (k && k.indexOf('user_') === 0) {
              addressEmailCandidate = k.substring('user_'.length);
              break;
            }
          }
        } catch(_) {}
      }

      // Müşteri telefonu: currentUser.phone veya user_<email>.phone üzerinden
      let customerPhone = '';
      try {
        const cu2 = (function(){ try{ const c = localStorage.getItem('currentUser'); return c?JSON.parse(c):null }catch(e){return null} })();
        if (cu2 && cu2.phone) customerPhone = cu2.phone;
        const lookupEmail = addressEmailCandidate || payerEmail;
        if (!customerPhone && lookupEmail) {
          const reg2 = (function(){ try{ const r = localStorage.getItem('user_'+lookupEmail); return r?JSON.parse(r):null }catch(e){return null} })();
          if (reg2 && reg2.phone) customerPhone = reg2.phone;
        }
      } catch(_){}

      // Sipariş notunu localStorage'dan al
      const orderNote = localStorage.getItem('orderNote') || '';

      const order = {
        id: 'ORD-' + Date.now(),
        date: Date.now(),
        customerEmail: payerEmail || 'misafir@ern-cicek.com',
        customerName: payerName,
        customerPhone: customerPhone || '',
        items: cart,
        total: totalText,
        iban: ibanText,
        note: orderNote,
        status: 'pending',
        address: buildDefaultAddressFor(addressEmailCandidate)
      };
      
      // Sipariş notunu temizle
      localStorage.removeItem('orderNote');
      
      console.log('📋 Sipariş objesi oluşturuldu:');
      console.log('   ID:', order.id);
      console.log('   Email:', order.customerEmail);
      console.log('   Ad:', order.customerName);
      console.log('   Telefon:', order.customerPhone);
      console.log('   Ürün sayısı:', order.items?.length || 0);
      console.log('   Toplam:', order.total);
      console.log('   IBAN:', order.iban ? 'Var' : 'Yok');
      console.log('   Adres:', order.address);
      console.log('   Tüm sipariş:', order);

      console.log('Sipariş oluşturuldu:', order);

      try {
        // Send via Cloudflare Worker (SendGrid) endpoint
        const endpointCandidates = [
          'https://ern-site.amtbrs-03.workers.dev/send-order'
        ];
        try{
          const s = await loadSettings();
          if (s && s.orderEndpoint && typeof s.orderEndpoint === 'string') {
            // Absolute endpoint should be tried first when on static hosting
            endpointCandidates.unshift(s.orderEndpoint);
            console.log('Site settings orderEndpoint öne alındı:', s.orderEndpoint);
          }
        }catch(_){/* ignore */}
        
        console.log('🔗 Denecek uç noktalar sırası:');
        endpointCandidates.forEach((url, i) => console.log(`   ${i + 1}. ${url}`));

        let resp = null;
        let lastErr = null;
        for (const url of endpointCandidates) {
          try {
            console.log('📤 Deneme uç noktası:', url);
            console.log('📦 Gönderilen veri:', {
              customerEmail: order.customerEmail,
              customerName: order.customerName,
              total: order.total,
              itemCount: order.items?.length || 0
            });
            
            const reqStart = Date.now();
            resp = await fetch(url, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                // Distinguish payer vs customer for future-proofing
                payerEmail: order.customerEmail,
                customerEmail: order.customerEmail,
                customerName: order.customerName,
                customerPhone: order.customerPhone,
                cart: order.items,
                iban: order.iban,
                total: order.total,
                address: order.address,
                // Provide a minimal user profile snapshot for server-side pass-through
                userProfile: {
                  email: order.customerEmail,
                  name: order.customerName,
                  phone: order.customerPhone,
                  address: order.address
                }
              })
            });
            
            const reqTime = Date.now() - reqStart;
            console.log(`⏱️ İstek süresi: ${reqTime}ms`);
            console.log(`📥 Yanıt durumu: ${resp.status} ${resp.statusText}`);
            console.log(`📋 Yanıt başlıkları:`, {
              'content-type': resp.headers.get('content-type'),
              'content-length': resp.headers.get('content-length')
            });
            
            if (resp && resp.ok) {
              console.log('✅ Uç nokta başarılı!');
              break;
            }
            
            // Read response body for error details
            let respText = '';
            try {
              respText = await resp.clone().text();
            } catch(e) {
              console.log('⚠️ Yanıt gövdesi okunamadı:', e.message);
            }
            console.log(`❌ Uç nokta başarısız. Yanıt:`, respText.substring(0, 200));
            lastErr = new Error('HTTP ' + (resp ? resp.status : 'no-response') + ' - ' + respText.substring(0, 100));
          } catch (e) {
            console.error('🔴 Fetch hatası:', e.message);
            console.error('Stack:', e.stack);
            lastErr = e;
          }
        }

        if (resp && resp.ok) {
          let data = null;
          try { data = await resp.json(); } catch(_){}
          console.log('Sunucu yanıtı:', data);
          // Save to localStorage as backup
          const backupKey = 'orders_' + (payerEmail || 'guest');
          let orders = [];
          try { orders = JSON.parse(localStorage.getItem(backupKey) || '[]'); } catch(e) {}
          orders.push(order);
          localStorage.setItem(backupKey, JSON.stringify(orders));
          
          // Clear cart
          if (payerEmail) {
            try { localStorage.removeItem('cart_' + payerEmail); } catch(e) {}
          } else {
            // Clear any cart_* key for guest
            try {
              for (let i = localStorage.length - 1; i >= 0; i--) {
                const k = localStorage.key(i);
                if (k && k.indexOf('cart_') === 0) {
                  localStorage.removeItem(k);
                }
              }
            } catch(e) {}
          }
          
          const finalId = (data && data.orderId) ? data.orderId : order.id;
          const commitInfo = (data && typeof data.commitOk === 'boolean')
            ? (data.commitOk ? 'Depo kaydı tamamlandı.' : 'Depo kaydı başarısız: ' + (data.commitStatus || 'bilinmeyen durum'))
            : 'Depo kaydı bilgisi alınamadı.';
          console.log('✅ Sipariş başarıyla işlendi:', {
            orderId: finalId,
            commitInfo: commitInfo,
            serverData: data
          });
          setStatus('Sipariş alındı. No: ' + finalId + ' – ' + commitInfo, 'status-success');
          const successMsg = '<p><strong>Siparişiniz başarıyla kaydedildi!</strong></p>' +
            '<p>Sipariş No: <span class="code">' + finalId + '</span></p>' +
            '<p>' + commitInfo + '</p>' +
            '<p>Ödemeniz kontrol edildikten sonra siparişiniz işleme alınacaktır.</p>';
          showNotification('✅ Başarılı', successMsg, 'success', () => {
            window.location.href = '/anasayfa.html';
          });
        } else {
          console.error('❌ Tüm uç noktalar başarısız oldu!');
          console.error('Son hata:', lastErr);
          console.error('Hata mesajı:', lastErr?.message);
          console.error('Hata stack:', lastErr?.stack);
          // GitHub Pages gibi statik ortamda 405/404 olabilir; önce GitHub'a siparişi kaydetmeyi dene, ardından mailto fallback kullan
          try {
            // Sunucu tarafı commit yoksa ve ortam static ise kullanıcıya net bilgi ver
            console.warn('Sunucu commit başarısız; static ortam: GitHub token istemcide kullanılmıyor.');
          } catch(ghErr) {
            console.error('GitHub commit hatası (beklenmeyen):', ghErr);
          }
          try {
            const subject = encodeURIComponent('Sipariş Bildirimi – ' + order.id);
            const bodyLines = [
              'Sipariş No: ' + order.id,
              'Tarih: ' + new Date(order.date).toLocaleString(),
              'Ödeyen: ' + (order.customerName || '') + ' <' + (order.customerEmail || '') + '>',
              'IBAN: ' + (order.iban || ''),
              'Toplam: ' + (order.total || ''),
              'Adres: ' + (order.address || ''),
              '',
              'Ürünler:'
            ];
            (order.items||[]).forEach(i=>{
              bodyLines.push('- ' + (i.name||'Ürün') + ' x' + (i.qty||1) + ' @ ₺' + (Number(i.price||0).toFixed(2)));
            });
            const body = encodeURIComponent(bodyLines.join('\n'));
            const mailto = 'mailto:amtbrs@icloud.com?subject=' + subject + '&body=' + body;
            // Local backup yine de yaz
            const backupKey = 'orders_' + (payerEmail || 'guest');
            let orders = [];
            try { orders = JSON.parse(localStorage.getItem(backupKey) || '[]'); } catch(e) {}
            orders.push(order);
            localStorage.setItem(backupKey, JSON.stringify(orders));
            console.log('💾 Sipariş localStorage\'a kaydedildi:', backupKey);
            
            // Sepeti temizle
            if (payerEmail) {
              try { localStorage.removeItem('cart_' + payerEmail); } catch(e) {}
            } else {
              try {
                for (let i = localStorage.length - 1; i >= 0; i--) {
                  const k = localStorage.key(i);
                  if (k && k.indexOf('cart_') === 0) localStorage.removeItem(k);
                }
              } catch(e) {}
            }
            console.log('🗑️ Sepet temizlendi');
            
            // Kullanıcıya bilgi ve mailto aç
            setStatus('Sunucuya kaydedilemedi, e-posta bildirimi açıldı. Sipariş No: ' + order.id, 'status-warn');
            const fallbackMsg = '<p><strong>Sunucuya doğrudan bildirim yapılamadı.</strong></p>' +
              '<p>E-posta ile bildirim ekranı açılıyor...</p>' +
              '<p>Sipariş No: <span class="code">' + order.id + '</span></p>' +
              '<p>Lütfen açılan e-posta taslağını gönderin.</p>';
            showNotification('⚠️ E-posta Bildirimi', fallbackMsg, 'warn', () => {
              window.location.href = mailto;
              setTimeout(() => { window.location.href = '/anasayfa.html'; }, 1800);
            });
          } catch(fallbackErr) {
            throw new Error('Sipariş sunucuya iletilemedi ve e-posta fallback başarısız: ' + (fallbackErr && fallbackErr.message ? fallbackErr.message : 'bilinmeyen hata'));
          }
        }
      } catch(err) {
        console.error('🔴 Sipariş kaydı başarısız!');
        console.error('Hata mesajı:', err.message);
        console.error('Hata stack:', err.stack);
        console.error('Tüm hata objesi:', err);
        setStatus('Sipariş hatası: ' + err.message, 'status-error');
        const errorMsg = '<p><strong>Sipariş kaydedilemedi!</strong></p>' +
          '<p>Hata: ' + (err.message || 'bilinmeyen hata') + '</p>' +
          '<p>Lütfen tekrar deneyin veya iletişime geçin.</p>' +
          '<p style="font-size:0.85rem;color:#888;margin-top:1rem;word-break:break-all;">' + err.stack + '</p>';
        showNotification('❌ Hata', errorMsg, 'error');
        btn.textContent = 'Siparişi Bildir';
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
