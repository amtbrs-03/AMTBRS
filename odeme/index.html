<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Ödeme - IBAN</title>
  <style>
    body{font-family:Arial,Helvetica,sans-serif;background:#f7f7fb;color:#0b1220;padding:2rem}
    .box{max-width:720px;margin:2rem auto;padding:1.5rem;border-radius:8px;background:#fff;border:1px solid #e6e6ee}
    .iban{font-family:monospace;font-size:1.25rem;margin-top:0.5rem;word-break:break-all}
    .muted{color:#666;margin-top:0.5rem}
    a.btn{display:inline-block;margin-top:1rem;padding:0.6rem 1rem;background:#2563eb;color:#fff;border-radius:8px;text-decoration:none}

    /* Page transition animations */
    @keyframes pageEnter {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes pageExit {
      from {
        opacity: 1;
        transform: translateY(0);
      }
      to {
        opacity: 0;
        transform: translateY(-20px);
      }
    }

    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    body {
      opacity: 0;
      animation: pageEnter 0.4s ease-out forwards;
    }

    body.page-exit {
      animation: pageExit 0.3s ease-in forwards;
    }

    /* Re-enter animation class for bfcache restoration */
    body.page-reenter {
      opacity: 0;
      animation: pageEnter 0.4s ease-out forwards;
    }

    .box {
      opacity: 0;
      animation: fadeInUp 0.5s ease-out 0.15s forwards;
    }

    body, .box {
      will-change: opacity, transform;
    }

    @media (prefers-reduced-motion: reduce) {
      body, .box {
        animation: none !important;
        opacity: 1 !important;
        transform: none !important;
      }
      body.page-exit {
        animation: none !important;
      }
    }
  </style>
</head>
<body>
  <div class="box">
    <h1>Ödeme / Havale</h1>
    <p>Lütfen aşağıdaki IBAN'a ödeme yapınız. Ödeme sonrası siteden "Siparişi Bildir" butonunu kullanınız.</p>
    <div id="iban" class="iban">(IBAN yok)</div>
    <div id="total" class="muted">Toplam: ₺0.00</div>
    <div style="margin-top:1rem;">
      <a id="copyBtn" class="btn" href="#">IBAN'ı Kopyala</a>
  <a id="backBtn" class="btn" href="/anasayfa.html" style="background:#6b7280;margin-left:8px">Siteye Dön</a>
    </div>
  </div>

  <script>
    function qs(key){
      try{const u=new URL(location.href); return u.searchParams.get(key);}catch(e){return null}
    }
    const iban = qs('iban') || qs('IBAN') || '';
    const total = qs('total') || qs('amount') || '';
    if(iban){
      document.getElementById('iban').textContent = iban;
    }
    if(total){
      let t = total;
      if(!t.match(/[.,]/)) t = Number(t).toFixed(2);
      document.getElementById('total').textContent = 'Toplam: ₺' + t;
    }
    document.getElementById('copyBtn').addEventListener('click', function(e){
      e.preventDefault();
      const txt = document.getElementById('iban').textContent.trim();
  if(!txt || txt==='(IBAN yok)') { console.log('IBAN bulunamadı'); return; }
  navigator.clipboard?.writeText(txt).then(()=>console.log('IBAN kopyalandı: '+txt)).catch(()=>{ console.log('Lütfen kopyalayın: '+txt); });
    });

    /* --- Page transition animations --- */
    (function(){
      function handlePageTransition(e) {
        const link = e.target.closest('a[href]');
        if (!link) return;
        
        const href = link.getAttribute('href');
        if (!href) return;
        
        if (href.startsWith('#') || 
            href.startsWith('mailto:') || 
            href.startsWith('tel:') || 
            href.startsWith('javascript:') ||
            link.target === '_blank' ||
            link.hasAttribute('download')) {
          return;
        }
        
        try {
          const url = new URL(href, window.location.origin);
          if (url.origin !== window.location.origin) return;
        } catch (err) {}
        
        if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
          return;
        }
        
        e.preventDefault();
        document.body.classList.add('page-exit');
        
        setTimeout(function() {
          window.location.href = href;
        }, 300);
      }
      
      document.addEventListener('click', handlePageTransition);
      
      window.addEventListener('pageshow', function(e) {
        if (e.persisted) {
          document.body.classList.remove('page-exit');
          document.body.classList.add('page-reenter');
        }
      });
    })();
  </script>
</body>
</html>
