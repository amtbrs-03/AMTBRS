<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sipariş Detayı</title>
  <style>
    :root{
      --bg-1: rgba(16,185,129,0.15);
      --bg-2: rgba(16,185,129,0.12);
      --green-primary: #10b981;
      --green-dark: #064e3b;
      --muted: #6b7280;
      --card-bg: #ffffff;
    }
    body{
      margin:0;
      color:#0f172a;
      background: radial-gradient(1200px 600px at 10% 10%, var(--bg-1), transparent),
                  radial-gradient(800px 400px at 90% 90%, var(--bg-2), transparent),
                  linear-gradient(180deg, #ecfdf5 0%, #064e3b 100%);
      -webkit-font-smoothing:antialiased;
      -moz-osx-font-smoothing:grayscale;
      min-height:100vh;
      font-family: Arial, Helvetica, sans-serif;
    }
    .container{ max-width:1000px; margin:0 auto; padding:2rem; }
    /* Header */
    .page-header{
      background: linear-gradient(135deg, var(--green-primary) 0%, var(--green-dark) 100%);
      box-shadow: 0 10px 40px rgba(16, 185, 129, 0.3);
      padding:2rem; margin-bottom:2rem; border-radius:20px;
      display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:1rem;
    }
    .page-header h1{ margin:0; color:white; font-size:1.75rem; font-weight:800; text-shadow: 0 2px 10px rgba(0,0,0,0.2); }
    .header-actions{ display:flex; gap:1rem; align-items:center; }
    /* Buttons */
    .btn{ cursor:pointer; padding:0.75rem 1.5rem; border-radius:12px; border:none; background: linear-gradient(135deg, var(--green-primary) 0%, var(--green-dark) 100%); color:white; font-weight:700; font-size:0.95rem; box-shadow: 0 4px 15px rgba(16, 185, 129, 0.4), 0 8px 25px rgba(16, 185, 129, 0.2), inset 0 -2px 5px rgba(0,0,0,0.1); transform: translateY(0); transition: all 0.2s ease; text-decoration:none; display:inline-block; }
    .btn:hover{ transform: translateY(-2px); box-shadow: 0 6px 20px rgba(16, 185, 129, 0.5); }
    .btn:active{ transform: translateY(1px); }
    .btn-white{ background: #fff; color: var(--green-dark); border: 2px solid var(--green-primary); box-shadow: 0 4px 15px rgba(255, 255, 255, 0.3); }
    .btn-orange{ background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%); box-shadow: 0 4px 15px rgba(245, 158, 11, 0.4); }
    /* Detail Card */
    .detail-card{ background: var(--card-bg); padding:2rem; border-radius:20px; box-shadow: 0 10px 40px rgba(0,0,0,0.1); margin-bottom:2rem; }
    .detail-header{ display:flex; justify-content:space-between; align-items:center; margin-bottom:2rem; padding-bottom:1rem; border-bottom:2px solid #e5e7eb; }
    .detail-header h2{ margin:0; font-size:1.5rem; color:#064e3b; font-weight:700; }
    .status-badge{ display:inline-block; padding:0.5rem 1rem; border-radius:12px; font-size:0.95rem; font-weight:600; color:white; }
    .status-pending{ background:#f59e0b; } .status-ready{ background:#10b981; } .status-paid{ background:#22c55e; } .status-processing{ background:#3b82f6; } .status-shipped{ background:#8b5cf6; }
    /* Info Grid */
    .info-grid{ display:grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap:1.5rem; margin-bottom:2rem; }
    .info-item{ padding:1rem; background:#f9fafb; border-radius:12px; border-left:4px solid var(--green-primary); }
    .info-label{ font-size:0.85rem; color:var(--muted); font-weight:600; text-transform:uppercase; letter-spacing:0.5px; margin-bottom:0.5rem; }
    .info-value{ font-size:1.1rem; color:#0f172a; font-weight:600; }
    /* Items Table */
    .items-section{ margin-bottom:2rem; }
    .items-section h3{ font-size:1.25rem; color:#064e3b; margin-bottom:1rem; font-weight:700; }
    .items-table{ width:100%; border-collapse:collapse; background:#fff; border-radius:12px; overflow:hidden; box-shadow:0 2px 8px rgba(0,0,0,0.05); }
    .items-table thead{ background: linear-gradient(135deg, var(--green-primary), var(--green-dark)); color:#fff; }
    .items-table th{ padding:1rem; text-align:left; font-weight:600; }
    .items-table td{ padding:1rem; border-bottom:1px solid #e5e7eb; }
    .items-table tbody tr:last-child td{ border-bottom:none; }
    .items-table tbody tr:nth-child(even){ background:#f9fafb; }
    .total-row{ background:#f0fdf4 !important; font-weight:700; font-size:1.1rem; color:var(--green-dark); }
    .loading{ text-align:center; padding:3rem; color:var(--muted); font-size:1.1rem; }
    .error{ background:#fee; color:#c33; padding:1.5rem; border-radius:12px; border-left:4px solid #c33; }
    
    /* Sipariş Notu buton stilleri */
    #editNoteBtn.has-note {
      background: #dc2626 !important;
      color: #fff !important;
      animation: pulse-red 1.5s ease-in-out infinite;
    }
    #editNoteBtn.no-note {
      background: #10b981 !important;
      color: #fff !important;
    }
    @keyframes pulse-red {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.7; transform: scale(1.05); }
    }
    
    /* Print Styles */
    @media print{ body{ background:#fff; } .page-header, .header-actions, .btn{ display:none !important; } .detail-card{ box-shadow:none; page-break-inside:avoid; } }
    @media(max-width:768px){ .info-grid{ grid-template-columns:1fr; } .items-table{ font-size:0.85rem; } .items-table th, .items-table td{ padding:0.5rem; } }
  </style>
</head>
<body>
  <div class="container">
    <div class="page-header">
      <h1>📦 Sipariş Detayı</h1>
      <div class="header-actions">
        <button id="refreshBtn" class="btn btn-white" onclick="location.reload(true)">🔄 Yenile</button>
        <button id="createInvoiceBtn" class="btn btn-orange">🧾 Fatura Oluştur</button>
        <a href="siparisler.html" class="btn btn-white">← Sipariş Listesine Dön</a>
        <button id="editOrderBtn" class="btn">✏️ Düzenle</button>
        <button id="editNoteBtn" class="btn btn-white">📝 Sipariş Notu</button>
        <button id="deleteOrderBtn" class="btn btn-orange" style="background:#dc2626">🗑️ Sil</button>
      </div>
    </div>

    <div id="orderContent">
      <div class="loading">⏳ Sipariş detayları yükleniyor...</div>
    </div>
  </div>

  <script>
    function escapeHtml(s){ 
      if (typeof s !== 'string') {
        s = String(s || '');
      }
      return s.replace(/[&<>\"']/g, function(m){
        return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]
      }) 
    }

    let currentOrder = null;

    async function loadOrderDetail() {
      const contentEl = document.getElementById('orderContent');
      
      // Get order ID from URL parameter
      const urlParams = new URLSearchParams(window.location.search);
      const orderId = urlParams.get('id');
      
      if (!orderId) {
        contentEl.innerHTML = '<div class="error">❌ Hata: Sipariş numarası bulunamadı.</div>';
        return;
      }

      try {
        // Try raw GitHub first to avoid REST API rate limits
        const owner = 'amtbrs-03';
        const repo = 'AMTBRS';
        const branch = 'site-release';
        const fileName = `${orderId}.json`;
        const rawUrl = `https://raw.githubusercontent.com/${owner}/${repo}/${branch}/orders/${fileName}`;
        console.log('Fetching order (raw):', rawUrl);
        let orderRes = await fetch(rawUrl + `?t=${Date.now()}`);
        if (!orderRes.ok) {
          // Fallback to Contents API with Authorization token to increase rate limit
          const apiUrl = `https://api.github.com/repos/${owner}/${repo}/contents/orders/${fileName}?ref=${branch}`;
          const token = getGitHubToken();
          console.log('Raw fetch failed, using Contents API. Token?', !!token);
          const res = await fetch(apiUrl, {
            headers: {
              'Accept': 'application/vnd.github.v3+json',
              ...(token ? { 'Authorization': `token ${token}`, 'User-Agent': 'ERN-CICEK-App', 'X-GitHub-Api-Version': '2022-11-28' } : {})
            }
          });
          if (!res.ok) {
            if (res.status === 404) {
              throw new Error('Sipariş bulunamadı. Sipariş numarası geçersiz olabilir.');
            }
            const txt = await res.text();
            throw new Error(`GitHub API ${res.status}: ${res.statusText}\n${txt}`);
          }
          const fileData = await res.json();
          orderRes = await fetch(fileData.download_url + `?t=${Date.now()}`);
          if (!orderRes.ok) {
            throw new Error('Sipariş verileri yüklenemedi.');
          }
        }
        currentOrder = await orderRes.json();
        console.log('Order loaded:', currentOrder);
        
        renderOrderDetail(currentOrder);
        // After rendering, check if invoice exists to update button state
        try {
          const exists = await checkInvoiceExists(currentOrder.id);
          const btn = document.getElementById('createInvoiceBtn');
          if (btn) {
            if (exists) {
              btn.disabled = true;
              btn.textContent = '🧾 Fatura Zaten Oluşturulmuş';
              btn.title = 'Bu sipariş için fatura daha önce oluşturulmuş';
            } else {
              btn.disabled = false;
              btn.textContent = '🧾 Fatura Oluştur';
              btn.title = '';
            }
          }
        } catch (e) {
          console.warn('Fatura var mı kontrolü başarısız:', e);
        }
        
      } catch(err) {
        console.error('Failed to load order:', err);
        contentEl.innerHTML = `<div class="error">❌ Hata: ${escapeHtml(err.message)}</div>`;
      }
    }

    function renderOrderDetail(order) {
      function normalizeText(s){
        s = String(s || '').trim();
        if (!s) return s;
        try { const fixed = decodeURIComponent(escape(s)); if (fixed && fixed !== s) return fixed; } catch(_) {}
        try { if (/%[0-9A-Fa-f]{2}/.test(s)) return decodeURIComponent(s); } catch(_) {}
        return s;
      }
      const statusMap = {
        'pending': { text: 'Beklemede', class: 'status-pending' },
        'ready': { text: 'Hazır', class: 'status-ready' },
        'paid': { text: 'Ödendi', class: 'status-paid' },
        'processing': { text: 'İşleniyor', class: 'status-processing' },
        'shipped': { text: 'Gönderildi', class: 'status-shipped' }
      };
      
      const statusInfo = statusMap[order.status] || statusMap['pending'];
      const statusBadge = `<span class="status-badge ${statusInfo.class}">${statusInfo.text}</span>`;
      
      const orderDate = order.date 
        ? new Date(order.date).toLocaleDateString('tr-TR', {
            day:'2-digit', 
            month:'2-digit', 
            year:'numeric', 
            hour:'2-digit', 
            minute:'2-digit'
          }) 
        : '-';
      
      let html = '<div class="detail-card">';
      html += '<div class="detail-header">';
      html += `<h2>Sipariş #${escapeHtml(normalizeText(order.id) || '-')}</h2>`;
      html += statusBadge;
      html += '</div>';
      
      // Customer Info Grid
      html += '<div class="info-grid">';
      html += '<div class="info-item">';
      html += '<div class="info-label">👤 Müşteri Adı</div>';
      html += `<div class="info-value">${escapeHtml(normalizeText(order.customerName) || '-')}</div>`;
      html += '</div>';
      
      html += '<div class="info-item">';
      html += '<div class="info-label">📞 Telefon</div>';
      html += `<div class="info-value">${escapeHtml(normalizeText(order.customerPhone) || '-')}</div>`;
      html += '</div>';

      html += '<div class="info-item">';
      html += '<div class="info-label">📧 Email</div>';
      html += `<div class="info-value">${escapeHtml(normalizeText(order.customerEmail) || '-')}</div>`;
      html += '</div>';
      
      html += '<div class="info-item">';
      html += '<div class="info-label">📅 Sipariş Tarihi</div>';
      html += `<div class="info-value">${orderDate}</div>`;
      html += '</div>';
      
      html += '<div class="info-item">';
      html += '<div class="info-label">💰 Toplam Tutar</div>';
      html += `<div class="info-value">₺${escapeHtml(order.total || '0')}</div>`;
      html += '</div>';
      html += '</div>';
      
      // Address (view + edit)
      {
        const cleanAddress = (function(s){
          s = String((order.address || '') || '');
          try{ if (/%[0-9A-Fa-f]{2}/.test(s) || s.includes('+')) s = decodeURIComponent(s.replace(/\+/g,' ')); }catch(_){}
          try{ const ta = document.createElement('textarea'); ta.innerHTML = s; s = ta.value; }catch(_){}
          return s.replace(/\s+/g,' ').trim();
        })(order.address);
        html += '<div class="info-item" style="margin-bottom:2rem;">';
        html += '<div class="info-label">📍 Teslimat Adresi</div>';
        html += `<div id="orderAddressText" class="info-value">${escapeHtml(normalizeText(cleanAddress || '-'))}</div>`;
        // Edit controls
        html += '<div class="info-actions" style="margin-top:10px; display:flex; gap:8px; flex-wrap:wrap;">';
        html += '<button id="startEditAddressBtn" class="btn btn-white" type="button">✏️ Adresi Düzenle</button>';
        html += '<button id="refreshAddressBtnInline" class="btn btn-white" type="button">📥 Müşteri Adresini Çek</button>';
        html += '</div>';
        // Hidden editor
        html += '<div id="addressEditor" style="margin-top:10px; display:none;">';
        html += '<textarea id="addressEditTextarea" rows="3" style="width:100%; padding:10px; border:1px solid #e5e7eb; border-radius:8px; font-size:1rem;"></textarea>';
        html += '<div style="margin-top:8px; display:flex; gap:8px;">';
        html += '<button id="saveAddressBtn" class="btn" type="button">💾 Kaydet</button>';
        html += '<button id="cancelAddressBtn" class="btn btn-white" type="button">❌ İptal</button>';
        html += '</div>';
        html += '</div>';
        html += '</div>';
      }
      
      // Items Section
      html += '<div class="items-section">';
      html += '<h3>🛒 Sipariş Ürünleri</h3>';
      html += '<table class="items-table">';
      html += '<thead><tr>';
      html += '<th>Ürün Adı</th>';
      html += '<th style="text-align:center;">Adet</th>';
      html += '<th style="text-align:right;">Birim Fiyat</th>';
      html += '<th style="text-align:right;">Toplam</th>';
      html += '</tr></thead><tbody>';
      
      if (order.items && order.items.length > 0) {
        order.items.forEach(item => {
          const itemTotal = (item.price || 0) * (item.qty || 0);
          html += '<tr>';
          html += `<td>${escapeHtml(normalizeText(item.name) || '-')}</td>`;
          html += `<td style="text-align:center;">${item.qty || 0}</td>`;
          html += `<td style="text-align:right;">₺${(item.price || 0).toFixed(2)}</td>`;
          html += `<td style="text-align:right;">₺${itemTotal.toFixed(2)}</td>`;
          html += '</tr>';
        });
      } else {
        html += '<tr><td colspan="4" style="text-align:center;color:var(--muted);">Ürün bulunamadı</td></tr>';
      }
      
      html += '<tr class="total-row">';
      html += '<td colspan="3" style="text-align:right;padding-right:2rem;">GENEL TOPLAM</td>';
      html += `<td style="text-align:right;">₺${order.total || '0'}</td>`;
      html += '</tr>';
      
      html += '</tbody></table>';
      html += '</div>';
      
      // Sipariş Notu
      if (order.note) {
        html += '<div class="info-item">';
        html += '<div class="info-label">📝 Sipariş Notu</div>';
        html += `<div class="info-value" style="white-space:pre-wrap;background:#f9fafb;padding:0.75rem;border-radius:8px;border:1px solid #e5e7eb;">${escapeHtml(order.note)}</div>`;
        html += '</div>';
      }
      
      html += '</div>';
      
      document.getElementById('orderContent').innerHTML = html;
      
      // Sipariş Notu butonunu güncelle
      const noteBtn = document.getElementById('editNoteBtn');
      if (noteBtn) {
        noteBtn.classList.remove('has-note', 'no-note');
        if (order.note && order.note.trim()) {
          noteBtn.classList.add('has-note');
          noteBtn.innerHTML = '📝 Sipariş Notu (!)';
        } else {
          noteBtn.classList.add('no-note');
          noteBtn.innerHTML = '📝 Sipariş Notu';
        }
      }
    }

    async function createInvoice() {
      if (!currentOrder) {
        alert('Sipariş yüklenmedi!');
        return;
      }

      // Prevent duplicate invoice creation
      try {
        const exists = await checkInvoiceExists(currentOrder.id);
        if (exists) {
          alert('BU FATURA DAHA ÖNCE OLUŞTURULMUŞ');
          const btn = document.getElementById('createInvoiceBtn');
          if (btn) {
            btn.disabled = true;
            btn.textContent = '🧾 Fatura Zaten Oluşturulmuş';
            btn.title = 'Bu sipariş için fatura daha önce oluşturulmuş';
          }
          return;
        }
      } catch (e) {
        console.warn('Fatura mevcut mu kontrolü yapılamadı, devam ediliyor...', e);
      }
      
      // Create invoice HTML
      const statusMap = {
        'pending': 'Beklemede',
        'ready': 'Hazır',
        'paid': 'Ödendi',
        'processing': 'İşleniyor',
        'shipped': 'Gönderildi'
      };
      
      const orderDate = currentOrder.date 
        ? new Date(currentOrder.date).toLocaleDateString('tr-TR', {
            day:'2-digit', 
            month:'2-digit', 
            year:'numeric'
          }) 
        : '-';
      
      let invoiceHTML = `<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fatura - ${currentOrder.id}</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 800px; margin: 40px auto; padding: 20px; }
    .invoice-header { text-align: center; margin-bottom: 40px; border-bottom: 3px solid #10b981; padding-bottom: 20px; }
    .invoice-header h1 { color: #10b981; margin: 0; font-size: 2rem; }
    .invoice-header p { margin: 5px 0; color: #6b7280; }
    .company-info { background: #f0fdf4; padding: 20px; border-radius: 8px; margin-bottom: 30px; }
    .info-section { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 30px; }
    .info-box { background: #f9fafb; padding: 15px; border-radius: 8px; }
    .info-box h3 { margin: 0 0 10px 0; color: #064e3b; font-size: 1rem; }
    .info-box p { margin: 5px 0; color: #0f172a; }
    .info-label { color: #6b7280; font-size: 0.85rem; font-weight: 600; }
    table { width: 100%; border-collapse: collapse; margin: 30px 0; }
    thead { background: #10b981; color: white; }
    th, td { padding: 12px; text-align: left; border-bottom: 1px solid #e5e7eb; }
    th { font-weight: 600; }
    tbody tr:nth-child(even) { background: #f9fafb; }
    .total-row { background: #f0fdf4 !important; font-weight: bold; font-size: 1.1rem; }
    .text-right { text-align: right; }
    .text-center { text-align: center; }
    .footer { margin-top: 50px; padding-top: 20px; border-top: 2px solid #e5e7eb; text-align: center; color: #6b7280; font-size: 0.9rem; }
    @media print {
      body { margin: 0; }
      .no-print { display: none; }
    }
  </style>
</head>
<body>
  <div class="invoice-header">
    <h1>🌸 ERN-ÇİÇEK</h1>
    <p>amtbrs-03.github.io/AMTBRS</p>
    <p>Fatura Tarihi: ${new Date().toLocaleDateString('tr-TR')}</p>
  </div>

  <div class="company-info">
    <h3 style="margin:0 0 10px 0;color:#064e3b;">Şirket Bilgileri</h3>
    <p><strong>ERN-ÇİÇEK</strong></p>
    <p>Adres: [Şirket Adresi]</p>
    <p>Telefon: [Telefon]</p>
    <p>Email: amtbrs@icloud.com</p>
  </div>

  <div class="info-section">
    <div class="info-box">
      <h3>📦 Sipariş Bilgileri</h3>
      <p><span class="info-label">Sipariş No:</span> <strong>${escapeHtml(currentOrder.id)}</strong></p>
      <p><span class="info-label">Sipariş Tarihi:</span> ${orderDate}</p>
      <p><span class="info-label">Durum:</span> ${statusMap[currentOrder.status] || 'Beklemede'}</p>
    </div>
    
    <div class="info-box">
      <h3>👤 Müşteri Bilgileri</h3>
      <p><strong>${escapeHtml(currentOrder.customerName || '-')}</strong></p>
      <p>${escapeHtml(currentOrder.customerEmail || '-')}</p>
      ${currentOrder.address ? `<p>${escapeHtml((function(s){ try{ if (/%[0-9A-Fa-f]{2}/.test(s) || s.includes('+')) s = decodeURIComponent(s.replace(/\+/g,' ')); }catch(_){} try{ const ta = document.createElement('textarea'); ta.innerHTML = s; s = ta.value; }catch(_){} return s.replace(/\s+/g,' ').trim(); })(currentOrder.address))}</p>` : ''}
    </div>
  </div>

  <h3 style="color:#064e3b;margin-bottom:10px;">🛒 Ürün Listesi</h3>
  <table>
    <thead>
      <tr>
        <th>Ürün Adı</th>
        <th class="text-center">Adet</th>
        <th class="text-right">Birim Fiyat</th>
        <th class="text-right">Toplam</th>
      </tr>
    </thead>
    <tbody>`;
      
      if (currentOrder.items && currentOrder.items.length > 0) {
        currentOrder.items.forEach(item => {
          const itemTotal = (item.price || 0) * (item.qty || 0);
          invoiceHTML += `
      <tr>
        <td>${escapeHtml(item.name || '-')}</td>
        <td class="text-center">${item.qty || 0}</td>
        <td class="text-right">₺${(item.price || 0).toFixed(2)}</td>
        <td class="text-right">₺${itemTotal.toFixed(2)}</td>
      </tr>`;
        });
      }
      
      invoiceHTML += `
      <tr class="total-row">
        <td colspan="3" class="text-right" style="padding-right:20px;">GENEL TOPLAM</td>
        <td class="text-right">₺${currentOrder.total || '0.00'}</td>
      </tr>
    </tbody>
  </table>

  ${currentOrder.iban ? `
  <div class="info-box">
    <h3>🏦 Ödeme Bilgileri</h3>
    <p><span class="info-label">IBAN:</span> <strong style="font-family:monospace;">${escapeHtml(currentOrder.iban)}</strong></p>
  </div>` : ''}

  <div class="footer">
    <p>Bu fatura elektronik olarak oluşturulmuştur.</p>
    <p>ERN-ÇİÇEK - Güvenle Alışverişin Adresi</p>
  </div>

  <div class="no-print" style="text-align:center;margin-top:30px;">

    // Token management functions (same as admin.html)
    function decodeToken(encoded, key) {
      let result = '';
      for (let i = 0; i < encoded.length; i++) {
        result += String.fromCharCode(encoded.charCodeAt(i) ^ key.charCodeAt(i % key.length));
      }
      return result;
    }

    // Fetch latest customer address from users/<email>_full.json (raw-first) and update order file
    async function refreshCustomerAddress() {
      if (!currentOrder) { alert('Sipariş yüklenmedi!'); return; }
      const email = currentOrder.customerEmail || currentOrder.payerEmail;
      if (!email) { alert('Müşteri e-postası bulunamadı.'); return; }
      try {
        // Pull user profile file
        const userPath = `users/${encodeURIComponent(email)}_full.json`;
        const rawUrl = `https://raw.githubusercontent.com/amtbrs-03/AMTBRS/site-release/${userPath}`;
        let userData = null;
        // Try raw first (avoids rate limits, no token needed)
        try {
          const rawRes = await fetch(rawUrl + `?t=${Date.now()}`, { cache: 'no-store' });
          if (rawRes.ok) {
            userData = await rawRes.json();
          }
        } catch (e) {
          // continue to fallback
        }
        if (!userData) {
          const apiUrl = `https://api.github.com/repos/amtbrs-03/AMTBRS/contents/${userPath}?ref=site-release&t=${Date.now()}`;
          const apiRes = await fetch(apiUrl, { headers: { 'Accept': 'application/vnd.github.v3+json' }, cache: 'no-store' });
          if (!apiRes.ok) {
            const txt = await apiRes.text();
            console.error('User fetch failed:', apiRes.status, txt);
            alert('❌ Müşteri profili alınamadı.');
            return;
          }
          const userFile = await apiRes.json();
          try {
            userData = JSON.parse(atob(userFile.content));
          } catch (_) {
            const dl = await fetch(userFile.download_url + `?t=${Date.now()}`, { cache: 'no-store' });
            userData = await dl.json();
          }
        }
        // Determine latest address
        const addresses = Array.isArray(userData.addresses) ? userData.addresses : [];
        const preferred = addresses.find(a => a.default) || addresses[0];
        const latestAddress = preferred ? (preferred.fullAddress || [preferred.city, preferred.district, preferred.neighborhood, preferred.streetAddress, preferred.postalCode].filter(Boolean).join(' ')) : (userData.address || '');
        if (!latestAddress) {
          alert('Müşteri profilinde adres bulunamadı.');
          return;
        }
        // If address missing or changed, update order file and remote user profile
        const needsUpdate = !currentOrder.address || String(currentOrder.address).trim() !== String(latestAddress).trim();
        if (!needsUpdate) {
          alert('Adres zaten güncel.');
          return;
        }
        // First update remote user profile via /update-user if endpoint is configured
        try {
          const settingsRes = await fetch('site-settings.json', { cache: 'no-store' });
          if (settingsRes.ok) {
            const settings = await settingsRes.json();
            const orderEndpoint = settings.orderEndpoint || '';
            if (orderEndpoint) {
              const updateEndpoint = orderEndpoint.replace(/\/send-order$/, '/update-user');
              const profileBody = { email, address: latestAddress };
              await fetch(updateEndpoint, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(profileBody)
              }).catch(()=>{});
            }
          }
        } catch (e) {
          console.warn('Uzak profil güncelleme başarısız (devam ediliyor):', e);
        }

        // Update order file with this address
        const token = getGitHubToken();
        if (!token) { alert('⚠️ GitHub token bulunamadı.'); return; }
        const getRes = await fetch(`https://api.github.com/repos/amtbrs-03/AMTBRS/contents/orders/${currentOrder.id}.json?ref=site-release&t=${Date.now()}`,{
          headers:{ 'Accept':'application/vnd.github.v3+json','Authorization':`token ${token}` }
        });
        if (!getRes.ok) { alert('❌ Sipariş dosyası alınamadı.'); return; }
        const fileData = await getRes.json();
        const orderObj = JSON.parse(atob(fileData.content));
        orderObj.address = latestAddress;
        const putRes = await fetch(`https://api.github.com/repos/amtbrs-03/AMTBRS/contents/orders/${currentOrder.id}.json`,{
          method:'PUT',
          headers:{ 'Accept':'application/vnd.github.v3+json','Authorization':`token ${token}`,'Content-Type':'application/json' },
          body: JSON.stringify({
            message: `Sipariş adresi müşteri profilinden güncellendi: ${currentOrder.id}`,
            content: btoa(unescape(encodeURIComponent(JSON.stringify(orderObj, null, 2)))) ,
            sha: fileData.sha,
            branch:'site-release'
          })
        });
        if (putRes.ok) {
          alert('✅ Adres müşteri profilinden çekildi ve güncellendi.');
          // Update UI immediately without full reload
          currentOrder.address = latestAddress;
          renderOrderDetail(currentOrder);
        } else {
          const txt = await putRes.text();
          console.error('Refresh address failed:', putRes.status, txt);
          alert('❌ Adres güncelleme başarısız.');
        }
      } catch (e) {
        console.error('Refresh address error:', e);
        alert('❌ Adres çekme sırasında hata oluştu.');
      }
    }

          })
        });
        
        if (putRes.ok) {
          alert('✅ Sipariş notu kaydedildi!');
          currentOrder.note = newNote.trim();
          renderOrderDetail(currentOrder);
        } else {
          const txt = await putRes.text();
          console.error('Not güncelleme hatası:', putRes.status, txt);
          alert('❌ Not kaydedilemedi.');
        }
      } catch (e) {
        console.error('Not kaydetme hatası:', e);
        alert('❌ Not kaydedilirken bir hata oluştu.');
      }
    }

    // Re-wire after each render
    const _origRender = renderOrderDetail;
    renderOrderDetail = function(order){ _origRender(order); try{ wireAddressEditor(); }catch(_){} };
  </script>
</body>
</html>
