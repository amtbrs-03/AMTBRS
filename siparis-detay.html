<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sipariş Detayı</title>
  <style>
    :root{
      --bg-1: rgba(16,185,129,0.15);
      --bg-2: rgba(16,185,129,0.12);
      --green-primary: #10b981;
      --green-dark: #064e3b;
      --muted: #6b7280;
      --card-bg: #ffffff;
    }
    body{
      margin:0;
      color:#0f172a;
      background: radial-gradient(1200px 600px at 10% 10%, var(--bg-1), transparent),
                  radial-gradient(800px 400px at 90% 90%, var(--bg-2), transparent),
                  linear-gradient(180deg, #ecfdf5 0%, #064e3b 100%);
      -webkit-font-smoothing:antialiased;
      -moz-osx-font-smoothing:grayscale;
      min-height:100vh;
      font-family: Arial, Helvetica, sans-serif;
    }
    .container{ max-width:1000px; margin:0 auto; padding:2rem; }
    /* Header */
    .page-header{
      background: linear-gradient(135deg, var(--green-primary) 0%, var(--green-dark) 100%);
      box-shadow: 0 10px 40px rgba(16, 185, 129, 0.3);
      padding:2rem; margin-bottom:2rem; border-radius:20px;
      display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:1rem;
    }
    .page-header h1{ margin:0; color:white; font-size:1.75rem; font-weight:800; text-shadow: 0 2px 10px rgba(0,0,0,0.2); }
    .header-actions{ display:flex; gap:1rem; align-items:center; }
    /* Buttons */
    .btn{ cursor:pointer; padding:0.75rem 1.5rem; border-radius:12px; border:none; background: linear-gradient(135deg, var(--green-primary) 0%, var(--green-dark) 100%); color:white; font-weight:700; font-size:0.95rem; box-shadow: 0 4px 15px rgba(16, 185, 129, 0.4), 0 8px 25px rgba(16, 185, 129, 0.2), inset 0 -2px 5px rgba(0,0,0,0.1); transform: translateY(0); transition: all 0.2s ease; text-decoration:none; display:inline-block; }
    .btn:hover{ transform: translateY(-2px); box-shadow: 0 6px 20px rgba(16, 185, 129, 0.5); }
    .btn:active{ transform: translateY(1px); }
    .btn-white{ background: #fff; color: var(--green-dark); border: 2px solid var(--green-primary); box-shadow: 0 4px 15px rgba(255, 255, 255, 0.3); }
    .btn-orange{ background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%); box-shadow: 0 4px 15px rgba(245, 158, 11, 0.4); }
    .btn-danger{ background:#dc2626; box-shadow: 0 4px 15px rgba(220, 38, 38, 0.35); }
    /* Detail Card */
    .detail-card{ background: var(--card-bg); padding:2rem; border-radius:20px; box-shadow: 0 10px 40px rgba(0,0,0,0.1); margin-bottom:2rem; }
    .detail-header{ display:flex; justify-content:space-between; align-items:center; margin-bottom:2rem; padding-bottom:1rem; border-bottom:2px solid #e5e7eb; }
    .detail-header h2{ margin:0; font-size:1.5rem; color:#064e3b; font-weight:700; }
    .status-badge{ display:inline-block; padding:0.5rem 1rem; border-radius:12px; font-size:0.95rem; font-weight:600; color:white; }
    .status-pending{ background:#f59e0b; } .status-ready{ background:#10b981; } .status-paid{ background:#22c55e; } .status-processing{ background:#3b82f6; } .status-shipped{ background:#8b5cf6; }
    /* Info Grid */
    .info-grid{ display:grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap:1.5rem; margin-bottom:2rem; }
    .info-item{ padding:1rem; background:#f9fafb; border-radius:12px; border-left:4px solid var(--green-primary); }
    .info-label{ font-size:0.85rem; color:var(--muted); font-weight:600; text-transform:uppercase; letter-spacing:0.5px; margin-bottom:0.5rem; }
    .info-value{ font-size:1.1rem; color:#0f172a; font-weight:600; }
    /* Items Table */
    .items-section{ margin-bottom:2rem; }
    .items-section h3{ font-size:1.25rem; color:#064e3b; margin-bottom:1rem; font-weight:700; }
    .items-table{ width:100%; border-collapse:collapse; background:#fff; border-radius:12px; overflow:hidden; box-shadow:0 2px 8px rgba(0,0,0,0.05); }
    .items-table thead{ background: linear-gradient(135deg, var(--green-primary), var(--green-dark)); color:#fff; }
    .items-table th{ padding:1rem; text-align:left; font-weight:600; }
    .items-table td{ padding:1rem; border-bottom:1px solid #e5e7eb; }
    .items-table tbody tr:last-child td{ border-bottom:none; }
    .items-table tbody tr:nth-child(even){ background:#f9fafb; }
    .total-row{ background:#f0fdf4 !important; font-weight:700; font-size:1.1rem; color:var(--green-dark); }
    .loading{ text-align:center; padding:3rem; color:var(--muted); font-size:1.1rem; }
    .error{ background:#fee; color:#c33; padding:1.5rem; border-radius:12px; border-left:4px solid #c33; }

    /* App Dialog (alert/confirm) */
    .app-modal{
      display:none;
      position:fixed;
      inset:0;
      background:rgba(0,0,0,0.6);
      z-index:5000;
      align-items:center;
      justify-content:center;
      -webkit-backdrop-filter:blur(6px);
      backdrop-filter:blur(6px);
      padding:1rem;
    }
    .app-modal.active{ display:flex; }
    .app-modal-content{
      background:#fff;
      width:min(620px, 94vw);
      border-radius:16px;
      box-shadow:0 18px 50px rgba(0,0,0,0.25);
      border:1px solid #e5e7eb;
      overflow:hidden;
    }
    .app-modal-content.info{ border-left:6px solid #3b82f6; }
    .app-modal-content.success{ border-left:6px solid var(--green-primary); }
    .app-modal-content.warn{ border-left:6px solid #f59e0b; }
    .app-modal-content.error,
    .app-modal-content.danger{ border-left:6px solid #dc2626; }
    .app-modal-header{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:0.75rem;
      padding:1rem 1.2rem;
      border-bottom:1px solid #e5e7eb;
      background:linear-gradient(180deg, #ffffff 0%, #f9fafb 100%);
    }
    .app-modal-title{
      margin:0;
      font-size:1.05rem;
      font-weight:900;
      color:#0f172a;
      letter-spacing:0.2px;
    }
    .app-modal-close{
      background:transparent;
      border:none;
      cursor:pointer;
      color:#6b7280;
      font-size:1.3rem;
      padding:0;
      line-height:1;
    }
    .app-modal-body{ padding:1rem 1.2rem; }
    .app-modal-message{
      white-space:pre-wrap;
      color:#334155;
      line-height:1.55;
      font-weight:600;
    }
    .app-modal-details{
      display:none;
      margin-top:0.75rem;
      padding:0.75rem;
      background:#f8fafc;
      border:1px dashed #cbd5e1;
      border-radius:12px;
      white-space:pre-wrap;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
      font-size:0.85rem;
      color:#0f172a;
    }
    .app-modal-footer{
      display:flex;
      align-items:center;
      justify-content:flex-end;
      gap:0.5rem;
      padding:1rem 1.2rem;
      border-top:1px solid #e5e7eb;
      background:#f9fafb;
      flex-wrap:wrap;
    }
    .modal-btn{
      cursor:pointer;
      padding:0.65rem 1rem;
      border-radius:12px;
      border:none;
      font-weight:800;
      font-size:0.95rem;
      transition:transform 0.15s ease, opacity 0.15s ease;
    }
    .modal-btn:active{ transform:translateY(1px); }
    .modal-btn.cancel{ background:#6b7280; color:#fff; }
    .modal-btn.primary{ background: linear-gradient(135deg, var(--green-primary) 0%, var(--green-dark) 100%); color:#fff; }
    .modal-btn.danger{ background:#dc2626; color:#fff; }

    /* Full-page Invoice Panel */
    .invoice-panel{
      display:none;
      position:fixed;
      inset:0;
      z-index:6500;
      background:rgba(0,0,0,0.6);
      -webkit-backdrop-filter:blur(6px);
      backdrop-filter:blur(6px);
    }
    .invoice-panel.active{ display:flex; flex-direction:column; }
    .invoice-panel-shell{
      flex:1;
      display:flex;
      flex-direction:column;
      margin:1rem;
      background:#fff;
      border-radius:16px;
      overflow:hidden;
      border:1px solid #e5e7eb;
      box-shadow:0 18px 50px rgba(0,0,0,0.25);
    }
    .invoice-panel-header{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:0.75rem;
      padding:0.9rem 1.1rem;
      border-bottom:1px solid #e5e7eb;
      background:linear-gradient(135deg, var(--green-primary) 0%, var(--green-dark) 100%);
      color:#fff;
    }
    .invoice-panel-title{
      margin:0;
      font-weight:900;
      font-size:1rem;
      letter-spacing:0.2px;
    }
    .invoice-panel-close{
      cursor:pointer;
      background:rgba(255,255,255,0.16);
      border:1px solid rgba(255,255,255,0.22);
      color:#fff;
      border-radius:12px;
      padding:0.55rem 0.85rem;
      font-weight:900;
    }
    .invoice-panel-close:active{ transform:translateY(1px); }
    .invoice-panel-body{ flex:1; background:#fff; }
    .invoice-panel-iframe{
      width:100%;
      height:100%;
      border:0;
      background:#fff;
    }
    
    /* Müşteri notu buton stilleri */
    #customerNoteBtn.has-unread-note {
      background: #dc2626 !important;
      color: #fff !important;
      animation: pulse-red 1.5s ease-in-out infinite;
    }
    #customerNoteBtn.has-read-note {
      background: #f59e0b !important;
      color: #fff !important;
    }
    #customerNoteBtn.no-note {
      display: none !important;
    }
    @keyframes pulse-red {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.7; transform: scale(1.05); }
    }
    
    /* Print Styles */
    @media print{ body{ background:#fff; } .page-header, .header-actions, .btn{ display:none !important; } .detail-card{ box-shadow:none; page-break-inside:avoid; } }
    @media(max-width:768px){ .info-grid{ grid-template-columns:1fr; } .items-table{ font-size:0.85rem; } .items-table th, .items-table td{ padding:0.5rem; } }
  </style>
</head>
<body>
  <div class="container">
    <div class="page-header">
      <h1>📦 Sipariş Detayı</h1>
      <div class="header-actions">
        <a href="siparisler.html" class="btn btn-white">← Sipariş Listesine Dön</a>
        <button id="createInvoiceBtn" class="btn btn-orange">🧾 Bilgi Fişi Oluştur</button>
        <button id="editOrderBtn" class="btn">✏️ Düzenle</button>
        <button id="customerNoteBtn" class="btn no-note">💬 Müşteri Notu</button>
        <button id="refreshBtn" class="btn btn-white" onclick="location.reload(true)">🔄 Yenile</button>
        <button id="deleteOrderBtn" class="btn btn-danger">🗑️ Sil</button>
      </div>
    </div>

    <div id="orderContent">
      <div class="loading">⏳ Sipariş detayları yükleniyor...</div>
    </div>
  </div>

  <!-- App Dialog Modal (replaces alert/confirm) -->
  <div id="appDialog" class="app-modal" role="dialog" aria-modal="true" aria-labelledby="appDialogTitle" aria-describedby="appDialogMessage">
    <div id="appDialogContent" class="app-modal-content info">
      <div class="app-modal-header">
        <h3 id="appDialogTitle" class="app-modal-title">Bilgi</h3>
        <button id="appDialogClose" class="app-modal-close" aria-label="Kapat">×</button>
      </div>
      <div class="app-modal-body">
        <div id="appDialogMessage" class="app-modal-message"></div>
        <div id="appDialogDetails" class="app-modal-details"></div>
      </div>
      <div class="app-modal-footer">
        <button id="appDialogCancel" class="modal-btn cancel" type="button">Vazgeç</button>
        <button id="appDialogOk" class="modal-btn primary" type="button">Tamam</button>
      </div>
    </div>
  </div>

  <!-- Invoice Full Page Panel -->
  <div id="invoicePanel" class="invoice-panel" role="dialog" aria-modal="true" aria-labelledby="invoicePanelTitle">
    <div class="invoice-panel-shell">
      <div class="invoice-panel-header">
        <h3 id="invoicePanelTitle" class="invoice-panel-title">🧾 Bilgi Fişi</h3>
        <button id="invoicePanelClose" class="invoice-panel-close" type="button">Kapat</button>
      </div>
      <div class="invoice-panel-body">
        <iframe id="invoiceFrame" class="invoice-panel-iframe" title="Bilgi Fişi"></iframe>
      </div>
    </div>
  </div>

  <script>
    function escapeHtml(s){ 
      if (typeof s !== 'string') {
        s = String(s || '');
      }
      return s.replace(/[&<>\"']/g, function(m){
        return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]
      }) 
    }

    let currentOrder = null;

    // Invoice panel helpers
    (function(){
      const panel = document.getElementById('invoicePanel');
      const frame = document.getElementById('invoiceFrame');
      const titleEl = document.getElementById('invoicePanelTitle');
      const closeBtn = document.getElementById('invoicePanelClose');

      function openInvoicePanel(invoiceHTML, title){
        if (!panel || !frame) {
          // Fallback
          const w = window.open('', '_blank');
          if (w && w.document) {
            w.document.write(invoiceHTML || '');
            w.document.close();
          }
          return;
        }
        if (titleEl) titleEl.textContent = title || '🧾 Bilgi Fişi';
        frame.srcdoc = String(invoiceHTML || '');
        panel.classList.add('active');
        document.body.style.overflow = 'hidden';
      }

      function closeInvoicePanel(){
        if (!panel || !frame) return;
        panel.classList.remove('active');
        frame.srcdoc = '';
        document.body.style.overflow = '';
      }

      window.openInvoicePanel = openInvoicePanel;
      window.closeInvoicePanel = closeInvoicePanel;

      if (closeBtn) closeBtn.addEventListener('click', closeInvoicePanel);
      if (panel) {
        panel.addEventListener('click', (ev) => {
          if (ev && ev.target === panel) closeInvoicePanel();
        });
      }
      document.addEventListener('keydown', (ev) => {
        if (ev && ev.key === 'Escape' && panel && panel.classList.contains('active')) {
          closeInvoicePanel();
        }
      });
    })();

    // Framed modal dialog helpers (replace native alert/confirm)
    (function(){
      const modal = document.getElementById('appDialog');
      const content = document.getElementById('appDialogContent');
      const titleEl = document.getElementById('appDialogTitle');
      const msgEl = document.getElementById('appDialogMessage');
      const detailsEl = document.getElementById('appDialogDetails');
      const okBtn = document.getElementById('appDialogOk');
      const cancelBtn = document.getElementById('appDialogCancel');
      const closeBtn = document.getElementById('appDialogClose');

      function inferTypeFromText(text){
        const t = String(text || '');
        if (t.includes('🗑️') || /\bsil/i.test(t)) return 'danger';
        if (t.includes('❌') || /hata/i.test(t)) return 'error';
        if (t.includes('⚠️') || /uyarı/i.test(t)) return 'warn';
        if (t.includes('✅')) return 'success';
        return 'info';
      }

      function splitTitleAndBody(raw){
        const text = String(raw || '').trim();
        if (!text) return { title: 'Bilgi', body: '' };
        const parts = text.split(/\n\n/);
        if (parts.length === 1) return { title: 'Bilgi', body: parts[0] };
        const title = (parts.shift() || '').trim();
        const body = parts.join('\n\n').trim();
        return { title: title || 'Bilgi', body };
      }

      function setContent({type, title, message, details, mode, confirmText, cancelText}){
        const safeType = type || inferTypeFromText(title || message);
        if (content) {
          content.className = 'app-modal-content ' + safeType;
        }
        if (titleEl) titleEl.textContent = title || 'Bilgi';
        if (msgEl) msgEl.textContent = message || '';
        if (detailsEl) {
          if (details) {
            detailsEl.style.display = 'block';
            detailsEl.textContent = String(details);
          } else {
            detailsEl.style.display = 'none';
            detailsEl.textContent = '';
          }
        }

        const isConfirm = mode === 'confirm';
        if (cancelBtn) {
          cancelBtn.style.display = isConfirm ? 'inline-block' : 'none';
          cancelBtn.textContent = cancelText || 'Vazgeç';
        }
        if (okBtn) {
          okBtn.textContent = confirmText || (isConfirm ? 'Evet' : 'Tamam');
          const dangerLike = safeType === 'danger' || safeType === 'error';
          okBtn.className = 'modal-btn ' + (dangerLike ? 'danger' : 'primary');
        }
      }

      function openModal(){
        if (!modal) return;
        modal.classList.add('active');
        document.body.style.overflow = 'hidden';
      }

      function closeModal(){
        if (!modal) return;
        modal.classList.remove('active');
        document.body.style.overflow = '';
      }

      function showDialog(options){
        return new Promise((resolve) => {
          if (!modal) {
            // Fallback to native if markup missing
            if (options && options.mode === 'confirm') {
              resolve(!!confirm((options.message || '').toString()));
            } else {
              alert((options.message || '').toString());
              resolve(true);
            }
            return;
          }

          setContent(options || {});
          openModal();

          let settled = false;
          const cleanup = () => {
            document.removeEventListener('keydown', onKeyDown);
            if (modal) modal.removeEventListener('click', onBackdrop);
            if (okBtn) okBtn.removeEventListener('click', onOk);
            if (cancelBtn) cancelBtn.removeEventListener('click', onCancel);
            if (closeBtn) closeBtn.removeEventListener('click', onCancel);
          };
          const finish = (val) => {
            if (settled) return;
            settled = true;
            cleanup();
            closeModal();
            resolve(val);
          };
          const onOk = () => finish(true);
          const onCancel = () => finish(false);
          const onBackdrop = (ev) => { if (ev && ev.target === modal) finish(false); };
          const onKeyDown = (ev) => {
            if (!ev) return;
            if (ev.key === 'Escape') return finish(false);
            if (ev.key === 'Enter' && options && options.mode === 'confirm') return finish(true);
          };

          document.addEventListener('keydown', onKeyDown);
          modal.addEventListener('click', onBackdrop);
          okBtn && okBtn.addEventListener('click', onOk);
          cancelBtn && cancelBtn.addEventListener('click', onCancel);
          closeBtn && closeBtn.addEventListener('click', onCancel);

          // Focus primary action
          setTimeout(() => { try { (okBtn || cancelBtn || closeBtn).focus(); } catch(_) {} }, 0);
        });
      }

      window.appAlert = function(raw, forcedType){
        const parts = splitTitleAndBody(raw);
        return showDialog({
          mode: 'alert',
          type: forcedType || inferTypeFromText(parts.title),
          title: parts.title,
          message: parts.body || ''
        });
      };

      window.appConfirm = function(message, opts){
        const o = opts || {};
        return showDialog({
          mode: 'confirm',
          type: o.type || 'danger',
          title: o.title || 'Onay',
          message: message || '',
          confirmText: o.confirmText || 'Evet',
          cancelText: o.cancelText || 'Vazgeç'
        });
      };
    })();

    async function loadOrderDetail() {
      console.log('loadOrderDetail çağrıldı');
      const contentEl = document.getElementById('orderContent');
      
      // Get order ID from URL parameter
      const urlParams = new URLSearchParams(window.location.search);
      const orderId = urlParams.get('id');
      console.log('orderId:', orderId);
      
      if (!orderId) {
        contentEl.innerHTML = '<div class="error">❌ Hata: Sipariş numarası bulunamadı.</div>';
        return;
      }

      try {
        // Try raw GitHub first to avoid REST API rate limits
        const owner = 'amtbrs-03';
        const repo = 'AMTBRS';
        const branch = 'site-release';
        const fileName = `${orderId}.json`;
        const rawUrl = `https://raw.githubusercontent.com/${owner}/${repo}/${branch}/orders/${fileName}`;
        console.log('Fetching order (raw):', rawUrl);
        let orderRes = await fetch(rawUrl + `?t=${Date.now()}`);
        console.log('Raw fetch response:', orderRes.status, orderRes.ok);
        if (!orderRes.ok) {
          // Fallback to Contents API with Authorization token to increase rate limit
          const apiUrl = `https://api.github.com/repos/${owner}/${repo}/contents/orders/${fileName}?ref=${branch}`;
          const token = getGitHubToken();
          console.log('Raw fetch failed, using Contents API. Token?', !!token);
          const res = await fetch(apiUrl, {
            headers: {
              'Accept': 'application/vnd.github.v3+json',
              ...(token ? { 'Authorization': `token ${token}`, 'User-Agent': 'ERN-CICEK-App', 'X-GitHub-Api-Version': '2022-11-28' } : {})
            }
          });
          if (!res.ok) {
            if (res.status === 404) {
              throw new Error('Sipariş bulunamadı. Sipariş numarası geçersiz olabilir.');
            }
            const txt = await res.text();
            throw new Error(`GitHub API ${res.status}: ${res.statusText}\n${txt}`);
          }
          const fileData = await res.json();
          orderRes = await fetch(fileData.download_url + `?t=${Date.now()}`);
          if (!orderRes.ok) {
            throw new Error('Sipariş verileri yüklenemedi.');
          }
        }
        currentOrder = await orderRes.json();
        console.log('Order loaded:', currentOrder);
        
        renderOrderDetail(currentOrder);
        // After rendering, check if invoice exists to update button state
        try {
          const exists = await checkInvoiceExists(currentOrder.id);
          const btn = document.getElementById('createInvoiceBtn');
          if (btn) {
            if (exists) {
              btn.disabled = true;
              btn.textContent = '🧾 Bilgi Fişi Zaten Oluşturulmuş';
              btn.title = 'Bu sipariş için bilgi fişi daha önce oluşturulmuş';
            } else {
              btn.disabled = false;
              btn.textContent = '🧾 Bilgi Fişi Oluştur';
              btn.title = '';
            }
          }
        } catch (e) {
          console.warn('Bilgi Fişi var mı kontrolü başarısız:', e);
        }
        
      } catch(err) {
        console.error('Failed to load order:', err);
        contentEl.innerHTML = `<div class="error">❌ Hata: ${escapeHtml(err.message)}</div>`;
      }
    }

    function renderOrderDetail(order) {
      // UTF-8 safe base64 decode (handles mojibake from GitHub API)
      function byteReDecode(str) {
        try {
          const bytes = new Uint8Array(str.length);
          for (let i = 0; i < str.length; i++) {
            bytes[i] = str.charCodeAt(i) & 0xFF;
          }
          return new TextDecoder().decode(bytes);
        } catch (e) {
          return str;
        }
      }
      function normalizeText(s){
        s = String(s || '').trim();
        if (!s) return s;
        
        // Mojibake düzeltme haritası (UTF-8 -> Latin-1 -> UTF-8 bozulması)
        const mojibakeMap = {
          'Ã§': 'ç', 'Ã‡': 'Ç',
          'ÄŸ': 'ğ', 'Ä±': 'ı', 'Ä°': 'İ',
          'Ã¶': 'ö', 'Ã–': 'Ö',

    // Check if invoice already exists in the repository
    async function checkInvoiceExists(orderId) {
      if (!orderId) return false;
      const url = `https://api.github.com/repos/amtbrs-03/AMTBRS/contents/invoices/INV-${orderId}.json?ref=site-release&t=${Date.now()}`;
      try {
        const res = await fetch(url, { headers: { 'Accept': 'application/vnd.github.v3+json' } });
        if (res.status === 200) return true;
        if (res.status === 404) return false;
        // For unexpected statuses, try download_url path as secondary verification
        if (res.ok) return true;
        return false;
      } catch (e) {
        console.warn('GitHub kontrolünde hata:', e);
        return false;
      }
    }
    
    // Token management functions (same as admin.html)
    function decodeToken(encoded, key) {
      let result = '';
      for (let i = 0; i < encoded.length; i++) {
        result += String.fromCharCode(encoded.charCodeAt(i) ^ key.charCodeAt(i % key.length));
      }
      return result;
    }

    function getGitHubToken() {
      let token = localStorage.getItem('github_token');
      if (!token) {
        const encoded = '":>r3\x0e,\' bj@\x06\x07\t5\'K"\x0b4\x08\tYUJ[f\x11\x0b\rK0\x0cs\x0f\x1dupY';
        const key = 'ERN-CICEK-2025';
        try {
          token = decodeToken(encoded, key);
        } catch(e) {
          console.error('Failed to decode GitHub token');
        }
      }
      return token;
    }

    async function saveInvoiceToGitHub(orderId, invoiceHTML) {
      try {
        // First, update order status to "ready" immediately
        console.log('Updating order status to ready before saving invoice...');
        const statusUpdateResult = await updateOrderStatus(orderId, 'ready');
        console.log('Status update result:', statusUpdateResult);
        
        if (!statusUpdateResult) {
          await appAlert('⚠️ Sipariş durumu güncellenemedi. Lütfen console\'u kontrol edin.');
          return false;
        }
        
        const invoiceData = {
          orderId: orderId,
          createdAt: Date.now(),
          createdDate: new Date().toISOString(),
          html: invoiceHTML
        };
        
        console.log('Saving invoice to GitHub...');
        
        const token = getGitHubToken();
        if (!token) {
          console.error('No GitHub token available');
          await appAlert('⚠️ Yetki bulunamadı. Admin panelinden yetkilendirme ayarını yapın.');
          return false;
        }
        
        // Save invoice directly using GitHub API (not dispatch)
        const invoiceFileName = `INV-${orderId}.json`;
        const invoiceContent = JSON.stringify(invoiceData, null, 2);
        
        // Create invoice file (do not overwrite if exists)
        // First, check existence explicitly to avoid accidental overwrite
        const alreadyExists = await checkInvoiceExists(orderId);
        if (alreadyExists) {
          await appAlert('⚠️ Bilgi Fişi Zaten Mevcut\n\nBu bilgi fişi daha önce oluşturulmuş.');
          const btn = document.getElementById('createInvoiceBtn');
          if (btn) {
            btn.disabled = true;
            btn.textContent = '🧾 Bilgi Fişi Zaten Oluşturulmuş';
          }
          return true;
        }

        const response = await fetch(`https://api.github.com/repos/amtbrs-03/AMTBRS/contents/invoices/${invoiceFileName}`, {
          method: 'PUT',
          headers: {
            'Accept': 'application/vnd.github.v3+json',
            'Authorization': `token ${token}`,
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            message: `Bilgi Fişi oluşturuldu: ${invoiceFileName}`,
            content: btoa(unescape(encodeURIComponent(invoiceContent))),
            branch: 'site-release'
          })
        });
        
        if (response.ok) {
          console.log('✅ Invoice saved to GitHub successfully');
          // UI'ı güncelle - bilgi fişi butonu devre dışı bırak
          const btn = document.getElementById('createInvoiceBtn');
          if (btn) {
            btn.disabled = true;
            btn.textContent = '🧾 Bilgi Fişi Oluşturuldu';
            btn.style.background = '#9ca3af';
          }
          // Durumu "Hazır" olarak güncelle (zaten updateOrderStatus ile yapıldı ama emin olmak için UI'ı tekrar render et)
          currentOrder.status = 'ready';
          renderOrderDetail(currentOrder);
          await appAlert(`✅ Bilgi Fişi Kaydedildi\n\n📦 Sipariş: ${currentOrder.id}\n👤 Müşteri: ${currentOrder.customerName || currentOrder.customer || currentOrder.name || '-'}\n💰 Tutar: ${currentOrder.total || '-'} TL\n\nBilgi Fişi başarıyla sisteme kaydedildi.\nSipariş durumu "Hazır" olarak güncellendi.`);
          return true;
        } else {
          const errorText = await response.text();
          console.error('❌ Invoice save failed:', response.status, errorText);
          await appAlert(`⚠️ Bilgi Fişi Kayıt Uyarısı\n\n📦 Sipariş: ${currentOrder.id}\n\nBilgi fişi kaydedilemedi ancak sipariş durumu güncellendi.\nDetaylar için console'u kontrol edin.`);
          return false;
        }
      } catch(err) {
        console.error('Failed to save invoice to GitHub:', err);
        return false;
      }
    }

    // Fetch latest customer address from users/<email>_full.json (raw-first) and update order file
    async function refreshCustomerAddress() {
      if (!currentOrder) { await appAlert('⚠️ Uyarı\n\nSipariş yüklenmedi!'); return; }
      const email = currentOrder.customerEmail || currentOrder.payerEmail;
      if (!email) { await appAlert('❌ Hata\n\nMüşteri e-postası bulunamadı.'); return; }
      try {
        // Pull user profile file
        const userPath = `users/${encodeURIComponent(email)}_full.json`;
        const rawUrl = `https://raw.githubusercontent.com/amtbrs-03/AMTBRS/site-release/${userPath}`;
        let userData = null;
        // Try raw first (avoids rate limits, no token needed)
        try {
          const rawRes = await fetch(rawUrl + `?t=${Date.now()}`, { cache: 'no-store' });
          if (rawRes.ok) {
            userData = await rawRes.json();
          }
        } catch (e) {
          // continue to fallback
        }
        if (!userData) {
          const apiUrl = `https://api.github.com/repos/amtbrs-03/AMTBRS/contents/${userPath}?ref=site-release&t=${Date.now()}`;
          const apiRes = await fetch(apiUrl, { headers: { 'Accept': 'application/vnd.github.v3+json' }, cache: 'no-store' });
          if (!apiRes.ok) {
            const txt = await apiRes.text();
            console.error('User fetch failed:', apiRes.status, txt);
            await appAlert('❌ Müşteri profili alınamadı.');
            return;
          }
          const userFile = await apiRes.json();
          try {
            userData = JSON.parse(atob(userFile.content));
          } catch (_) {
            const dl = await fetch(userFile.download_url + `?t=${Date.now()}`, { cache: 'no-store' });
            userData = await dl.json();
          }
        }
        // Determine latest address
        const addresses = Array.isArray(userData.addresses) ? userData.addresses : [];
        const preferred = addresses.find(a => a.default) || addresses[0];
        const latestAddress = preferred ? (preferred.fullAddress || [preferred.city, preferred.district, preferred.neighborhood, preferred.streetAddress, preferred.postalCode].filter(Boolean).join(' ')) : (userData.address || '');
        if (!latestAddress) {
          await appAlert('⚠️ Uyarı\n\nMüşteri profilinde adres bulunamadı.');
          return;
        }
        // If address missing or changed, update order file and remote user profile
        const needsUpdate = !currentOrder.address || String(currentOrder.address).trim() !== String(latestAddress).trim();
        if (!needsUpdate) {
          await appAlert('✅ Bilgi\n\nAdres zaten güncel.');
          return;
        }
        // First update remote user profile via /update-user if endpoint is configured
        try {
          const settingsRes = await fetch('site-settings.json', { cache: 'no-store' });
          if (settingsRes.ok) {
            const settings = await settingsRes.json();
            const orderEndpoint = settings.orderEndpoint || '';
            if (orderEndpoint) {
              const updateEndpoint = orderEndpoint.replace(/\/send-order$/, '/update-user');
              const profileBody = { email, address: latestAddress };
              await fetch(updateEndpoint, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(profileBody)
              }).catch(()=>{});
            }
          }
        } catch (e) {
          console.warn('Uzak profil güncelleme başarısız (devam ediliyor):', e);
        }

        // Update order file with this address
        const token = getGitHubToken();
        if (!token) { await appAlert('⚠️ Yetki bulunamadı.'); return; }
        const getRes = await fetch(`https://api.github.com/repos/amtbrs-03/AMTBRS/contents/orders/${currentOrder.id}.json?ref=site-release&t=${Date.now()}`,{
          headers:{ 'Accept':'application/vnd.github.v3+json','Authorization':`token ${token}` }
        });
        if (!getRes.ok) { await appAlert('❌ Sipariş dosyası alınamadı.'); return; }
        const fileData = await getRes.json();
        const orderObj = JSON.parse(atob(fileData.content));
        orderObj.address = latestAddress;
        const putRes = await fetch(`https://api.github.com/repos/amtbrs-03/AMTBRS/contents/orders/${currentOrder.id}.json`,{
          method:'PUT',
          headers:{ 'Accept':'application/vnd.github.v3+json','Authorization':`token ${token}`,'Content-Type':'application/json' },
          body: JSON.stringify({
            message: `Sipariş adresi müşteri profilinden güncellendi: ${currentOrder.id}`,
            content: btoa(unescape(encodeURIComponent(JSON.stringify(orderObj, null, 2)))) ,
            sha: fileData.sha,
            branch:'site-release'
          })
        });
        if (putRes.ok) {
          await appAlert('✅ Başarılı\n\nAdres müşteri profilinden çekildi ve güncellendi.');
          // Update UI immediately without full reload
          currentOrder.address = latestAddress;
          renderOrderDetail(currentOrder);
        } else {
          const txt = await putRes.text();
          console.error('Refresh address failed:', putRes.status, txt);
          await appAlert('❌ Hata\n\nAdres güncelleme başarısız.');
        }
      } catch (e) {
        console.error('Refresh address error:', e);
        await appAlert('❌ Hata\n\nAdres çekme sırasında hata oluştu.');
      }
    }

            }
          } else {
            const statusNames = { pending: 'Beklemede', processing: 'İşleniyor', ready: 'Hazır', shipped: 'Gönderildi', paid: 'Ödendi' };
            await appAlert(`✅ Durum Güncellendi\n\n📦 Sipariş: ${currentOrder.id}\n👤 Müşteri: ${currentOrder.customerName || currentOrder.customer || currentOrder.name || '-'}\n📊 Yeni Durum: ${statusNames[newStatus] || newStatus}\n\nSipariş durumu başarıyla güncellendi.`);

    // Helper to (re)wire address editor events after render
    function wireAddressEditor() {
      const startBtn = document.getElementById('startEditAddressBtn');
      const refreshInlineBtn = document.getElementById('refreshAddressBtnInline');
      const editor = document.getElementById('addressEditor');
      const ta = document.getElementById('addressEditTextarea');
      const saveBtn = document.getElementById('saveAddressBtn');
      const cancelBtn = document.getElementById('cancelAddressBtn');
      const textEl = document.getElementById('orderAddressText');
      if (!startBtn || !editor || !ta || !saveBtn || !cancelBtn || !textEl) return;

      startBtn.onclick = () => {
        ta.value = (currentOrder && currentOrder.address) ? String(currentOrder.address) : '';
        editor.style.display = 'block';
        ta.focus();
      };
      cancelBtn.onclick = () => {
        editor.style.display = 'none';
      };
      
      // Müşteri adresini çek butonu
      if (refreshInlineBtn) {
        refreshInlineBtn.onclick = () => refreshCustomerAddress();
      }

      saveBtn.onclick = async () => {
        const newAddr = (ta.value || '').trim();
        if (!newAddr) { await appAlert('⚠️ Uyarı\n\nAdres boş olamaz.'); return; }
        try {
          // 1) Update user profile via Worker update-user (if configured)
          const email = (currentOrder && (currentOrder.customerEmail || currentOrder.payerEmail)) || '';
          let workerUpdated = false;
          try {
            const settingsRes = await fetch('site-settings.json', { cache: 'no-store' });
            if (settingsRes.ok) {
              const settings = await settingsRes.json();
              const orderEndpoint = settings.orderEndpoint || '';
              if (orderEndpoint) {
                const updateEndpoint = orderEndpoint.replace(/\/send-order$/, '/update-user');
                const resp = await fetch(updateEndpoint, {
                  method: 'POST', headers: { 'Content-Type': 'application/json' },
                  body: JSON.stringify({ email, address: newAddr })
                });
                workerUpdated = resp.ok;
              }
            }
          } catch (_) {}

          // 2) Fallback: update users/<email>_full.json directly via GitHub API
          if (!workerUpdated && email) {
            const token = getGitHubToken();
            if (!token) { await appAlert('⚠️ Uyarı\n\nYetki yok, profil dosyasını güncelleyemedik.'); }
            else {
              const userPath = `users/${encodeURIComponent(email)}_full.json`;
              const getRes = await fetch(`https://api.github.com/repos/amtbrs-03/AMTBRS/contents/${userPath}?ref=site-release&t=${Date.now()}`,{
                headers:{ 'Accept':'application/vnd.github.v3+json','Authorization':`token ${token}` }
              });
              if (getRes.ok) {
                const fileData = await getRes.json();
                let profile;
                try { profile = JSON.parse(atob(fileData.content)); }
                catch { const dl = await fetch(fileData.download_url + `?t=${Date.now()}`); profile = await dl.json(); }

                // Update a simple address field and keep addresses array coherent
                profile.address = newAddr;
                if (Array.isArray(profile.addresses)) {
                  const def = profile.addresses.find(a => a.default) || profile.addresses[0];
                  if (def) def.fullAddress = newAddr;
                }
                const putRes = await fetch(`https://api.github.com/repos/amtbrs-03/AMTBRS/contents/${userPath}`,{
                  method:'PUT', headers:{ 'Accept':'application/vnd.github.v3+json','Authorization':`token ${token}`,'Content-Type':'application/json' },
                  body: JSON.stringify({
                    message: `Müşteri adresi güncellendi: ${email}`,
                    content: btoa(unescape(encodeURIComponent(JSON.stringify(profile, null, 2)))) ,
                    sha: fileData.sha,
                    branch:'site-release'
                  })
                });
                if (!putRes.ok) {
                  const txt = await putRes.text();
                  console.error('Profil güncelleme hatası:', putRes.status, txt);
                }
              }
            }
          }

          // 3) Update current order address and commit
          const token2 = getGitHubToken();
          if (!token2) { await appAlert('⚠️ Yetki bulunamadı. Sipariş dosyası güncellenemedi.'); return; }
          const getOrderRes = await fetch(`https://api.github.com/repos/amtbrs-03/AMTBRS/contents/orders/${currentOrder.id}.json?ref=site-release&t=${Date.now()}`,{
            headers:{ 'Accept':'application/vnd.github.v3+json','Authorization':`token ${token2}` }
          });
          if (!getOrderRes.ok) { await appAlert('❌ Sipariş dosyası alınamadı.'); return; }
          const orderFile = await getOrderRes.json();
          const orderObj = JSON.parse(atob(orderFile.content));
          orderObj.address = newAddr;
          const putOrderRes = await fetch(`https://api.github.com/repos/amtbrs-03/AMTBRS/contents/orders/${currentOrder.id}.json`,{
            method:'PUT', headers:{ 'Accept':'application/vnd.github.v3+json','Authorization':`token ${token2}`,'Content-Type':'application/json' },
            body: JSON.stringify({
              message: `Sipariş adresi admin tarafından güncellendi: ${currentOrder.id}`,
              content: btoa(unescape(encodeURIComponent(JSON.stringify(orderObj, null, 2)))) ,
              sha: orderFile.sha,
              branch:'site-release'
            })
          });
          if (putOrderRes.ok) {
            currentOrder.address = newAddr;
            textEl.textContent = newAddr;
            editor.style.display = 'none';
            await appAlert('✅ Başarılı\n\nAdres kaydedildi ve sipariş güncellendi.');
          } else {
            const txt = await putOrderRes.text();
            console.error('Sipariş güncelleme hatası:', putOrderRes.status, txt);
            await appAlert('❌ Hata\n\nSipariş güncelleme başarısız.');
          }
        } catch (e) {
          console.error('Adres kaydetme hatası:', e);
          await appAlert('❌ Hata\n\nAdres kaydedilirken bir hata oluştu.');
        }
      };
    }

      // Zaten okunmuşsa tekrar kaydetme

        } catch {

        }
        
        // noteRead güncelle
        orderData.noteRead = true;
        
        // GitHub'a kaydet
        await fetch(`https://api.github.com/repos/amtbrs-03/AMTBRS/contents/${orderPath}`, {
          method: 'PUT',
          headers: { 'Accept': 'application/vnd.github.v3+json', 'Authorization': `token ${token}`, 'Content-Type': 'application/json' },

        if (btn) {
          btn.classList.remove('has-unread-note');
          btn.classList.add('has-read-note');
          btn.innerHTML = '💬 Müşteri Notu';
        }
        
      } catch (e) {
        console.warn('noteRead güncellenirken hata:', e);
      }
    }

    // Re-wire after each render
    const _origRender = renderOrderDetail;
    renderOrderDetail = function(order){ _origRender(order); try{ wireAddressEditor(); }catch(_){} };
  </script>
</body>
</html>
