<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Sipariş Detayı - ERN-ÇİÇEK Admin</title>
  <style>
    :root{
      --green-primary: #10b981;
      --green-dark: #059669;
      --green-light: #34d399;
      --danger:#ef4444;
      --muted:#6b7280;
      --bg-1: rgba(34,197,94,0.10);
      --bg-2: rgba(16,185,129,0.08);
      --card-bg: rgba(255,255,255,0.98);
    }

    body{
      font-family: 'Segoe UI', 'Inter', 'Noto Sans', Tahoma, Arial, sans-serif;
      padding:0;
      margin:0;
      color:#0f172a;
      background: radial-gradient(1200px 600px at 10% 10%, var(--bg-1), transparent),
                  radial-gradient(800px 400px at 90% 90%, var(--bg-2), transparent),
                  linear-gradient(180deg, #ecfdf5 0%, #064e3b 100%);
      -webkit-font-smoothing:antialiased;
      -moz-osx-font-smoothing:grayscale;
      min-height:100vh;
    }

    .container{
      max-width:1000px;
      margin:0 auto;
      padding:2rem;
    }

    /* Header */
    .page-header{
      background: linear-gradient(135deg, var(--green-primary) 0%, var(--green-dark) 100%);
      box-shadow: 0 10px 40px rgba(16, 185, 129, 0.3);
      padding:2rem;
      margin-bottom:2rem;
      border-radius:20px;
      display:flex;
      justify-content:space-between;
      align-items:center;
      flex-wrap:wrap;
      gap:1rem;
    }

    .page-header h1{
      margin:0;
      color:white;
      font-size:1.75rem;
      font-weight:800;
      text-shadow: 0 2px 10px rgba(0,0,0,0.2);
    }

    .header-actions{
      display:flex;
      gap:1rem;
      align-items:center;
    }

    /* Buttons */
    .btn{
      cursor:pointer;
      padding:0.75rem 1.5rem;
      border-radius:12px;
      border:none;
      background: linear-gradient(135deg, var(--green-primary) 0%, var(--green-dark) 100%);
      color:white;
      font-weight:700;
      font-size:0.95rem;
      box-shadow: 0 4px 15px rgba(16, 185, 129, 0.4),
                  0 8px 25px rgba(16, 185, 129, 0.2),
                  inset 0 -2px 5px rgba(0,0,0,0.1);
      transform: translateY(0);
      transition: all 0.2s ease;
      text-decoration:none;
      display:inline-block;
    }
    .btn:hover{
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(16, 185, 129, 0.5);
    }
    .btn:active{
      transform: translateY(1px);
    }

    .btn-white{
      background: white;
      color: var(--green-dark);
      border: 2px solid var(--green-primary);
      box-shadow: 0 4px 15px rgba(255, 255, 255, 0.3);
    }

    .btn-orange{
      background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
      box-shadow: 0 4px 15px rgba(245, 158, 11, 0.4);
    }

    /* Detail Card */
    .detail-card{
      background: var(--card-bg);
      padding:2rem;
      border-radius:20px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.1);
      margin-bottom:2rem;
    }

    .detail-header{
      display:flex;
      justify-content:space-between;
      align-items:center;
      margin-bottom:2rem;
      padding-bottom:1rem;
      border-bottom:2px solid #e5e7eb;
    }

    .detail-header h2{
      margin:0;
      font-size:1.5rem;
      color:#064e3b;
      font-weight:700;
    }

    .status-badge{
      display:inline-block;
      padding:0.5rem 1rem;
      border-radius:12px;
      font-size:0.95rem;
      font-weight:600;
      color:white;
    }

    .status-pending{ background:#f59e0b; }
    .status-paid{ background:#10b981; }
    .status-processing{ background:#3b82f6; }
    .status-shipped{ background:#8b5cf6; }

    /* Info Grid */
    .info-grid{
      display:grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap:1.5rem;
      margin-bottom:2rem;
    }

    .info-item{
      padding:1rem;
      background:#f9fafb;
      border-radius:12px;
      border-left:4px solid var(--green-primary);
    }

    .info-label{
      font-size:0.85rem;
      color:var(--muted);
      font-weight:600;
      text-transform:uppercase;
      letter-spacing:0.5px;
      margin-bottom:0.5rem;
    }

    .info-value{
      font-size:1.1rem;
      color:#0f172a;
      font-weight:600;
    }

    /* Items Table */
    .items-section{
      margin-bottom:2rem;
    }

    .items-section h3{
      font-size:1.25rem;
      color:#064e3b;
      margin-bottom:1rem;
      font-weight:700;
    }

    .items-table{
      width:100%;
      border-collapse:collapse;
      background:white;
      border-radius:12px;
      overflow:hidden;
      box-shadow:0 2px 8px rgba(0,0,0,0.05);
    }

    .items-table thead{
      background: linear-gradient(135deg, var(--green-primary), var(--green-dark));
      color:white;
    }

    .items-table th{
      padding:1rem;
      text-align:left;
      font-weight:600;
    }

    .items-table td{
      padding:1rem;
      border-bottom:1px solid #e5e7eb;
    }

    .items-table tbody tr:last-child td{
      border-bottom:none;
    }

    .items-table tbody tr:nth-child(even){
      background:#f9fafb;
    }

    .total-row{
      background:#f0fdf4 !important;
      font-weight:700;
      font-size:1.1rem;
      color:var(--green-dark);
    }

    .loading{
      text-align:center;
      padding:3rem;
      color:var(--muted);
      font-size:1.1rem;
    }

    .error{
      background:#fee;
      color:#c33;
      padding:1.5rem;
      border-radius:12px;
      border-left:4px solid #c33;
    }

    /* Print Styles */
    @media print{
      body{
        background:white;
      }
      .page-header, .header-actions, .btn{
        display:none !important;
      }
      .detail-card{
        box-shadow:none;
        page-break-inside:avoid;
      }
    }

    @media(max-width:768px){
      .info-grid{
        grid-template-columns:1fr;
      }
      .items-table{
        font-size:0.85rem;
      }
      .items-table th, .items-table td{
        padding:0.5rem;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="page-header">
      <h1>📦 Sipariş Detayı</h1>
      <div class="header-actions">
        <button id="createInvoiceBtn" class="btn btn-orange">🧾 Fatura Oluştur</button>
        <a href="siparisler.html" class="btn btn-white">← Sipariş Listesine Dön</a>
      </div>
    </div>

    <div id="orderContent">
      <div class="loading">⏳ Sipariş detayları yükleniyor...</div>
    </div>
  </div>

  <script>
    function escapeHtml(s){ 
      if (typeof s !== 'string') {
        s = String(s || '');
      }
      return s.replace(/[&<>\"']/g, function(m){
        return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]
      }) 
    }

    let currentOrder = null;

    async function loadOrderDetail() {
      const contentEl = document.getElementById('orderContent');
      
      // Get order ID from URL parameter
      const urlParams = new URLSearchParams(window.location.search);
      const orderId = urlParams.get('id');
      
      if (!orderId) {
        contentEl.innerHTML = '<div class="error">❌ Hata: Sipariş numarası bulunamadı.</div>';
        return;
      }

      try {
        // Fetch order from GitHub
        const owner = 'amtbrs-03';
        const repo = 'AMTBRS';
        const branch = 'site-release';
        const fileName = `${orderId}.json`;
        const apiUrl = `https://api.github.com/repos/${owner}/${repo}/contents/orders/${fileName}?ref=${branch}`;
        
        console.log('Fetching order:', apiUrl);
        
        const res = await fetch(apiUrl, {
          headers: { 'Accept': 'application/vnd.github.v3+json' }
        });
        
        if (!res.ok) {
          if (res.status === 404) {
            throw new Error('Sipariş bulunamadı. Sipariş numarası geçersiz olabilir.');
          }
          throw new Error(`GitHub API responded with ${res.status}: ${res.statusText}`);
        }
        
        const fileData = await res.json();
        const orderRes = await fetch(fileData.download_url);
        
        if (!orderRes.ok) {
          throw new Error('Sipariş verileri yüklenemedi.');
        }
        
        currentOrder = await orderRes.json();
        console.log('Order loaded:', currentOrder);
        
        renderOrderDetail(currentOrder);
        
      } catch(err) {
        console.error('Failed to load order:', err);
        contentEl.innerHTML = `<div class="error">❌ Hata: ${escapeHtml(err.message)}</div>`;
      }
    }

    function renderOrderDetail(order) {
      const statusMap = {
        'pending': { text: 'Beklemede', class: 'status-pending' },
        'paid': { text: 'Ödendi', class: 'status-paid' },
        'processing': { text: 'İşleniyor', class: 'status-processing' },
        'shipped': { text: 'Gönderildi', class: 'status-shipped' }
      };
      
      const statusInfo = statusMap[order.status] || statusMap['pending'];
      const statusBadge = `<span class="status-badge ${statusInfo.class}">${statusInfo.text}</span>`;
      
      const orderDate = order.date 
        ? new Date(order.date).toLocaleDateString('tr-TR', {
            day:'2-digit', 
            month:'2-digit', 
            year:'numeric', 
            hour:'2-digit', 
            minute:'2-digit'
          }) 
        : '-';
      
      let html = '<div class="detail-card">';
      html += '<div class="detail-header">';
      html += `<h2>Sipariş #${escapeHtml(order.id || '-')}</h2>`;
      html += statusBadge;
      html += '</div>';
      
      // Customer Info Grid
      html += '<div class="info-grid">';
      html += '<div class="info-item">';
      html += '<div class="info-label">👤 Müşteri Adı</div>';
      html += `<div class="info-value">${escapeHtml(order.customerName || '-')}</div>`;
      html += '</div>';
      
      html += '<div class="info-item">';
      html += '<div class="info-label">📧 Email</div>';
      html += `<div class="info-value">${escapeHtml(order.customerEmail || '-')}</div>`;
      html += '</div>';
      
      html += '<div class="info-item">';
      html += '<div class="info-label">📅 Sipariş Tarihi</div>';
      html += `<div class="info-value">${orderDate}</div>`;
      html += '</div>';
      
      html += '<div class="info-item">';
      html += '<div class="info-label">💰 Toplam Tutar</div>';
      html += `<div class="info-value">₺${escapeHtml(order.total || '0')}</div>`;
      html += '</div>';
      html += '</div>';
      
      // Address
      if (order.address) {
        html += '<div class="info-item" style="margin-bottom:2rem;">';
        html += '<div class="info-label">📍 Teslimat Adresi</div>';
        html += `<div class="info-value">${escapeHtml(order.address)}</div>`;
        html += '</div>';
      }
      
      // Items Section
      html += '<div class="items-section">';
      html += '<h3>🛒 Sipariş Ürünleri</h3>';
      html += '<table class="items-table">';
      html += '<thead><tr>';
      html += '<th>Ürün Adı</th>';
      html += '<th style="text-align:center;">Adet</th>';
      html += '<th style="text-align:right;">Birim Fiyat</th>';
      html += '<th style="text-align:right;">Toplam</th>';
      html += '</tr></thead><tbody>';
      
      if (order.items && order.items.length > 0) {
        order.items.forEach(item => {
          const itemTotal = (item.price || 0) * (item.qty || 0);
          html += '<tr>';
          html += `<td>${escapeHtml(item.name || '-')}</td>`;
          html += `<td style="text-align:center;">${item.qty || 0}</td>`;
          html += `<td style="text-align:right;">₺${(item.price || 0).toFixed(2)}</td>`;
          html += `<td style="text-align:right;">₺${itemTotal.toFixed(2)}</td>`;
          html += '</tr>';
        });
      } else {
        html += '<tr><td colspan="4" style="text-align:center;color:var(--muted);">Ürün bulunamadı</td></tr>';
      }
      
      html += '<tr class="total-row">';
      html += '<td colspan="3" style="text-align:right;padding-right:2rem;">GENEL TOPLAM</td>';
      html += `<td style="text-align:right;">₺${order.total || '0'}</td>`;
      html += '</tr>';
      
      html += '</tbody></table>';
      html += '</div>';
      
      // Additional Info
      if (order.iban) {
        html += '<div class="info-item">';
        html += '<div class="info-label">🏦 IBAN</div>';
        html += `<div class="info-value" style="font-family:monospace;">${escapeHtml(order.iban)}</div>`;
        html += '</div>';
      }
      
      html += '</div>';
      
      document.getElementById('orderContent').innerHTML = html;
    }

    function createInvoice() {
      if (!currentOrder) {
        alert('Sipariş yüklenmedi!');
        return;
      }
      
      // Create invoice HTML
      const statusMap = {
        'pending': 'Beklemede',
        'paid': 'Ödendi',
        'processing': 'İşleniyor',
        'shipped': 'Gönderildi'
      };
      
      const orderDate = currentOrder.date 
        ? new Date(currentOrder.date).toLocaleDateString('tr-TR', {
            day:'2-digit', 
            month:'2-digit', 
            year:'numeric'
          }) 
        : '-';
      
      let invoiceHTML = `<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fatura - ${currentOrder.id}</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 800px; margin: 40px auto; padding: 20px; }
    .invoice-header { text-align: center; margin-bottom: 40px; border-bottom: 3px solid #10b981; padding-bottom: 20px; }
    .invoice-header h1 { color: #10b981; margin: 0; font-size: 2rem; }
    .invoice-header p { margin: 5px 0; color: #6b7280; }
    .company-info { background: #f0fdf4; padding: 20px; border-radius: 8px; margin-bottom: 30px; }
    .info-section { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 30px; }
    .info-box { background: #f9fafb; padding: 15px; border-radius: 8px; }
    .info-box h3 { margin: 0 0 10px 0; color: #064e3b; font-size: 1rem; }
    .info-box p { margin: 5px 0; color: #0f172a; }
    .info-label { color: #6b7280; font-size: 0.85rem; font-weight: 600; }
    table { width: 100%; border-collapse: collapse; margin: 30px 0; }
    thead { background: #10b981; color: white; }
    th, td { padding: 12px; text-align: left; border-bottom: 1px solid #e5e7eb; }
    th { font-weight: 600; }
    tbody tr:nth-child(even) { background: #f9fafb; }
    .total-row { background: #f0fdf4 !important; font-weight: bold; font-size: 1.1rem; }
    .text-right { text-align: right; }
    .text-center { text-align: center; }
    .footer { margin-top: 50px; padding-top: 20px; border-top: 2px solid #e5e7eb; text-align: center; color: #6b7280; font-size: 0.9rem; }
    @media print {
      body { margin: 0; }
      .no-print { display: none; }
    }
  </style>
</head>
<body>
  <div class="invoice-header">
    <h1>🌸 ERN-ÇİÇEK</h1>
    <p>www.ern-cicek.com.tr</p>
    <p>Fatura Tarihi: ${new Date().toLocaleDateString('tr-TR')}</p>
  </div>

  <div class="company-info">
    <h3 style="margin:0 0 10px 0;color:#064e3b;">Şirket Bilgileri</h3>
    <p><strong>ERN-ÇİÇEK</strong></p>
    <p>Adres: [Şirket Adresi]</p>
    <p>Telefon: [Telefon]</p>
    <p>Email: info@ern-cicek.com.tr</p>
  </div>

  <div class="info-section">
    <div class="info-box">
      <h3>📦 Sipariş Bilgileri</h3>
      <p><span class="info-label">Sipariş No:</span> <strong>${escapeHtml(currentOrder.id)}</strong></p>
      <p><span class="info-label">Sipariş Tarihi:</span> ${orderDate}</p>
      <p><span class="info-label">Durum:</span> ${statusMap[currentOrder.status] || 'Beklemede'}</p>
    </div>
    
    <div class="info-box">
      <h3>👤 Müşteri Bilgileri</h3>
      <p><strong>${escapeHtml(currentOrder.customerName || '-')}</strong></p>
      <p>${escapeHtml(currentOrder.customerEmail || '-')}</p>
      ${currentOrder.address ? `<p>${escapeHtml(currentOrder.address)}</p>` : ''}
    </div>
  </div>

  <h3 style="color:#064e3b;margin-bottom:10px;">🛒 Ürün Listesi</h3>
  <table>
    <thead>
      <tr>
        <th>Ürün Adı</th>
        <th class="text-center">Adet</th>
        <th class="text-right">Birim Fiyat</th>
        <th class="text-right">Toplam</th>
      </tr>
    </thead>
    <tbody>`;
      
      if (currentOrder.items && currentOrder.items.length > 0) {
        currentOrder.items.forEach(item => {
          const itemTotal = (item.price || 0) * (item.qty || 0);
          invoiceHTML += `
      <tr>
        <td>${escapeHtml(item.name || '-')}</td>
        <td class="text-center">${item.qty || 0}</td>
        <td class="text-right">₺${(item.price || 0).toFixed(2)}</td>
        <td class="text-right">₺${itemTotal.toFixed(2)}</td>
      </tr>`;
        });
      }
      
      invoiceHTML += `
      <tr class="total-row">
        <td colspan="3" class="text-right" style="padding-right:20px;">GENEL TOPLAM</td>
        <td class="text-right">₺${currentOrder.total || '0.00'}</td>
      </tr>
    </tbody>
  </table>

  ${currentOrder.iban ? `
  <div class="info-box">
    <h3>🏦 Ödeme Bilgileri</h3>
    <p><span class="info-label">IBAN:</span> <strong style="font-family:monospace;">${escapeHtml(currentOrder.iban)}</strong></p>
  </div>` : ''}

  <div class="footer">
    <p>Bu fatura elektronik olarak oluşturulmuştur.</p>
    <p>ERN-ÇİÇEK - Güvenle Alışverişin Adresi</p>
  </div>

  <div class="no-print" style="text-align:center;margin-top:30px;">
    <button onclick="window.print()" style="padding:12px 24px;background:#10b981;color:white;border:none;border-radius:8px;font-size:1rem;cursor:pointer;font-weight:600;">🖨️ Yazdır / PDF Olarak Kaydet</button>
  </div>
</body>
</html>`;
      
      // Open in new window
      const invoiceWindow = window.open('', '_blank');
      invoiceWindow.document.write(invoiceHTML);
      invoiceWindow.document.close();
      
      // Save invoice to GitHub
      saveInvoiceToGitHub(currentOrder.id, invoiceHTML);
    }
    
    async function saveInvoiceToGitHub(orderId, invoiceHTML) {
      try {
        const invoiceData = {
          orderId: orderId,
          createdAt: Date.now(),
          createdDate: new Date().toISOString(),
          html: invoiceHTML
        };
        
        console.log('Saving invoice to GitHub...');
        
        // XOR encoding for token (same as order save)
        function xorEncode(str, key) {
          let result = '';
          for (let i = 0; i < str.length; i++) {
            result += String.fromCharCode(str.charCodeAt(i) ^ key.charCodeAt(i % key.length));
          }
          return btoa(result);
        }
        
        function xorDecode(encoded, key) {
          const decoded = atob(encoded);
          let result = '';
          for (let i = 0; i < decoded.length; i++) {
            result += String.fromCharCode(decoded.charCodeAt(i) ^ key.charCodeAt(i % key.length));
          }
          return result;
        }
        
        // Encoded token (replace with your actual token)
        const encodedToken = 'HgsdCwEUXVkADRFYEQ=='; // This is a placeholder
        const secretKey = 'ERN-CICEK-2025';
        const token = xorDecode(encodedToken, secretKey);
        
        // GitHub dispatch event to save invoice
        const response = await fetch('https://api.github.com/repos/amtbrs-03/AMTBRS/dispatches', {
          method: 'POST',
          headers: {
            'Accept': 'application/vnd.github.v3+json',
            'Authorization': `token ${token}`,
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            event_type: 'save-invoice',
            client_payload: {
              invoiceId: `INV-${orderId}`,
              data: invoiceData
            }
          })
        });
        
        if (response.ok || response.status === 204) {
          console.log('Invoice saved to GitHub successfully');
        } else {
          console.warn('Invoice save response:', response.status);
        }
      } catch(err) {
        console.error('Failed to save invoice to GitHub:', err);
        // Don't show error to user, just log it
      }
    }

    // Event Listeners
    document.getElementById('createInvoiceBtn').addEventListener('click', createInvoice);

    // Load order on page load
    loadOrderDetail();
  </script>
</body>
</html>
