<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Müşteri Siparişleri - ERN-ÇİÇEK Admin</title>
  <style>
    :root{
      --green-primary: #10b981;
      --green-dark: #059669;
      --green-light: #34d399;
      --danger:#ef4444;
      --muted:#6b7280;
      --bg-1: rgba(34,197,94,0.10);
      --bg-2: rgba(16,185,129,0.08);
      async function loadOrders() {
        const contentEl = document.getElementById('ordersContent');
        contentEl.innerHTML = '<div class="loading">⏳ Siparişler GitHub\'dan çekiliyor...</div>';

        try {
          // Fetch orders from GitHub with cache busting
          const owner = 'amtbrs-03';
          const repo = 'AMTBRS';
          const branch = 'site-release';
          const cacheBuster = Date.now();
          const apiUrl = `https://api.github.com/repos/${owner}/${repo}/contents/orders?ref=${branch}&_cb=${cacheBuster}`;

          console.log('Siparişler şu adresten çekiliyor:', apiUrl);

          const res = await fetch(apiUrl, {
            headers: { 'Accept': 'application/vnd.github.v3+json' }
          });

          console.log('GitHub API yanıtı:', res.status, res.statusText);
          if (!res.ok) {
            const errorText = await res.text().catch(() => '');
            console.error('GitHub API hata detayları:', errorText);
            throw new Error(`GitHub API şu yanıtı verdi: ${res.status} - ${res.statusText}${errorText ? ' — Detay: ' + errorText : ''}`);
          }

          const files = await res.json();
          console.log('orders/ klasöründe dosya sayısı:', files.length);
          const orderFiles = files.filter(f => f.name.endsWith('.json') && f.name !== '.gitkeep');
          console.log('Sipariş dosyaları:', orderFiles.length);

          if (orderFiles.length === 0) {
            contentEl.innerHTML = '<div class="empty">📭 Henüz sipariş yok.</div>';
            updateStats([]);
            return;
          }

          // Fetch each order file
          ordersData = [];
          for (const file of orderFiles) {
            try {
              console.log('Fetching order:', file.name);
              const orderRes = await fetch(file.download_url);
              if (orderRes.ok) {
                const orderData = await orderRes.json();
                console.log('Order loaded:', orderData.id);
                ordersData.push(orderData);
              } else {
                console.error('Failed to fetch order file:', file.name, orderRes.status);
              }
            } catch(e) {
              console.error('Order load error:', file.name, e);
            }
          }

          if (ordersData.length === 0) {
            contentEl.innerHTML = '<div class="empty">❌ Sipariş verileri yüklenemedi.</div>';
            updateStats([]);
            return;
          }

          // Sort newest first and update stats
          ordersData.sort((a,b) => (b.date || 0) - (a.date || 0));
          updateStats(ordersData);

          // Render table
          renderOrdersTable(ordersData);

          // Update last update time
          const now = new Date().toLocaleString('tr-TR', { day:'2-digit', month:'2-digit', year:'numeric', hour:'2-digit', minute:'2-digit' });
          document.getElementById('lastUpdate').textContent = `Son güncelleme: ${now}`;

        } catch(err) {
          console.error('Failed to load orders:', err);
          let errorMsg = err.message;
          if (err.message.includes('Failed to fetch') || err.message.includes('NetworkError')) {
            errorMsg = 'Ağ hatası: GitHub API\'ye erişilemiyor. İnternet bağlantınızı kontrol edin veya birkaç dakika sonra tekrar deneyin. (GitHub API rate limit aşılmış olabilir)';
          }
          contentEl.innerHTML = `<div class="error">❌ Hata: ${escapeHtml(errorMsg)}<br><br><small>Console\'u açıp detayları görebilirsiniz (F12)</small></div>`;
          updateStats([]);
        }
      }
      gap:1.5rem;
      margin-bottom:2rem;
    }

    .stat-card{
      background: var(--card-bg);
      padding:1.5rem;
      border-radius:16px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.1);
      text-align:center;
    }

    .stat-card .number{
      font-size:2.5rem;
      font-weight:800;
      color: var(--green-primary);
      margin:0.5rem 0;
    }

    .stat-card .label{
      font-size:0.9rem;
      color: var(--muted);
      font-weight:600;
    }

    /* Orders Table */
    .orders-container{
      background: var(--card-bg);
      padding:2rem;
      border-radius:20px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.1);
    }

    .orders-header{
      display:flex;
      justify-content:space-between;
      align-items:center;
      margin-bottom:1.5rem;
      padding-bottom:1rem;
      border-bottom:2px solid #e5e7eb;
    }

    .orders-header h2{
      margin:0;
      font-size:1.5rem;
      color:#064e3b;
      font-weight:700;
    }

    #ordersTable{
      width:100%;
      border-collapse:collapse;
      background:white;
      box-shadow:0 2px 8px rgba(0,0,0,0.05);
      border-radius:12px;
      overflow:hidden;
    }

    #ordersTable thead{
      background: linear-gradient(135deg, var(--green-primary), var(--green-dark));
      color:white;
      box-shadow: 0 6px 18px rgba(0,0,0,0.18);
    }

    #ordersTable th{
      position:relative;
      padding:1rem 0.9rem;
      text-align:center;
      font-weight:700;
      font-size:0.95rem;
      line-height:1.25rem;
      height:56px;
      letter-spacing:0.02em;
      border-bottom:2px solid rgba(255,255,255,0.22);
      text-shadow: 0 1px 0 rgba(0,0,0,0.18);
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.28), inset 0 -1px 0 rgba(0,0,0,0.15);
    }

    #ordersTable th::after{
      content:"";
      position:absolute;
      inset:0;
      background: linear-gradient(to bottom, rgba(255,255,255,0.25), rgba(255,255,255,0));
      pointer-events:none;
      border-radius:0;
    }

    #ordersTable td{
      padding:1rem;
      border-bottom:1px solid #e5e7eb;
    }

    #ordersTable tbody tr{
      transition:all 0.2s ease;
    }

    #ordersTable tbody tr:nth-child(even){
      background:#f9fafb;
    }

    #ordersTable tbody tr:hover{
      background:#f0fdf4;
      transform:scale(1.01);
    }
    
    /* Faturası oluşan siparişler için soluk stil */
    #ordersTable tbody tr.has-invoice{
      opacity:0.5;
      background:#f5f5f5;
    }
    
    #ordersTable tbody tr.has-invoice:hover{
      opacity:0.6;
      background:#e8e8e8;
    }

    .status-badge{
      display:inline-block;
      padding:0.35rem 0.85rem;
      border-radius:12px;
      font-size:0.85rem;
      font-weight:600;
      color:white;
    }

    .status-pending{ background:#f59e0b; }
    .status-ready{ background:#10b981; }
    .status-paid{ background:#22c55e; }
    .status-processing{ background:#3b82f6; }
    .status-shipped{ background:#8b5cf6; }

    .loading{
      text-align:center;
      padding:3rem;
      color:var(--muted);
      font-size:1.1rem;
    }

    .error{
      background:#fee;
      color:#c33;
      padding:1rem;
      border-radius:8px;
      border-left:4px solid #c33;
    }

    .empty{
      text-align:center;
      padding:3rem;
      color:var(--muted);
      font-size:1.1rem;
    }

    /* Responsive */
    @media(max-width:768px){
      .page-header h1{ font-size:1.5rem; }
      .stats{ grid-template-columns:1fr; }
      #ordersTable{ font-size:0.85rem; }
      #ordersTable th, #ordersTable td{ padding:0.5rem; }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="page-header">
      <h1>📦 Müşteri Siparişleri</h1>
      <div class="header-actions">
        <button id="refreshBtn" class="btn">🔄 Siparişleri Yenile</button>
        <a href="admin.html" class="btn btn-white">← Admin Panele Dön</a>
      </div>
    </div>

    <div class="stats">
      <div class="stat-card">
        <div class="label">📊 Toplam Sipariş</div>
        <div class="number" id="totalOrders">0</div>
      </div>
      <div class="stat-card">
        <div class="label">⏳ Bekleyen</div>
        <div class="number" id="pendingOrders">0</div>
      </div>
      <div class="stat-card">
        <div class="label">✅ Hazır</div>
        <div class="number" id="readyOrders">0</div>
      </div>
      <div class="stat-card">
        <div class="label">💰 Toplam Tutar</div>
        <div class="number" id="totalAmount">₺0</div>
      </div>
    </div>

    <div class="orders-container">
      <div class="orders-header">
        <h2>Sipariş Listesi</h2>
        <div id="lastUpdate" style="color:var(--muted);font-size:0.9rem;"></div>
      </div>
      <div id="ordersContent">
        <div class="loading">⏳ Siparişler yükleniyor...</div>
      </div>
    </div>
  </div>

  <script>
    // Utility function for HTML escaping
    function escapeHtml(s){ 
      return (s||'').replace(/[&<>\"']/g, function(m){
        return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]
      }) 
    }

    // Normalize text that may contain URI-encoding or HTML entities
    function cleanText(input){
      let s = String(input == null ? '' : input);
      try{ if (/%[0-9A-Fa-f]{2}/.test(s) || s.includes('+')) s = decodeURIComponent(s.replace(/\+/g,' ')); }catch(_){}
      try{ const ta = document.createElement('textarea'); ta.innerHTML = s; s = ta.value; }catch(_){}
      return s.replace(/\s+/g,' ').trim();
    }

    let ordersData = [];

    async function loadOrders() {
      const contentEl = document.getElementById('ordersContent');
      contentEl.innerHTML = '<div class="loading">⏳ Siparişler GitHub\'dan çekiliyor...</div>';

      try {
        // Fetch orders from GitHub with cache busting
        const owner = 'amtbrs-03';
        const repo = 'AMTBRS';
        const branch = 'site-release';
        const cacheBuster = Date.now();
        const apiUrl = `https://api.github.com/repos/${owner}/${repo}/contents/orders?ref=${branch}&_cb=${cacheBuster}`;
        
        console.log('Siparişler şu adresten çekiliyor:', apiUrl);
        
        const res = await fetch(apiUrl, {
          headers: { 
            'Accept': 'application/vnd.github.v3+json'
          }
        });
        
        console.log('GitHub API yanıtı:', res.status, res.statusText);
        
        if (!res.ok) {
          const errorText = await res.text().catch(() => '');
          console.error('GitHub API hata detayları:', errorText);
          throw new Error(`GitHub API şu yanıtı verdi: ${res.status} - ${res.statusText}${errorText ? ' — Detay: ' + errorText : ''}`);
        }
        
        const files = await res.json();
        console.log('orders/ klasöründe dosya sayısı:', files.length);
        
        const orderFiles = files.filter(f => f.name.endsWith('.json') && f.name !== '.gitkeep');
        console.log('Sipariş dosyaları:', orderFiles.length);
        
        if (orderFiles.length === 0) {
          contentEl.innerHTML = '<div class="empty">📭 Henüz sipariş yok.</div>';
          updateStats([]);
          return;
        }
        
        // Fetch each order file
        orders.forEach(order => {
        for (const file of orderFiles) {
          try {
            console.log('Fetching order:', file.name);
            const orderRes = await fetch(file.download_url);
            if (orderRes.ok) {
              const orderData = await orderRes.json();
              console.log('Order loaded:', orderData.id);
              ordersData.push(orderData);
            } else {
              console.error('Failed to fetch order file:', file.name, orderRes.status);
            }
          const itemsText = (order.items || [])
            .map(item => `${cleanText(item.name)} x${item.qty}`)
          }
        }
        
        if (ordersData.length === 0) {
          contentEl.innerHTML = '<div class="empty">❌ Sipariş verileri yüklenemedi.</div>';
          updateStats([]);
          return;
        }
        
        console.log('Total orders loaded:', ordersData.length);
          const cleanAddress = cleanText(order.address);
        
        // Render table
        renderOrdersTable(ordersData);
        
        // Update last update time
        const now = new Date().toLocaleString('tr-TR', {
          day:'2-digit', 
          month:'2-digit', 
          year:'numeric', 
          hour:'2-digit', 
          html += `<td style="font-weight:600;color:var(--green-dark);">${escapeHtml(order.id || '-')}</td>`;
          html += `<td style="font-weight:500;">${escapeHtml(cleanText(order.customerName) || '-')}</td>`;
        document.getElementById('lastUpdate').textContent = `Son güncelleme: ${now}`;
        
      } catch(err) {
        console.error('Failed to load orders:', err);
        let errorMsg = err.message;
        
        // Check if it's a network error
        if (err.message.includes('Failed to fetch') || err.message.includes('NetworkError')) {
          errorMsg = 'Ağ hatası: GitHub API\'ye erişilemiyor. İnternet bağlantınızı kontrol edin veya birkaç dakika sonra tekrar deneyin. (GitHub API rate limit aşılmış olabilir)';
        }
        
        contentEl.innerHTML = `<div class="error">❌ Hata: ${escapeHtml(errorMsg)}<br><br><small>Console\'u açıp detayları görebilirsiniz (F12)</small></div>`;
        updateStats([]);
      }
    }

    function updateStats(orders) {
      const total = orders.length;
      const pending = orders.filter(o => o.status === 'pending').length;
      const ready = orders.filter(o => o.status === 'ready').length;
      const totalAmount = orders.reduce((sum, o) => sum + parseFloat(o.total || 0), 0);
      
      document.getElementById('totalOrders').textContent = total;
      document.getElementById('pendingOrders').textContent = pending;
      document.getElementById('readyOrders').textContent = ready;
      document.getElementById('totalAmount').textContent = '₺' + totalAmount.toFixed(2);
    }

    function renderOrdersTable(orders) {
      const statusMap = {
        'pending': { text: 'Beklemede', class: 'status-pending' },
        'ready': { text: 'Hazır', class: 'status-ready' },
        'paid': { text: 'Ödendi', class: 'status-paid' },
        'processing': { text: 'İşleniyor', class: 'status-processing' },
        'shipped': { text: 'Gönderildi', class: 'status-shipped' }
      };
      
      let html = '<table id="ordersTable">';
      html += '<thead><tr>';
      html += '<th>🆔 Sipariş No</th>';
      html += '<th>👤 Müşteri</th>';
      html += '<th>📧 Email</th>';
      html += '<th>🛒 Ürünler</th>';
      html += '<th>💰 Toplam</th>';
      html += '<th>📅 Tarih</th>';
      html += '<th>📊 Durum</th>';
      html += '<th>📍 Adres</th>';
      html += '</tr></thead><tbody>';
      
      orders.forEach(order => {
        const orderDate = order.date 
          ? new Date(order.date).toLocaleDateString('tr-TR', {
              day:'2-digit', 
              month:'2-digit', 
              year:'numeric', 
              hour:'2-digit', 
              minute:'2-digit'
            }) 
          : '-';
        
        // Format items (clean names for TR chars)
        const itemsText = (order.items || [])
          .map(item => `${cleanText(item.name)} x${item.qty}`)
          .join(', ') || '-';
        const itemsShort = itemsText.length > 50 
          ? itemsText.substring(0, 47) + '...' 
          : itemsText;
        
        // Status badge
        const statusInfo = statusMap[order.status] || statusMap['pending'];
        const statusBadge = `<span class="status-badge ${statusInfo.class}">${statusInfo.text}</span>`;
        
        // Address cleanup: decode URI/enities, then shorten
        const cleanAddress = (function(s){
          s = String(s || '');
          try{ if (/%[0-9A-Fa-f]{2}/.test(s) || s.includes('+')) s = decodeURIComponent(s.replace(/\+/g,' ')); }catch(_){}
          try{ const ta = document.createElement('textarea'); ta.innerHTML = s; s = ta.value; }catch(_){}
          return s.replace(/\s+/g,' ').trim();
        })(order.address);
        const addressText = cleanAddress || '-';
        const addressShort = addressText.length > 50 
          ? addressText.substring(0, 47) + '...' 
          : addressText;
        
        // Check if order has invoice (status is 'ready' means invoice was created)
        const hasInvoice = order.status === 'ready' || order.hasInvoice;
        const rowClass = hasInvoice ? 'has-invoice' : '';
        
        html += '<tr class="' + rowClass + '" style="cursor:pointer;transition:all 0.2s ease;" onclick="window.location.href=\'siparis-detay.html?id=' + encodeURIComponent(order.id) + '\'">';
        html += `<td style="font-weight:600;color:var(--green-dark);">${escapeHtml(order.id || '-')}</td>`;
        html += `<td style="font-weight:500;">${escapeHtml(cleanText(order.customerName) || '-')}</td>`;
        html += `<td style="color:var(--muted);">${escapeHtml(order.customerEmail || '-')}</td>`;
        html += `<td style="color:var(--muted);" title="${escapeHtml(itemsText)}">${escapeHtml(itemsShort)}</td>`;
        html += `<td style="font-weight:600;">₺${escapeHtml(order.total || '0')}</td>`;
        html += `<td style="color:var(--muted);">${orderDate}</td>`;
        html += `<td>${statusBadge}</td>`;
        html += `<td style="color:var(--muted);" title="${escapeHtml(addressText)}">${escapeHtml(addressShort)}</td>`;
        html += '</tr>';
      });
      
      html += '</tbody></table>';
      
      document.getElementById('ordersContent').innerHTML = html;
    }

    // Refresh button handler
    document.getElementById('refreshBtn').addEventListener('click', async () => {
      console.log('Refresh button clicked');
      const btn = document.getElementById('refreshBtn');
      btn.disabled = true;
      btn.textContent = '⏳ Yenileniyor...';
      
      await loadOrders();
      
      btn.disabled = false;
      btn.textContent = '🔄 Siparişleri Yenile';
    });

    // Load orders on page load
    loadOrders();
  </script>
</body>
</html>
