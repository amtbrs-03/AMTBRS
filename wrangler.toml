name = "ern-site"
main = "cloudflare-worker/src/index.js"
compatibility_date = "2025-12-02"

[vars]
GITHUB_OWNER = "amtbrs-03"
GITHUB_REPO = "AMTBRS"
GITHUB_BRANCH = "site-release"
TO_EMAIL = "amtbrs@icloud.com"
FROM_EMAIL = "no-reply@ern-cicek.com.tr"

# Unicode TTF font for invoice PDFs (Turkish characters)
# NOTE: Base64 secrets are too small for full TTFs on Cloudflare (limit ~5KB).
# Recommended: host a .ttf at a public URL and set it here.
INVOICE_FONT_URL = "https://github.com/googlefonts/noto-fonts/raw/main/hinted/ttf/NotoSans/NotoSans-Regular.ttf"

# Optional (not recommended): base64 TTF support exists for compatibility,
# but most real TTF files exceed Cloudflare secret size limits.
